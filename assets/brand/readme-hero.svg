        <rect x="226" y="248" width="100" height="16" rx="8" opacity=".78"/>
        <rect x="226" y="290" width="86" height="16" rx="8" opacity=".60"/>
      </g>
    </g>
    <g font-family="Inter, Segoe UI, DejaVu Sans, sans-serif">
      <text x="389" y="159" fill="#f4fff9" font-size="91" font-weight="800" letter-spacing="5">DVX3</text>
      <text x="394" y="214" fill="#83e5cb" font-size="32" font-weight="600" letter-spacing="7">BACKUP MANAGER</text>
      <text x="394" y="273" fill="#c8dadb" font-size="27" font-weight="400">Your backups. Your keys. Your machine.</text>
