      <stop offset="0" stop-color="#152b40"/>
      <stop offset="1" stop-color="#081622"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1f3c9"/>
      <stop offset=".48" stop-color="#43dcb8"/>
      <stop offset="1" stop-color="#1aa6b7"/>
