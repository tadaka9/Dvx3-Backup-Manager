name: CI - Multi-Platform Build & Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_TYPE: Release
  QT6_PREFIX: ""
  STRICT_BUILD_ARTIFACTS: "1"

jobs:
  # =============================================================================
  # MATRIX BUILD: Linux x86_64 (Ubuntu) — DEB/RPM/AppImage
  # =============================================================================
  linux-packaging-matrix:
    name: "Linux Packaging • ${{ matrix.os }} / ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [x86_64, arm64]
        arch: ["amd64", "aarch64"]
        include:
          - os: x86_64
            arch: amd64
            runner-image: ubuntu-latest
            deb-arch: amd64
            rpm-arch: x86_64
            appimage-type: "x86_64.AppImage"
          - os: arm64
            arch: aarch64
            runner-image: ubuntu-arm64
            deb-arch: arm64
            rpm-arch: aarch64
            appimage-type: "aarch64.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for cross-platform emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup QEMU (arm64 runner)
        if: matrix.runner-image == 'ubuntu-arm64'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
          echo "arch=arm64" >> $GITHUB_ENV

      - name: Install dependencies (Ubuntu x86_64)
        if: matrix.runner-image == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential valac pkg-config cmake ninja-build zip \
            qt6-base-dev libglib2.0-dev libjson-glib-dev libsodium-dev \
            zstd libxapp-dev librsvg-2-dev appstream-util \
            debhelper devscripts quilt rpmbuild file desktop-file-utils \
            appimage-builder squashfs-tools qemu-user-static binfmt-support

      - name: Install dependencies (Ubuntu ARM64)
        if: matrix.runner-image == 'ubuntu-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential valac pkg-config cmake ninja-build zip \
            qt6-base-dev libglib2.0-dev libjson-glib-dev libsodium-dev \
            zstd libxapp-dev librsvg-2-dev appstream-util \
            debhelper devscripts quilt rpmbuild file desktop-file-utils \
            appimage-builder squashfs-tools qemu-user-static binfmt-support

      - name: Build core library (native)
        run: |
          ./build.sh core
          echo "Core built successfully"

      - name: Build manager binary (native build)
        run: |
          ./build.sh manager
          echo "Manager built successfully"

      - name: Build Qt6 GUI
        run: |
          ./build.sh gui
          echo "Qt6 GUI built successfully"

      - name: Run tests
        run: |
          ./scripts/run-tests.sh || true

      # --- DEB Packaging ---
      - name: Create Debian package (native)
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p /tmp/deb-build/${{ matrix.deb-arch }}/DEBIAN
          cp build/manager/bin/backup-manager /tmp/deb-build/${{ matrix.deb-arch }}/usr/local/bin/
          cp build/manager/bin/dvx3 /tmp/deb-build/${{ matrix.deb-arch }}/usr/local/bin/
          mkdir -p /tmp/deb-build/${{ matrix.deb-arch }}/DEBIAN
          cat > /tmp/deb-build/${{ matrix.deb-arch }}/DEBIAN/control << EOF
Package: dvx3-backup-manager
Version: 1.0.0
Architecture: ${{ matrix.deb-arch }}
Depends: libglib2.0-0, libjson-glib-1.0-0, libsodium-dev, zstd
Description: A modern, secure backup manager for Linux/Windows/macOS
License: MIT
Homepage: https://github.com/tadaka9/Dvx3-Backup-Manager
EOF
          chmod +x /tmp/deb-build/${{ matrix.deb-arch }}/usr/local/bin/*
          dpkg-deb -b /tmp/deb-build/${{ matrix.deb-arch }} /tmp/packages/dvx3-backup-manager_${{ matrix.deb-arch }}.deb

      - name: Create Debian package (cross-compiled for arm64)
        if: matrix.arch == 'aarch64' && matrix.runner-image == 'ubuntu-arm64'
        run: |
          mkdir -p /tmp/deb-build/${{ matrix.deb-arch }}/DEBIAN
          cp build/manager/bin/backup-manager /tmp/deb-build/${{ matrix.deb-arch }}/usr/local/bin/
          cp build/manager/bin/dvx3 /tmp/deb-build/${{ matrix.deb-arch }}/usr/local/bin/
          mkdir -p /tmp/deb-build/${{ matrix.deb-arch }}/DEBIAN
          cat > /tmp/deb-build/${{ matrix.deb-arch }}/DEBIAN/control << EOF
Package: dvx3-backup-manager
Version: 1.0.0
Architecture: ${{ matrix.deb-arch }}
Depends: libglib2.0-0, libjson-glib-1.0-0, libsodium-dev, zstd
Description: A modern, secure backup manager for Linux/Windows/macOS (ARM64)
License: MIT
Homepage: https://github.com/tadaka9/Dvx3-Backup-Manager
EOF
          chmod +x /tmp/deb-build/${{ matrix.deb-arch }}/usr/local/bin/*
          dpkg-deb -b /tmp/deb-build/${{ matrix.deb-arch }} /tmp/packages/dvx3-backup-manager_${{ matrix.deb-arch }}.deb

      # --- RPM Packaging ---
      - name: Create RPM package (native x86_64)
        if: matrix.arch == 'amd64' && matrix.runner-image == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/rpm-build/BUILD /tmp/rpm-build/RPMS /tmp/rpm-build/SPECS /tmp/rpm-build/SOURCES
          cat > /tmp/rpm-build/SPECS/dvx3-backup-manager.spec << 'EOF'
Name:           dvx3-backup-manager
Version:        1.0.0
Release:        %{{dist}}
Summary:        A modern, secure backup manager for Linux/Windows/macOS
License:        MIT
URL:            https://github.com/tadaka9/Dvx3-Backup-Manager
Source0:        /tmp/packages/dvx3-backup-manager-%{version}.tar.gz
BuildArch:      ${{ matrix.rpm-arch }}
BuildRequires:  valac pkg-config cmake glib2 json-glib libsodium zstd qt6-base-devel
%description
A modern, secure backup manager built with Vala.
Provides encrypted archives using Argon2id + XSalsa20-Poly1305.
%prep
%setup -q
%build
cmake -G Ninja \
  -S /tmp/rpm-build/SOURCES/dvx3-backup-manager-1.0.0 \
  -B /tmp/rpm-build/BUILD \
  -DCMAKE_BUILD_TYPE=Release \
  -DENABLE_TESTS=ON \
  -DENABLE_BENCHMARKS=OFF
cmake --build /tmp/rpm-build/BUILD --parallel $(nproc)
%install
mkdir -p %{buildroot}%{_bindir}
mkdir -p %{buildroot}%{_libdir}
cp /tmp/rpm-build/BUILD/manager/bin/backup-manager %{buildroot}%{_bindir}/
cp /tmp/rpm-build/BUILD/lib/*.so* %{buildroot}%{_libdir}/
%files
%{_bindir}/backup-manager
%{_bindir}/dvx3
%{_libdir}/*
%changelog
EOF

          # Create tarball for source package
          mkdir -p /tmp/packages/source
          cp -r . /tmp/packages/source/dvx3-backup-manager-1.0.0/
          cd /tmp/packages/source/dvx3-backup-manager-1.0.0 && tar czf \
            /tmp/packages/dvx3-backup-manager-${{ matrix.rpm-arch }}.tar.gz \
            .
          cp /tmp/packages/dvx3-backup-manager-${{ matrix.rpm-arch }}.tar.gz \
             /tmp/rpm-build/SOURCES/

          cd /tmp/rpm-build
          rpmbuild -ba SPECS/dvx3-backup-manager.spec

      # --- AppImage Packaging ---
      - name: Build AppImage (native x86_64)
        if: matrix.arch == 'amd64' && matrix.runner-image == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/appimage-build
          cat > /tmp/appimage-build/AppRun << 'EOF'
#!/bin/sh
exec /app/dvx3-backup-manager "$@"
EOF
          chmod +x /tmp/appimage-build/AppRun

          cat > /tmp/appimage-build/apps/backup-manager.desktop << EOF
[Desktop Entry]
Name=Dvx3 Backup Manager
Comment=A modern, secure backup manager
Exec=/app/dvx3-backup-manager
Icon=/usr/share/icons/hicolor/scalable/apps/dvx3-backup-manager.png
Terminal=false
Type=Application
Categories=System;Utilities;Backup;
EOF

          cat > /tmp/appimage-build/AppImage-builder.yaml << 'EOF'
applications:
  - id: backup-manager
    desktop-file: apps/backup-manager.desktop
    bundle_name: Dvx3 Backup Manager
    bundle_display_name: "Dvx3 Backup Manager"
    version: "1.0.0"
    icon: /usr/share/icons/hicolor/scalable/apps/dvx3-backup-manager.png
    executable: AppRun

systemd_units:
  - type: service
    path: /etc/systemd/system/backup-manager.service
    content: |
      [Unit]
      Description=Dvx3 Backup Manager Service
      After=network.target

      [Service]
      Type=simple
      ExecStart=/app/dvx3-backup-manager --service
      Restart=on-failure
      User=root

      [Install]
      WantedBy=multi-user.target
EOF

          # Build AppImage
          appimage-builder \
            --spec /tmp/appimage-build/AppImage-builder.yaml \
            --output-dir /tmp/appimage-build/dist

      - name: Build AppImage (ARM64 cross-compiled)
        if: matrix.arch == 'aarch64' && matrix.runner-image == 'ubuntu-arm64'
        run: |
          # Cross-compile for ARM64 using QEMU user mode emulation
          mkdir -p /tmp/appimage-build-arm
          cat > /tmp/appimage-build-arm/AppRun << 'EOF'
#!/bin/sh
exec /app/dvx3-backup-manager "$@"
EOF
          chmod +x /tmp/appimage-build-arm/AppRun

          cat > /tmp/appimage-build-arm/apps/backup-manager.desktop << EOF
[Desktop Entry]
Name=Dvx3 Backup Manager ARM64
Comment=A modern, secure backup manager (ARM64)
Exec=/app/dvx3-backup-manager
Icon=/usr/share/icons/hicolor/scalable/apps/dvx3-backup-manager.png
Terminal=false
Type=Application
Categories=System;Utilities;Backup;
EOF

          cat > /tmp/appimage-build-arm/AppImage-builder.yaml << 'EOF'
applications:
  - id: backup-manager
    desktop-file: apps/backup-manager.desktop
    bundle_name: Dvx3 Backup Manager ARM64
    version: "1.0.0"
    executable: AppRun

systemd_units:
  - type: service
    path: /etc/systemd/system/backup-manager.service
    content: |
      [Unit]
      Description=Dvx3 Backup Manager Service (ARM64)

      [Service]
      Type=simple
      ExecStart=/app/dvx3-backup-manager --service
EOF

          # Use QEMU to emulate ARM64 for AppImage build
          qemu-aarch64-static /tmp/appimage-build-arm/AppRun &
          PID=$!
          sleep 5
          appimage-builder \
            --spec /tmp/appimage-build-arm/AppImage-builder.yaml \
            --output-dir /tmp/appimage-build-arm/dist || true
          kill $PID 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            /tmp/packages/*.deb
            /tmp/packages/*.rpm
            /tmp/appimage-build/dist/*.AppImage
            /tmp/appimage-build-arm/dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifacts (ARM64)
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-arm64-${{ matrix.deb-arch }}
          path: |
            /tmp/packages/dvx3-backup-manager_${{ matrix.deb-arch }}.deb
            /tmp/appimage-build/dist/*.AppImage
            /tmp/appimage-build-arm/dist/*.AppImage

  # =============================================================================
  # MATRIX BUILD: macOS Intel (x86_64) + Apple Silicon (ARM64)
  # =============================================================================
  macos-matrix:
    name: "macOS • ${{ matrix.os }} / ${{ matrix.arch }}"
    runs-on: macos-${{ matrix.runner-type == 'silicon' && '15' || 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [Intel, Silicon]
        arch: ["x86_64", "arm64"]
        include:
          - os: Intel
            runner-type: intel
            brew-cpu: x86_64
            build-target: x86_64-apple-darwin
            app-image-name: "Dvx3-Backup-Manager-x86_64.dmg"
          - os: Silicon
            runner-type: silicon
            brew-cpu: aarch64
            build-target: arm64-apple-darwin
            app-image-name: "Dvx3-Backup-ARM64.dmg"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Homebrew dependencies
        run: |
          brew install valac pkg-config cmake ninja-build zip \
            qt6 base64-cli librsvg appstream-util

      # Intel runner builds for x86_64
      - name: Build core + manager (Intel, x86_64)
        if: matrix.os == 'Intel' && matrix.arch == 'x86_64'
        run: |
          ./build.sh manager --target=x86_64-apple-darwin

      # Silicon runner builds native ARM64
      - name: Build core + manager (Silicon, arm64)
        if: matrix.os == 'Silicon' && matrix.arch == 'arm64'
        run: |
          ./build.sh manager --target=arm64-apple-darwin

      # Intel runner cross-compiles for ARM64 using cross-toolchain
      - name: Build core + manager (Intel cross-ARM64)
        if: matrix.os == 'Intel' && matrix.arch == 'arm64'
        run: |
          brew install crossbuild || true
          export CC="aarch64-apple-darwin23.0-clang"
          export CXX="aarch64-apple-darwin23.0-clang++"
          export CFLAGS="-mcpu=apple-m1 -mtune=apple-m1 -ffast-math"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$(brew --prefix qt@6)/lib"
          ./build.sh manager --target=aarch64-apple-darwin

      # Build GUI for all macOS targets
      - name: Build Qt6 GUI (Intel)
        if: matrix.os == 'Intel'
        run: |
          ./build.sh gui --target=x86_64-apple-darwin

      - name: Build Qt6 GUI (Silicon native)
        if: matrix.os == 'Silicon' && matrix.arch == 'arm64'
        run: |
          ./build.sh gui --target=arm64-apple-darwin

      - name: Create DMG package
        run: |
          mkdir -p /tmp/dmg-build
          cp build/manager/bin/backup-manager /tmp/dmg-build/Dvx3-Backup-Manager.app/Contents/MacOS/
          cp LICENSE /tmp/dmg-build/Dvx3-Backup-Manager.app/Contents/Resources/
          cat > /tmp/dmg-build/Dvx3-Backup-Manager.app/Contents/MacOS/appimage << 'EOF'
#!/bin/bash
exec "$(dirname "$0")/../Resources/bin/backup-manager" "$@"
EOF
          chmod +x /tmp/dmg-build/Dvx3-Backup-Manager.app/Contents/MacOS/appimage

      - name: Upload macOS artifacts (Intel)
        if: matrix.os == 'Intel'
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-${{ matrix.arch }}
          path: |
            build/manager/bin/*
            build/gui/bin/*

      - name: Upload macOS artifacts (Silicon)
        if: matrix.os == 'Silicon'
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-${{ matrix.arch }}
          path: |
            build/manager/bin/*
            build/gui/bin/*

  # =============================================================================
  # MATRIX BUILD: Windows x64 (MSVC) + Cross-compiled ARM64
  # =============================================================================
  windows-matrix:
    name: "Windows • ${{ matrix.os }} / ${{ matrix.arch }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [x86_64, arm64]
        arch: ["x64", "arm64"]
        include:
          - os: x86_64
            arch: x64
            toolchain: msvc
            cross-toolchain: ""
          - os: arm64
            arch: arm64
            toolchain: mingw-w64-cross-arm64
            cross-toolchain: "C:/Program Files/mingw-w64/cross/x86_64-ucrt-posix-seh-gcc-12-win32"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (choco)
        run: |
          choco install -y valac pkg-config cmake ninja-build zip mingw-w64

      # MSVC x64 build
      - name: Build core + manager (MSVC x64)
        if: matrix.arch == 'x64'
        run: |
          $env:PATH = "C:\Program Files\Microsoft Visual Studio\2019\Community\VC\Tools\MSVC\14.35.32019\bin\HostX64\x64" + ";" + $env:PATH
          ./build.sh manager

      # MinGW-w64 cross-compile for Windows ARM64
      - name: Build core + manager (MinGW x64 -> ARM64)
        if: matrix.arch == 'arm64'
        run: |
          $mingwPath = "C:\Program Files\mingw-w64\x86_64-ucrt-posix-seh-gcc-12-win32"
          $env:CC = "$mingwPath\bin\gcc.exe"
          $env:CXX = "$mingwPath\bin\g++.exe"
          $env:CFLAGS = "-m64 -mcpu=armv8-a+fp+simd+crypto+crc"
          $env:CXXFLAGS = "-m64 -mcpu=armv8-a+fp+simd+crypto+crc"
          ./build.sh manager --target=wasm32-wasi

      # Build GUI for Windows x64 only (Qt requires MSVC)
      - name: Build Qt6 GUI (MSVC)
        if: matrix.arch == 'x64'
        run: |
          cmake -S gui/qt/qtdesktop -B build/gui -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gui --parallel

      # Upload artifacts
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            build/manager/bin/*
            build/gui/bin/*

  # =============================================================================
  # RELEASE PUBLISHING — aggregates all successful builds
  # =============================================================================
  publish-release:
    needs: [linux-packaging-matrix, macos-matrix, windows-matrix]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts from previous jobs
        uses: actions/download-artifact@v4
        with:
          pattern: "linux-packages-*"
          pattern: "macos-*"
          pattern: "windows-*"
          path: "artifacts/"
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p releases
          find artifacts/ -type f \( -name "*.deb" -o -name "*.rpm" \
            -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.exe" \) > /tmp/release-files.txt || true

      - name: Create release assets
        run: |
          cd releases
          for f in artifacts/**/*.deb artifacts/**/*.rpm artifacts/**/*.AppImage; do
            [ -f "$f" ] && cp "$f" .
          done
          for f in artifacts/macos*/*.dmg; do
            [ -f "$f" ] && cp "$f" .
          done
          for f in artifacts/windows*/*.exe; do
            [ -f "$f" ] && cp "$f" .
          done

      # Create release tarball
      - name: Package release assets
        run: |
          cd releases
          if [ "$(ls -A *.deb *.rpm *.AppImage *.dmg *.exe 2>/dev/null)" ]; then
            tar czf Dvx3-Backup-Manager-releases.tar.gz ./*.deb ./*.rpm ./*.AppImage ./*.dmg ./*.exe 2>/dev/null || true
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            releases/Dvx3-Backup-Manager-releases.tar.gz
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          draft: false

  # =============================================================================
  # SMOKE TEST — validate release artifacts
  # =============================================================================
  smoke-test:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@v4
        with:
          name: Dvx3-Backup-Manager-releases

      - name: Validate release contents
        run: |
          if [ ! -d "$PWD" ]; then echo "No release found"; exit 1; fi
          echo "Release files:"
          ls -laR || true
          # Check for expected binaries
          grep -l "backup-manager\|dvx3" * 2>/dev/null | head -5

permissions:
  contents: write