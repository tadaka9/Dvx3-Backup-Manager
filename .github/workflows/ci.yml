# DVX3 Backup Manager — GitHub Actions CI Workflow
name: CI — Build, Test & Lint

on: [push]

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Valac
        run: |
          sudo apt-get update > /dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y valac libglib2.0-dev libjson-glib-1.0-dev libsodium-dev build-essential pkg-config

      - name: Verify Vala
        run: valac --version

      - name: Build project
        run: make all VERBOSE=0

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Valac and dependencies
        run: |
          sudo apt-get update > /dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            valac libglib2.0-dev libjson-glib-1.0-dev libsodium-dev \
            build-essential pkg-config

      - name: Build with Valac
        run: make all VERBOSE=1

      - uses: actions/upload-artifact@v4
        with:
          name: dvx3-cli-linux-x64
          path: dvx3-cli
          retention-days: 7

  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build stripped binary
        run: |
          sudo apt-get update > /dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y valac libglib2.0-dev build-essential pkg-config strip > /dev/null 2>&1
          make clean && make all VERBOSE=0
          strip dvx3-cli

      - uses: actions/upload-artifact@v4
        with:
          name: dvx3-releases
          path: |
            dvx3-cli
            README.md
          retention-days: 14