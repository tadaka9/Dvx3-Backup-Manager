name: Native Vala build and tests
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux native (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valac pkg-config cmake qt6-base-dev \
            libglib2.0-dev libjson-glib-dev libsodium-dev zstd gzip bzip2 xz-utils \
            lz4 brotli 7zip zpaq shellcheck
      - name: Validate shell scripts
        run: |
          bash -n build.sh scripts/run-tests.sh
          shellcheck build.sh scripts/run-tests.sh install.sh uninstall.sh run_gui.sh
      - name: Build every component and test real archive round trips
        env:
          DVX3_REQUIRE_CODECS: none,zstd,gzip,bzip2,xz,lzma,lz4,brotli,7z,zpaq
        run: ./build.sh all test
      - name: Render the Qt window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/bin/dvx3-backup-manager --smoke-test
  macos:
    # Candidate platforms: these jobs must pass before claiming verified support.
    name: macOS native (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: brew install vala pkgconf cmake qt glib json-glib libsodium zstd gzip bzip2 xz lz4 brotli sevenzip zpaq
      - name: Build and test
        env:
          DVX3_REQUIRE_CODECS: none,zstd,gzip,bzip2,xz,lzma,lz4,brotli,7z,zpaq
        run: |
          qt_prefix="$(brew --prefix qt)"
          gzip_prefix="$(brew --prefix gzip)"
          bzip_prefix="$(brew --prefix bzip2)"
          export CMAKE_PREFIX_PATH="$qt_prefix"
          export PATH="$gzip_prefix/bin:$bzip_prefix/bin:$PATH"
          ./build.sh all test
      - name: Render the Qt window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/bin/dvx3-backup-manager --smoke-test
  windows:
    name: Windows x64 native (MSYS2 UCRT64, candidate)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make tar gzip bzip2 xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-lz4
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-7zip
            mingw-w64-ucrt-x86_64-qt6-base
      - name: Build and test native binaries
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
          DVX3_REQUIRE_CODECS: none,zstd,gzip,bzip2,xz,lzma,lz4,brotli,7z
        run: ./build.sh all test
      - name: Render the Qt window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/bin/dvx3-backup-manager.exe --smoke-test
