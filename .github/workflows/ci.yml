name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential valac pkg-config cmake qt6-base-dev \
            libglib2.0-dev libjson-glib-dev libsodium-dev zstd

      - name: Build
        run: ./build.sh manager

      - name: Smoke check built binaries
        run: |
          test -x build/bin/dvx3
          test -x build/bin/backup-manager

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/bin/
            build/lib/
          if-no-files-found: ignore
          retention-days: 7
