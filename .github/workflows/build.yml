name: Build Backup Manager

on:
  push:
    branches: [clean-version]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # WINDOWS BUILD (MSYS2)
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]   # aggiungere arm64 se necessario
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify MSVC environment
        shell: pwsh
        run: |
          Write-Output "=== MSVC Diagnostics ==="
          Write-Output "Visual Studio Locator version:"
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format text -property displayName,installationPath || Write-Output "vswhere not found"
          Write-Output "Which cl.exe:"
          Get-Command cl.exe -ErrorAction SilentlyContinue || Write-Output "cl.exe not found"
          Write-Output "PATH: $env:PATH"

      - name: Cache ccache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        name: Build Backup Manager

        on:
          push:
            branches: [clean-version]
          pull_request:

        with:
          path: C:\Users\runneradmin\AppData\Local\ccache
          key: ${{ runner.os }}-ccache-windows-${{ hashFiles('**/*.c','**/*.cpp') }}
          restore-keys: |
            ${{ runner.os }}-ccache-windows-

      - name: Install MSYS2 & required packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
          # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # MULTI-DISTRO LINUX BUILD
  # ------------------------------------------------------------------
  build-linux-matrix:
    runs-on: ${{ matrix.distro }}
    strategy:
      matrix:
        distro: [ubuntu-latest, archlinux, fedora-latest]
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            valac libjson-glib-dev libsodium-dev zstd tar imagemagick \
            ninja-build ccache libgtest-dev qt6-base-dev qt6-tools-dev
      - name: Install dependencies (Arch)
        if: matrix.distro == 'archlinux'
        run: |
          sudo pacman -Syu --noconfirm
          sudo pacman -S --noconfirm base-devel cmake pkgconf vala json-glib libsodium zstd tar imagemagick ninja ccache gtest qt6-base qt6-tools
      - name: Install dependencies (Fedora)
        if: matrix.distro == 'fedora-latest'
        run: |
          sudo dnf -y update
          sudo dnf -y install @development-tools cmake pkgconf-pkg-config vala json-glib-devel libsodium-devel zstd tar ImageMagick ninja-build ccache gtest qt6-qtbase-devel qt6-qttools-devel
      - name: Build GUI
        run: |
          chmod +x build_gui.sh
          ./build_gui.sh || exit 1
      - name: Prepare Linux releases
        run: |
          mkdir -p Releases/linux
          cp backup-manager backup-manager-gui dvx3 libdvx3.so Releases/linux/ || true
          # Copy libsodium shared library if present
          cp /usr/lib/libsodium.so.* Releases/linux/ 2>/dev/null || cp /usr/local/lib/libsodium.so.* Releases/linux/ 2>/dev/null || echo "libsodium.so.* not found in /usr/lib or /usr/local/lib"
      - name: Package Linux tarball
        run: |
          tar -czf Releases/Dvx3-Backup-Manager-Linux-${{ matrix.distro }}.tar.gz -C Releases/linux .
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-Linux-${{ matrix.distro }}
          path:
            - Releases/Dvx3-Backup-Manager-Linux-${{ matrix.distro }}.tar.gz
              - name: Install MinGW-w64 toolchain
                shell: msys2 {0}
                run: |
                  pacman -S --noconfirm --needed mingw-w64-x86_64-toolchain
              - name: Install MinGW-w64 Qt6 packages
                shell: msys2 {0}
                run: |
                  pacman -S --noconfirm --needed mingw-w64-x86_64-qt6-base
                  pacman -S --noconfirm --needed mingw-w64-x86_64-qt6-tools
                  pacman -S --noconfirm --needed mingw-w64-x86_64-pkg-config
                  pacman -S --noconfirm --needed mingw-w64-x86_64-vala
                  pacman -S --noconfirm --needed mingw-w64-x86_64-ninja
                  pacman -S --noconfirm --needed mingw-w64-x86_64-cmake
                  pacman -S --noconfirm --needed mingw-w64-x86_64-json-glib
                  pacman -S --noconfirm --needed mingw-w64-x86_64-libsodium
                  pacman -S --noconfirm --needed mingw-w64-x86_64-gtest
                  pacman -S --noconfirm --needed upx
      - name: Verify Qt6 installation
        shell: msys2 {0}
        run: |
          echo "Checking Qt6Widgets with pkg-config"
          pkg-config --modversion Qt6Widgets || true
          echo "Locating moc"
          which moc || true
          echo "PATH:"
          echo $PATH
          echo "Listing Qt6 packages"
          pacman -Qs qt6 || true

      - name: Install NSIS (optional)
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed msys/nsis || true
          pacman -S --noconfirm --needed mingw-w64-x86_64-nsis || true

      - name: Build all components (MSYS2)
        shell: msys2 {0}
        run: |
          chmod +x build-all.sh
          sed -i 's/\r$//' build-all.sh
          ./build-all.sh || true  # Changed to || true to prevent failure on script logic issues

      - name: Build Backup Manager GUI
        shell: msys2 {0}
        run: |
          chmod +x build_gui.sh
          sed -i 's/\r$//' build_gui.sh
          ./build_gui.sh || exit 1

      - name: Deploy Qt dependencies
        shell: msys2 {0}
        run: |
          if command -v windeployqt >/dev/null 2>&1; then
            mkdir -p Releases
            windeployqt --dir Releases backup-manager-gui || true
            echo "Qt dependencies deployed"
          else
            echo "windeployqt not installed – skipping"
          fi

      - name: Prepare Releases folder
        shell: msys2 {0}
        run: |
          mkdir -p Releases
          # GUI
          if [ -f backup-manager-gui.exe ]; then
            mv backup-manager-gui.exe "Releases/Dvx3 Backup Manager.exe"
          fi
          # CLI
          if [ -f dvx3.exe ]; then
            cp dvx3.exe Releases/
          fi
          # Copy required MSYS2 utilities
          cp /usr/bin/tar.exe /usr/bin/zstd.exe /usr/bin/sh.exe Releases/ || true
          # Qt platform plugins
          PLUGIN_SRC="/mingw64/share/qt6/plugins/platforms"
          PLUGIN_DST="Releases/platforms"
          mkdir -p "$PLUGIN_DST"
          if [ -d "$PLUGIN_SRC" ]; then
            cp "$PLUGIN_SRC"/*.dll "$PLUGIN_DST"/
          fi

      - name: Compress binaries with UPX
        shell: bash
        run: |
          if command -v upx >/dev/null 2>&1; then
            upx --best --lzma "Releases/Dvx3 Backup Manager.exe" || true
          else
            echo "UPX not available – skipping compression"
          fi

      - name: Create ZIP archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd Releases
          powershell -Command "Compress-Archive -Path * -DestinationPath 'Dvx3-Backup-Manager-Windows.zip' -Force"
          sha256sum Dvx3-Backup-Manager-Windows.zip > Dvx3-Backup-Manager-Windows.zip.sha256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-Windows
          path:
            - Releases/Dvx3-Backup-Manager-Windows.zip
            - Releases/Dvx3-Backup-Manager-Windows.zip.sha256

      - name: CI diagnostics on failure (Windows)
        if: failure()
        shell: msys2 {0}
        run: |
          echo "=== Windows CI failure diagnostics ==="
          ls -la
          ls -la Releases || true
          echo "PATH:"
          echo $PATH
          which moc || true

  # ------------------------------------------------------------------
  # LINUX BUILD (native & cross‑compile)
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v3

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.arch }}-${{ hashFiles('**/*.c','**/*.cpp','**/*.h') }}-v1
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies (native)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            valac libjson-glib-dev libsodium-dev zstd tar imagemagick \
            ninja-build ccache libgtest-dev qt6-base-dev qt6-tools-dev || exit 1

      - name: Install dependencies (cross‑compile)
        if: matrix.arch != 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support || exit 1

      - name: Configure ccache (native)
        if: matrix.arch == 'x86_64'
        run: |
          ccache -M 5G
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Ensure static libsodium (optional)
        run: |
          if [ "${FORCE_STATIC_LIBSODIUM:-0}" -eq 1 ]; then
            if ! ls /usr/lib/libsodium.a /usr/local/lib/libsodium.a 2>/dev/null; then
              echo "Building static libsodium from source"
              wget -qO /tmp/libsodium.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
              tar -xzf /tmp/libsodium.tar.gz -C /tmp
              pushd /tmp/libsodium-1.0.20
              CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --prefix=/usr/local --enable-static --disable-shared
              make -j$(nproc)
              sudo make install
              popd
            fi
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          fi

      - name: Build GUI (Linux native)
        if: matrix.arch == 'x86_64'
        run: |
          chmod +x build_gui.sh
          ./build_gui.sh || exit 1

      - name: Build GUI (cross‑compile)
        if: matrix.arch != 'x86_64'
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD":/src -w /src debian:trixie bash -c '
            set -ex
            apt-get update
            apt-get install -y build-essential cmake pkg-config valac libjson-glib-dev libsodium-dev zstd tar imagemagick ninja-build ccache libgtest-dev qt6-base-dev qt6-tools-dev || exit 1
            ccache -M 5G
            export CCACHE_DIR=$HOME/.cache/ccache
            export PATH=/usr/lib/ccache:$PATH
            export CC=gcc
            export CXX=g++
            chmod +x build_gui.sh
            ./build_gui.sh || exit 1
          '

      - name: Prepare Linux releases
        run: |
          mkdir -p Releases/linux
          cp backup-manager backup-manager-gui dvx3 libdvx3.so Releases/linux/ || true
          # Copy libsodium shared library if present
          cp /usr/lib/libsodium.so.* Releases/linux/ 2>/dev/null || cp /usr/local/lib/libsodium.so.* Releases/linux/ 2>/dev/null || echo "libsodium.so.* not found in /usr/lib or /usr/local/lib"

      - name: Package Linux tarball
        run: |
          tar -czf Releases/Dvx3-Backup-Manager-Linux.tar.gz -C Releases/linux .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-Linux-${{ matrix.arch }}
          path: Releases/Dvx3-Backup-Manager-Linux.tar.gz

      - name: CI diagnostics on failure (Linux)
        if: failure()
        run: |
          echo "=== Linux CI failure diagnostics ==="
          ls -la
          ls -la Releases || true
          ldd backup-manager || true
          ldd backup-manager-gui || true
          ldd dvx3 || true

  # ------------------------------------------------------------------
  # MACOS BUILD
  # ------------------------------------------------------------------
  build-macos:
    runs-on: macos-${{ matrix.arch == 'arm64' && 'latest' || '12' }}
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v3

      - name: Install Homebrew packages
        run: |
          brew update
          brew install --cask qctools
          brew install pkg-config vala glib json-glib libsodium zstd qt@6 ninja cmake ccache || exit 1
      - name: Ensure Qt6 moc is available (macOS)
        run: |
          FOUND_MOC=""
          for MOC_PATH in \
            /opt/homebrew/opt/qt@6/libexec/moc \
            /opt/homebrew/opt/qt@6/bin/moc \
            /usr/local/opt/qt@6/libexec/moc \
            /usr/local/opt/qt@6/bin/moc \
            /opt/homebrew/opt/qt/libexec/moc \
            /opt/homebrew/opt/qt/bin/moc \
            /usr/local/opt/qt/libexec/moc \
            /usr/local/opt/qt/bin/moc \
            /mingw64/lib/qt6/libexec/moc \
            /mingw64/bin/moc; do
            if [ -f "$MOC_PATH" ]; then
              ln -sf "$MOC_PATH" /usr/local/bin/moc
              echo "Symlinked moc from $MOC_PATH to /usr/local/bin/moc"
              FOUND_MOC="$MOC_PATH"
              break
            fi
          done
          if [ -z "$FOUND_MOC" ]; then
            echo "moc not found in any known location, building Qt6 from source..."
            curl -LO https://download.qt.io/official_releases/qt/6.10/6.10.1/single/qt-everywhere-src-6.10.1.tar.xz
            tar -xf qt-everywhere-src-6.10.1.tar.xz
            cd qt-everywhere-src-6.10.1
            brew install cmake ninja python3 pkg-config || true
            mkdir build && cd build
            ../configure -prefix $HOME/Qt6 -release -opensource -confirm-license -nomake examples -nomake tests
            cmake --build . --parallel
            cmake --install .
            export PATH="$HOME/Qt6/bin:$PATH"
            ln -sf "$HOME/Qt6/bin/moc" /usr/local/bin/moc
            echo "Built and symlinked moc from Qt6 source to /usr/local/bin/moc"
          fi
          which moc || exit 1

      - name: Configure ccache
        run: |
          ccache -M 5G
          echo "PATH=$(brew --prefix ccache)/libexec:$PATH" >> $GITHUB_ENV

      - name: Symlink Qt6 moc from libexec if present
        run: |
          set -ex
          echo "Listing Qt6 bin and libexec directories:"
          ls -l /opt/homebrew/opt/qt@6/bin || true
          ls -l /usr/local/opt/qt@6/bin || true
          ls -l /opt/homebrew/opt/qt@6/libexec || true
          ls -l /usr/local/opt/qt@6/libexec || true
          ls -l /opt/homebrew/bin || true
          ls -l /usr/local/bin || true
          # Always check and symlink moc from libexec if present
          if [ -f /opt/homebrew/opt/qt@6/libexec/moc ]; then
            ln -sf /opt/homebrew/opt/qt@6/libexec/moc /usr/local/bin/moc
            echo "Symlinked moc from /opt/homebrew/opt/qt@6/libexec to /usr/local/bin/moc"
          elif [ -f /usr/local/opt/qt@6/libexec/moc ]; then
            ln -sf /usr/local/opt/qt@6/libexec/moc /usr/local/bin/moc
            echo "Symlinked moc from /usr/local/opt/qt@6/libexec to /usr/local/bin/moc"
          elif [ -f /opt/homebrew/opt/qt@6/bin/moc ]; then
            ln -sf /opt/homebrew/opt/qt@6/bin/moc /usr/local/bin/moc
            echo "Symlinked moc from /opt/homebrew/opt/qt@6/bin to /usr/local/bin/moc"
          elif [ -f /usr/local/opt/qt@6/bin/moc ]; then
            ln -sf /usr/local/opt/qt@6/bin/moc /usr/local/bin/moc
            echo "Symlinked moc from /usr/local/opt/qt@6/bin to /usr/local/bin/moc"
          else
            echo "moc not found in bin or libexec!"
          fi
          export PATH=/opt/homebrew/opt/qt@6/bin:/usr/local/opt/qt@6/bin:/usr/local/bin:$PATH
      - name: Set Qt6 PATH (macOS)
        run: |
          echo "PATH=/opt/homebrew/opt/qt@6/bin:/usr/local/opt/qt@6/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Qt6 tools
        run: |
          echo "Current PATH: $PATH"
          which moc || echo "moc not found in PATH"
          ls -la /opt/homebrew/opt/qt@6/bin/moc /usr/local/opt/qt@6/bin/moc 2>/dev/null || echo "moc not in expected locations"

      - name: Build all components (macOS)
        run: |
          export PATH=/opt/homebrew/opt/qt@6/bin:/usr/local/opt/qt@6/bin:$PATH
          chmod +x build-all.sh
          ./build-all.sh || exit 1

      - name: Build GUI (macOS)
        run: |
          export PATH=/opt/homebrew/opt/qt@6/bin:/usr/local/opt/qt@6/bin:$PATH
          chmod +x build_gui.sh
          ./build_gui.sh || exit 1

      - name: Gather releases
        run: |
          mkdir -p Releases
          cp backup-manager backup-manager-gui dvx3 Releases/ || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-macOS-${{ matrix.arch }}
          path: Releases/*

  # ------------------------------------------------------------------
  # OPTIONAL: APPIMAGE (Linux)
  # ------------------------------------------------------------------
  build-linux-appimage:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v3
      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Dvx3-Backup-Manager-Linux-x86_64
          path: .
      - name: Extract Linux build artifacts
        run: |
          tar -xzf Dvx3-Backup-Manager-Linux.tar.gz
          mv Releases/linux/* . || true
          rm -rf Releases
      - name: Install FUSE for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || exit 1
      - name: Build AppImage (if script exists)
        run: |
            # Ensure .desktop file exists in AppDir
            APPDIR="Dvx3BackupManager.AppDir"
            DESKTOP_FILE="$APPDIR/Dvx3BackupManager.desktop"
            if [ ! -d "$APPDIR" ]; then
              echo "AppDir $APPDIR not found, aborting AppImage build."
              exit 1
            fi
              if [ ! -f "$DESKTOP_FILE" ]; then
                echo "Generating minimal desktop file: $DESKTOP_FILE"
                cat <<'EOF' > "$DESKTOP_FILE"
                [Desktop Entry]
                Type=Application
                Name=Dvx3 Backup Manager
                Exec=backup-manager-gui
                Icon=backup-manager
                Categories=Utility;
                EOF
            fi
            # Ensure desktop file is in usr/share/applications for AppImage
            mkdir -p "$APPDIR/usr/share/applications"
            cp "$DESKTOP_FILE" "$APPDIR/usr/share/applications/"
            fi
            # Copy libsodium shared library into AppDir if present
            if ls /usr/lib/libsodium.so.* 1>/dev/null 2>&1; then
              cp /usr/lib/libsodium.so.* "$APPDIR/" || echo "Failed to copy libsodium from /usr/lib"
            elif ls /usr/local/lib/libsodium.so.* 1>/dev/null 2>&1; then
              cp /usr/local/lib/libsodium.so.* "$APPDIR/" || echo "Failed to copy libsodium from /usr/local/lib"
            else
              echo "libsodium.so.* not found in /usr/lib or /usr/local/lib"
            fi
            if [ -x build-appimage.sh ]; then
              ./build-appimage.sh || exit 1
            fi
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-Linux-AppImage
          path: "*.AppImage"