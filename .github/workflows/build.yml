name: Build, Package & Release (Enhanced)

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish as release (e.g. v1.2.3)'
        required: false
        default: ''
      create_tag_if_missing:
        description: 'Auto-create tag if missing (requires RELEASE_PAT)'
        required: false
        default: 'false'
      strict_artifact_checks:
        description: 'Fail on missing artifacts (true|false)'
        required: false
        default: 'true'
      publish_only:
        description: 'Only publish artifacts from another run'
        required: false
        default: 'false'
      publish_artifacts_run_id:
        description: 'Run ID for publish_only mode'
        required: false
        default: ''
  release:
    types: [ published ]

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager
  STRICT_ARTIFACT_CHECKS: ${{ github.event.inputs.strict_artifact_checks || 'true' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  QT6_MIN_VERSION: 6.5.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cache setup for all builds
  cache-setup:
    runs-on: ubuntu-latest
    outputs:
      ccache-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute ccache hash
        id: hash
        run: echo "hash=$(sha256sum CMakeLists.txt build_gui.sh 2>/dev/null || echo 'default' | head -c64)" >> $GITHUB_OUTPUT

  # macOS builds (arm64 + x86_64)
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    needs: cache-setup
    strategy:
      matrix:
        include:
          - arch: arm64
            runs-on: macos-14
          - arch: x86_64
            runs-on: macos-13
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Homebrew & Dependencies
        run: |
          if [[ ! -x "$(command -v brew)" ]]; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            (echo; echo 'eval "$(/opt/homebrew/bin/brew shellenv)"') >> $GITHUB_PATH
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          brew update --force --quiet
          brew install pkg-config vala glib json-glib libsodium zstd ninja cmake ccache create-dmg qt@6 qttools

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ runner.os }}-${{ matrix.arch }}

      - name: Build
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          chmod +x build_gui.sh
          ./build_gui.sh

      - name: Package & Upload
        run: |
          mkdir -p "$RELEASE_DIR/mac/${{ matrix.arch }}"
          find build/ -name "backup-manager-gui*" -exec cp {} "$RELEASE_DIR/mac/${{ matrix.arch }}/" \;
          find build/ -name "libdvx3*" -exec cp {} "$RELEASE_DIR/mac/${{ matrix.arch }}/lib/" \;
          tar -czf "${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" -C "$RELEASE_DIR/mac/${{ matrix.arch }}" .
          shasum -a 256 "${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" > "${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz.sha256"
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz*
            ${{ env.RELEASE_DIR }}/mac/${{ matrix.arch }}/*

  # Windows builds
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: cache-setup
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'x86_64' && 'MINGW64' || 'UCRT64' }}
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-qt6 mingw-w64-x86_64-zip zip

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ runner.os }}-${{ matrix.arch }}

      - name: Build
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build_gui.sh
          ./build_gui.sh

      - name: Package & Upload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
          cp backup-manager-gui.exe "$RELEASE_DIR/windows/${{ matrix.arch }}/" || cp build/backup-manager-gui.exe "$RELEASE_DIR/windows/${{ matrix.arch }}/"
          zip -r "${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip" "$RELEASE_DIR/windows/${{ matrix.arch }}"
          sha256sum "${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip" > "${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip*

  # Linux builds (FIXED)
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs: cache-setup
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config valac libjson-glib-dev \
            libsodium-dev libzstd-dev ninja-build ccache patchelf qt6-base-dev \
            qt6-tools-dev libglib2.0-dev git zip unzip

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ runner.os }}-${{ matrix.arch }}

      - name: Build
        run: |
          chmod +x build_gui.sh
          ./build_gui.sh

      - name: Package & Upload
        run: |
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}"
          cp backup-manager-gui "$RELEASE_DIR/linux/${{ matrix.arch }}/" || find build/ -name "backup-manager-gui*" -exec cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/" \;
          tar -czf "${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" -C "$RELEASE_DIR/linux/${{ matrix.arch }}" .
          sha256sum "${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" > "${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz*

  # Simplified Release
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/analyze@v3
