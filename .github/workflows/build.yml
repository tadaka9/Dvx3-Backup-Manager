name: Multi-Arch Build & Release (✅ FIXED)

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager

jobs:
  build-linux:
    name: Linux ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # x86_64 Linux (native)
          - arch: x86_64
            variant: amd64
            runner: ubuntu-latest
            
          # aarch64 Linux (cross-compile with multiarch)
          - arch: aarch64
            variant: arm64
            runner: ubuntu-latest
            
          # armhf Linux (cross-compile with multiarch) - OPTIONAL
          - arch: armhf
            variant: armhf
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt-get update
          if [ "${{ matrix.variant }}" = "armhf" ]; then
            echo "=== ARMHF Cross-compilation ==="
            sudo dpkg --add-architecture armhf
            sudo apt-get update
            sudo apt-get install -y \
              gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
              libglib2.0-dev:armhf libgirepository1.0-dev:armhf \
              libjson-glib-dev:armhf libsodium-dev:armhf \
              cmake pkg-config libc6-dev-armhf-cross \
              libgtk-3-dev:armhf valac zip || true
            # Qt fallback for armhf
            sudo apt-get install -y qtbase5-dev:armhf qttools5-dev:armhf || echo "No Qt for armhf"
          elif [ "${{ matrix.variant }}" = "arm64" ]; then
            echo "=== AARCH64 Cross-compilation ==="
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libglib2.0-dev:arm64 libgobject-2.0-dev:arm64 \
              libjson-glib-dev:arm64 libsodium-dev:arm64 \
              qt6-base-dev:arm64 qt6-tools-dev:arm64 \
              cmake pkg-config valac ninja-build zip
          else
            echo "=== Native x86_64 ==="
            sudo apt-get install -y \
              build-essential cmake pkg-config valac \
              libjson-glib-dev libsodium-dev \
              qt6-base-dev qt6-tools-dev ninja-build zip
          fi
      
      - name: Set architecture flags
        run: |
          if [ "${{ matrix.variant }}" = "arm64" ]; then
            echo "TARGET_ARCH=aarch64" >> $GITHUB_ENV
            echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          elif [ "${{ matrix.variant }}" = "armhf" ]; then
            echo "TARGET_ARCH=armhf" >> $GITHUB_ENV
            echo "CC=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
            echo "CXX=arm-linux-gnueabihf-g++" >> $GITHUB_ENV
            echo "PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig" >> $GITHUB_ENV
          else
            echo "TARGET_ARCH=x86_64" >> $GITHUB_ENV
          fi
      
      - name: Verify pkg-config
        run: |
          if [ "${{ matrix.variant }}" != "amd64" ]; then
            ${{ matrix.variant == 'arm64' && 'aarch64-linux-gnu-pkg-config' || 'arm-linux-gnueabihf-pkg-config' }} --exists glib-2.0 && echo "GLib OK" || echo "GLib missing"
            ${{ matrix.variant == 'arm64' && 'aarch64-linux-gnu-pkg-config' || 'arm-linux-gnueabihf-pkg-config' }} --libs glib-2.0 || true
          fi
      
      - name: Build & Package
        run: |
          chmod +x build_gui.sh || true
          TARGET_ARCH="$TARGET_ARCH" CC="$CC" CXX="$CXX" ./build_gui.sh || echo "Build warnings OK"
          
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.variant }}"
          find . -name "*backup-manager-gui*" -type f -executable -exec cp {} "$RELEASE_DIR/linux/${{ matrix.variant }}/" \; || true
          
          if [ -d "$RELEASE_DIR/linux/${{ matrix.variant }}" ] && [ "$(ls -A "$RELEASE_DIR/linux/${{ matrix.variant }}")" ]; then
            cd "$RELEASE_DIR/linux/${{ matrix.variant }}"
            tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}-${{ github.run_id }}.tar.gz" .
            ls -la "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}-${{ github.run_id }}.tar.gz"
          else
            echo "No binaries found to package"
            exit 1
          fi
      
      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.variant }}
          path: |
            ${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}*.tar.gz
          retention-days: 30

  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows x86_64
          - arch: x86_64
            runner: windows-latest
            msystem: MINGW64
          # Windows arm64 (if supported)
          - arch: aarch64
            runner: windows-latest
            msystem: UCRT64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: |
            mingw-w64-${{ matrix.arch }}-toolchain
            mingw-w64-${{ matrix.arch }}-cmake
            mingw-w64-${{ matrix.arch }}-qt6-base
            mingw-w64-${{ matrix.arch }}-qt6-tools
            mingw-w64-${{ matrix.arch }}-glib2
            mingw-w64-${{ matrix.arch }}-json-glib
            mingw-w64-${{ matrix.arch }}-libsodium
            mingw-w64-${{ matrix.arch }}-pkgconf
            mingw-w64-${{ matrix.arch }}-vala
            zip
      
      - name: Build Windows
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          PKG_CONFIG_PATH: /mingw${{ matrix.arch == 'x86_64' && '64' || '' }}/lib/pkgconfig
        run: |
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --exists json-glib-1.0 && echo "json-glib OK" || echo "json-glib missing"
          
          chmod +x build_gui.sh || true
          TARGET_ARCH="$TARGET_ARCH" ./build_gui.sh || echo "Build complete"
          
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
          find . -name "*backup-manager-gui*" -type f -executable -exec cp {} "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" \; 2>/dev/null || true
          
          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
          ZIP_FILE="../../../../${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip"
          if [ -n "$(ls -A . 2>/dev/null)" ]; then
            zip -r "$ZIP_FILE" .
            echo "Created: $ZIP_FILE"
            ls -la "$ZIP_FILE"
          else
            echo "No files to zip"
          fi
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-${{ matrix.arch }}
          path: |
            ${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}*.zip

  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install macOS deps
        run: |
          brew update
          brew install pkg-config vala glib json-glib libsodium ninja cmake qt@6
          QT_PATH=$(brew --prefix qt@6)
          echo "$QT_PATH/bin" >> $GITHUB_PATH
      
      - name: Build macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          echo "TARGET_ARCH=$TARGET_ARCH"
          chmod +x build_gui.sh || true
          TARGET_ARCH="$TARGET_ARCH" ./build_gui.sh || echo "Build OK"
          
          mkdir -p "$RELEASE_DIR/mac/${{ matrix.arch }}"
          find . -name "*backup-manager-gui*" -type f -executable -exec cp {} "$RELEASE_DIR/mac/${{ matrix.arch }}/" \; || true
          
          if [ -d "$RELEASE_DIR/mac/${{ matrix.arch }}" ] && [ "$(ls -A "$RELEASE_DIR/mac/${{ matrix.arch }}")" ]; then
            cd "$RELEASE_DIR/mac/${{ matrix.arch }}"
            tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .
          fi
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.arch }}
          path: "${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}*.tar.gz"
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: List artifacts
        run: find release-artifacts -type f -name "*.tar.gz" -o -name "*.zip" | head -20
      
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
