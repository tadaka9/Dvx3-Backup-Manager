name: Build, Package & Release (Enhanced)

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  # Test trigger - runs FIRST
  test-trigger:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/clean-version'
    steps:
      - run: echo "✅ TRIGGERED on ${{ github.ref }} by ${{ github.actor }}"

  cache-setup:
    runs-on: ubuntu-latest
    outputs:
      ccache-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Compute cache key # ← FIXED
        id: hash
        run: |
          # Create stable hash from source files
          HASH_FILES="CMakeLists.txt build_gui.sh"
          HASH_VALUE=""
          
          for file in $HASH_FILES; do
            if [ -f "$file" ]; then
              HASH_VALUE="$HASH_VALUE$(sha256sum "$file" | cut -d' ' -f1)"
            fi
          done
          
          # Fallback if no files found
          if [ -z "$HASH_VALUE" ]; then
            HASH_VALUE="default"
          fi
          
          # Truncate to 64 chars
          HASH_VALUE=$(echo -n "$HASH_VALUE" | head -c64)
          echo "hash=$HASH_VALUE" >> $GITHUB_OUTPUT
          echo "Computed hash: $HASH_VALUE"

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: cache-setup
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config valac \
            libjson-glib-dev libsodium-dev libzstd-dev ninja-build ccache \
            qt6-base-dev qt6-tools-dev libglib2.0-dev zip unzip

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ matrix.arch }}

      - name: Build
        run: |
          echo "Building for ${{ matrix.arch }}"
          chmod +x build_gui.sh || echo "No build_gui.sh found"
          
          if [ -f build_gui.sh ]; then
            ./build_gui.sh || echo "Build script failed, checking for artifacts anyway"
          else
            echo "No build_gui.sh - looking for pre-built artifacts"
          fi

      - name: Package artifacts
        run: |
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}"
          
          # Find binary anywhere in repo
          if find . -name "*backup-manager-gui*" -type f | head -1 | grep -q .; then
            find . -name "*backup-manager-gui*" -type f -exec cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/" \;
            echo "✅ Found backup-manager-gui binary"
          else
            echo "⚠ No backup-manager-gui found"
          fi
          
          # Copy any libraries
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}/lib"
          find . -name "*dvx3*" -o -name "*libsodium*" -o -name "*libb2*" | head -5 | \
            xargs -I {} cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/lib/" 2>/dev/null || true
          
          # Create archive
          cd "$RELEASE_DIR/linux/${{ matrix.arch }}" || exit 1
          tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .
          cd -
          
          echo "✅ Created Linux ${{ matrix.arch }} artifact"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}*.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: cache-setup
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update || true
          brew install pkg-config vala glib json-glib libsodium zstd ninja cmake ccache qt@6 || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-${{ needs.cache-setup.outputs.ccache-hash }}

      - name: Build & Package
        run: |
          chmod +x build_gui.sh || true
          if [ -f build_gui.sh ]; then
            ./build_gui.sh || echo "Build failed but continuing"
          fi
          
          mkdir -p "$RELEASE_DIR/mac"
          find . -name "*backup-manager-gui*" -type f -exec cp {} "$RELEASE_DIR/mac/" \; || true
          
          cd "$RELEASE_DIR/mac"
          tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ github.run_id }}.tar.gz" .
          cd -

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos

  publish-release:
    name: Create Release (Tags Only)
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.{tar.gz,zip}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
