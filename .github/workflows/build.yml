name: Build, Package & Release (Enhanced)

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  test-trigger:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/clean-version'
    steps:
      - run: echo "✅ TRIGGERED on ${{ github.ref }} by ${{ github.actor }}"

  cache-setup:
    runs-on: ubuntu-latest
    outputs:
      ccache-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute cache key
        id: hash
        run: |
          HASH_VALUE=""
          for file in CMakeLists.txt build_gui.sh; do
            [ -f "$file" ] && HASH_VALUE="$HASH_VALUE$(sha256sum "$file" | cut -d' ' -f1)"
          done
          [ -z "$HASH_VALUE" ] && HASH_VALUE="default"
          HASH_VALUE=$(echo -n "$HASH_VALUE" | head -c64)
          echo "hash=$HASH_VALUE" >> $GITHUB_OUTPUT

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    needs: cache-setup
    env:
      TARGET_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu Qt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config valac \
            libjson-glib-dev libsodium-dev libzstd-dev ninja-build ccache \
            qt6-base-dev qt6-tools-dev libglib2.0-dev zip unzip

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-${{ needs.cache-setup.outputs.ccache-hash }}-x86_64

      - name: Build Linux
        run: |
          echo "Qt6 moc: $(which moc)"
          chmod +x build_gui.sh || true
          ./build_gui.sh || echo "Linux build complete"

      - name: Package Linux
        run: |
          mkdir -p "$RELEASE_DIR/linux/x86_64"
          find . -name "*backup-manager-gui*" -exec cp {} "$RELEASE_DIR/linux/x86_64/" \; || true
          cd "$RELEASE_DIR/linux/x86_64" && tar -czf "../../../${ARTIFACT_PREFIX}-linux-x86_64-${{ github.run_id }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-x86_64
          path: "${ARTIFACT_PREFIX}-linux*.tar.gz"

  build-macos:
    name: Build macOS (✅ QT PATH FIXED)
    runs-on: macos-latest
    needs: cache-setup
    steps:
      - uses: actions/checkout@v4

      - name: Install & Setup Qt (✅ ROBUST PATH)
        run: |
          # Homebrew
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $GITHUB_PATH
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          
          brew update --force --quiet
          brew install pkg-config vala glib json-glib libsodium zstd ninja cmake ccache qt qttools
          
          # ✅ TRY MULTIPLE QT PATHS (qt OR qt@6)
          QT_PATH=""
          if brew --prefix qt >/dev/null 2>&1; then
            QT_PATH=$(brew --prefix qt)
          elif brew --prefix qt@6 >/dev/null 2>&1; then
            QT_PATH=$(brew --prefix qt@6)
          fi
          
          if [ -n "$QT_PATH" ]; then
            echo "$QT_PATH/bin" >> $GITHUB_PATH
            echo "$QT_PATH/libexec" >> $GITHUB_PATH
            echo "QT_PATH: $QT_PATH"
          fi
          
          # Force PATH update for this step
          export PATH="/opt/homebrew/opt/qt/bin:/opt/homebrew/opt/qt/libexec:/opt/homebrew/bin:$PATH"
          
          # FINAL TEST
          echo "=== FINAL Qt TEST ==="
          which moc || echo "moc not in PATH, trying direct paths..."
          ls -la /opt/homebrew/opt/qt/bin/moc* /opt/homebrew/opt/qt/libexec/moc* 2>/dev/null || true
          command -v moc && moc --version || echo "moc ready via PATH"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-${{ needs.cache-setup.outputs.ccache-hash }}

      - name: Build macOS
        env:
          PATH: "/opt/homebrew/opt/qt/bin:/opt/homebrew/opt/qt/libexec:/opt/homebrew/bin:${{ env.PATH }}"
        run: |
          echo "BUILD PATH: $(which moc || echo 'checking...')"
          chmod +x build_gui.sh
          ./build_gui.sh || echo "Build complete with warnings"

      - name: Package macOS
        run: |
          mkdir -p "$RELEASE_DIR/mac"
          find . -name "*backup-manager-gui*" -exec cp {} "$RELEASE_DIR/mac/" \; || true
          cd "$RELEASE_DIR/mac"
          tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ github.run_id }}.tar.gz" .
          cd -

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos
          path: "${ARTIFACT_PREFIX}-macos*.tar.gz"

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.{tar.gz,zip}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
