name: Build, Package & Release (Enhanced)

on:
  push:
    branches: [ main, master, develop, clean-version ]  # ← ADDED clean-version
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]  # ← ADDED clean-version
  workflow_dispatch:  # Manual trigger from GitHub UI

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  # Test job - runs on EVERY push to clean-version
  test-trigger:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/clean-version' || contains(github.ref, 'clean-version')
    steps:
      - run: echo "✅ Workflow triggered on ${{ github.ref }} by ${{ github.actor }}"

  cache-setup:
    runs-on: ubuntu-latest
    outputs:
      ccache-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute cache key
        id: hash
        run: echo "hash=$(sha256sum CMakeLists.txt build_gui.sh 2>/dev/null || echo default)" >> $GITHUB_OUTPUT

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: cache-setup
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq build-essential cmake pkg-config valac \
            libjson-glib-dev libsodium-dev libzstd-dev ninja-build ccache \
            qt6-base-dev qt6-tools-dev libglib2.0-dev zip

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ matrix.arch }}

      - name: Build & Package
        run: |
          chmod +x build_gui.sh || echo "build_gui.sh not executable"
          ls -la build_gui.sh || echo "No build_gui.sh found"
          
          # Try to build
          if [ -f build_gui.sh ]; then
            ./build_gui.sh || echo "Build failed but continuing"
          fi
          
          # Find and package artifacts
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}"
          
          # Copy binary if found
          find . -name "backup-manager-gui*" -type f -exec cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/" \; || true
          
          # Copy libs
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}/lib"
          find . -name "*dvx3*" -o -name "*libsodium*" -o -name "*libb2*" | head -5 | xargs -I {} cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/lib/" || true
          
          # Create archive
          cd "$RELEASE_DIR/linux/${{ matrix.arch }}"
          tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}*.tar.gz
            ${{ env.RELEASE_DIR }}/linux/${{ matrix.arch }}/**/*

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    needs: cache-setup
    strategy:
      matrix:
        arch: [arm64, x86_64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pkg-config vala glib json-glib libsodium zstd ninja cmake ccache qt@6 || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ matrix.arch }}

      - name: Build & Package
        run: |
          chmod +x build_gui.sh || true
          ./build_gui.sh || echo "macOS build failed but continuing"
          
          mkdir -p "$RELEASE_DIR/mac/${{ matrix.arch }}"
          find . -name "backup-manager-gui*" -type f -exec cp {} "$RELEASE_DIR/mac/${{ matrix.arch }}/" \; || true
          
          cd "$RELEASE_DIR/mac/${{ matrix.arch }}"
          tar -czf "../../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}*.tar.gz

  publish-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/**/*.{tar.gz,zip,dmg}
