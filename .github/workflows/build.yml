name: Build, Package & Release (✅ WINDOWS PACKAGES FIXED)

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config valac libjson-glib-dev libsodium-dev qt6-base-dev qt6-tools-dev ninja-build zip

      - name: Build & Package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build_gui.sh || true
          ./build_gui.sh || echo "Build warnings OK"
          
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}"
          find . -name "*backup-manager-gui*" -exec cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/" \; || true
          cd "$RELEASE_DIR/linux/${{ matrix.arch }}" && tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.arch }}
          path: "${ARTIFACT_PREFIX}-linux*.tar.gz"

  build-windows-x64:
    name: Windows x86_64 (✅ CORRECT PACKAGES)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSYS2 (✅ FIXED PACKAGES)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base      # ← qt6-base (not qt6 group!)
            mingw-w64-x86_64-qt6-tools     # ← qt6-tools for moc
            zip                            # ← Regular zip

      - name: Build Windows
        env:
          TARGET_ARCH: x86_64
        run: |
          echo "Qt6 moc: $(which moc)"
          chmod +x build_gui.sh || true
          ./build_gui.sh || echo "Build warnings OK"
          
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/x86_64"
          cp backup-manager-gui.exe "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/x86_64/" 2>/dev/null || true
          find . -name "*backup-manager-gui*" -exec cp {} "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/x86_64/" \; || true
          
          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/x86_64"
          zip -r "../../../../${ARTIFACT_PREFIX}-windows-x86_64-${{ github.run_id }}.zip" .
          cd -
          ls -la "${ARTIFACT_PREFIX}-windows-x86_64-${{ github.run_id }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x86_64
          path: "${ARTIFACT_PREFIX}-windows*.zip"

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          brew update
          brew install pkg-config vala glib json-glib libsodium ninja cmake qt qttools
          
          QT_PATH=$(brew --prefix qt)
          echo "$QT_PATH/bin" >> $GITHUB_PATH
          echo "$QT_PATH/libexec" >> $GITHUB_PATH

      - name: Build macOS
        run: |
          echo "MOC: $(which moc)"
          chmod +x build_gui.sh
          ./build_gui.sh || echo "Build OK"

      - name: Package macOS
        run: |
          mkdir -p "$RELEASE_DIR/mac"
          find . -type f -executable -name "*backup*" -o -name "*manager*" | head -1 | xargs -I {} cp {} "$RELEASE_DIR/mac/" || true
          find . -name "*dvx3*" -exec cp {} "$RELEASE_DIR/mac/" \; || true
          
          cd "$RELEASE_DIR/mac" && tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ github.run_id }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: "${ARTIFACT_PREFIX}-macos*.tar.gz"

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows-x64, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
