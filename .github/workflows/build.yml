name: Build, Package & Release

on:
  push:
    branches: [ main, master, clean-version ]
  pull_request:
    branches: [ main, master, clean-version ]
  workflow_dispatch: {}
  release:
    types: [published]

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager

jobs:
  # ------------------------------------------------------------------
  # macOS builds (universal packaging from x86_64 + arm64)
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runs_on: macos-latest
          - arch: x86_64
            runs_on: macos-12
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew and install packages
        run: |
          set -ex
          brew update
          brew install --build-bottle \
            pkg-config \
            vala \
            glib \
            json-glib \
            libsodium \
            zstd \
            qt@6 \
            ninja \
            cmake \
            ccache \
            create-dmg || true
          brew install qttools || true
          brew link --overwrite qt@6 || true
          QT6_PREFIX=$(brew --prefix qt@6)
          echo "$QT6_PREFIX/bin" >> $GITHUB_PATH || true
          echo "$QT6_PREFIX/libexec" >> $GITHUB_PATH || true

      - name: Configure macOS environment and verify moc
        run: |
          set -ex
          QT6_PREFIX=$(brew --prefix qt@6)
          export PATH="$QT6_PREFIX/bin:$QT6_PREFIX/libexec:$PATH"
          which moc || true
          moc --version || true

      - name: Build GUI (macOS)
        run: |
          set -ex
          chmod +x build_gui.sh || true
          ./build_gui.sh || true

      - name: Bundle macOS app and fix libsodium linking
        run: |
          set -ex
          mkdir -p $RELEASE_DIR/mac/${{ matrix.arch }}/lib
          # Use macdeployqt (bundle Qt and plugins) if available
          if command -v macdeployqt >/dev/null 2>&1; then
            # If our build produced an .app bundle, use macdeployqt
            if [ -d build/backup-manager-gui.app ]; then
              macdeployqt build/backup-manager-gui.app || true
              cp -r build/backup-manager-gui.app $RELEASE_DIR/mac/${{ matrix.arch }}/ || true
            fi
          fi
          # Copy executable artifacts into release folder
          if [ -f backup-manager-gui ]; then
            cp backup-manager-gui $RELEASE_DIR/mac/${{ matrix.arch }}/ || true
          fi
          # Fix libsodium for runtime: copy library and change install names
          if brew --prefix libsodium >/dev/null 2>&1; then
            LIBSODIUM=$(brew --prefix libsodium)/lib/libsodium*.dylib || true
            if [ -e "$LIBSODIUM" ]; then
              cp $LIBSODIUM $RELEASE_DIR/mac/${{ matrix.arch }}/lib/ || true
              for f in $RELEASE_DIR/mac/${{ matrix.arch }}/*; do
                if file "$f" | grep -qi "Mach-O"; then
                  install_name_tool -change "$LIBSODIUM" "@executable_path/../lib/$(basename $LIBSODIUM)" "$f" || true
                fi
              done
            fi
          fi

      - name: Create mac artifact
        run: |
          set -ex
          cd $RELEASE_DIR/mac/${{ matrix.arch }} || true
          tar -czf ../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz . || true
          cd -

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz

  # ------------------------------------------------------------------
  # Windows builds (x86_64 & aarch64)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64,aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v3
        with:
          msystem: MINGW64
          update: true

      - name: Install MSYS2 packages (arch-aware)
        shell: bash -lc
        run: |
          set -ex
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
              PACMAN_PREFIX="mingw-w64-x86_64"
          else
              PACMAN_PREFIX="mingw-w64-aarch64"
          fi
          pacman -Syu --noconfirm || true
          pacman -S --noconfirm ${PACMAN_PREFIX}-toolchain ${PACMAN_PREFIX}-vala ${PACMAN_PREFIX}-glib2 ${PACMAN_PREFIX}-json-glib ${PACMAN_PREFIX}-libsodium ${PACMAN_PREFIX}-qt6-base ${PACMAN_PREFIX}-qt6-tools ${PACMAN_PREFIX}-pkgconf || true

      - name: Build GUI (Windows)
        shell: bash -lc
        run: |
          set -ex
          # Ensure scripts are executable in MSYS2
          chmod +x build_gui.sh || true
          ./build_gui.sh || true

      - name: Collect Windows artifacts and ensure libsodium.dll present
        shell: bash -lc
        run: |
          set -ex
          mkdir -p $RELEASE_DIR/windows/${{ matrix.arch }}
          # Copy produced executables and DLLs
          if [ -f backup-manager-gui.exe ]; then
            cp backup-manager-gui.exe $RELEASE_DIR/windows/${{ matrix.arch }}/ || true
          elif [ -f backup-manager-gui ]; then
            cp backup-manager-gui $RELEASE_DIR/windows/${{ matrix.arch }}/ || true
          fi
          # Copy libsodium DLL into Releases folder (MSYS2 path)
          if [ -f /mingw64/bin/libsodium.dll ]; then
            cp /mingw64/bin/libsodium.dll $RELEASE_DIR/windows/${{ matrix.arch }}/ || true
          elif [ -f /usr/bin/libsodium.dll ]; then
            cp /usr/bin/libsodium.dll $RELEASE_DIR/windows/${{ matrix.arch }}/ || true
          fi
          # Use windeployqt if available to gather Qt dependencies
          if command -v windeployqt >/dev/null 2>&1; then
            if [ -f backup-manager-gui.exe ]; then
              windeployqt --dir $RELEASE_DIR/windows/${{ matrix.arch }} backup-manager-gui.exe || true
            fi
          fi

      - name: Create Windows artifact
        shell: bash -lc
        run: |
          set -ex
          cd $RELEASE_DIR/windows/${{ matrix.arch }} || true
          zip -r ../../${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip . || true
          cd -

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip

  # ------------------------------------------------------------------
  # Linux build (x86_64)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          set -ex
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config valac libjson-glib-dev libsodium-dev zstd tar imagemagick ninja-build ccache patchelf || true

      - name: Build GUI (Linux)
        run: |
          set -ex
          chmod +x build_gui.sh || true
          ./build_gui.sh || true

      - name: Package Linux artifacts and fix libsodium linking
        run: |
          set -ex
          mkdir -p $RELEASE_DIR/linux/x86_64/lib || true
          cp backup-manager-gui $RELEASE_DIR/linux/x86_64 || true
          # Copy libsodium into release lib
          SODIUM_SO=$(ldconfig -p | grep libsodium | head -n 1 | awk '{print $NF}' || true)
          if [ -n "$SODIUM_SO" ] && [ -f "$SODIUM_SO" ]; then
            cp "$SODIUM_SO" $RELEASE_DIR/linux/x86_64/lib/ || true
          else
            cp /usr/lib/x86_64-linux-gnu/libsodium.so.* $RELEASE_DIR/linux/x86_64/lib/ 2>/dev/null || true
          fi
          # Make a wrapper to set LD_LIBRARY_PATH for the extracted package
          printf '#!/bin/bash\nSCRIPT=$(readlink -f "$0")\nBASEDIR=$(dirname "$SCRIPT")\nexport LD_LIBRARY_PATH="$BASEDIR/lib:$LD_LIBRARY_PATH"\nexec "$BASEDIR/backup-manager-gui" "$@"\n' > $RELEASE_DIR/linux/x86_64/Dvx3-Run.sh
          chmod +x $RELEASE_DIR/linux/x86_64/Dvx3-Run.sh || true
          # Use patchelf to set rpath
          if command -v patchelf >/dev/null 2>&1; then
            patchelf --set-rpath '$ORIGIN/lib' $RELEASE_DIR/linux/x86_64/backup-manager-gui || true
          fi
          # Create a tar.gz artifact
          cd $RELEASE_DIR/linux || true
          tar -czf ../${ARTIFACT_PREFIX}-linux-x86_64-${{ github.run_id }}.tar.gz x86_64 || true
          cd -

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}
          path: ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}.tar.gz

  # ------------------------------------------------------------------
  # Publish Release - gathers and uploads artifacts to GitHub Release
  # This job depends on all builds above
  # ------------------------------------------------------------------
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: List downloaded artifacts
        run: |
          set -ex
          ls -la downloaded-artifacts || true

      - name: Create or update GitHub Release and upload assets
        id: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            downloaded-artifacts/**
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
