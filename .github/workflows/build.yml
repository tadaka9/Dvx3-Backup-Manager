name: Multi-Arch Build & Release

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager

# ---------------------- Linux ----------------------
jobs:
  build-linux:
    name: Linux ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            variant: amd64
            runner: ubuntu-latest
          - arch: aarch64
            variant: arm64
            runner: ubuntu-24.04-arm  # native ARM64 runner if available; else ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake pkg-config valac \
            libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-tools-dev ninja-build zip
          pkg-config --exists glib-2.0 json-glib-1.0 && echo "GLib/json-glib OK" || echo "Missing GLib/json-glib"

      - name: Set architecture
        run: echo "TARGET_ARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Build & Package
        run: |
          chmod +x build_gui.sh || true
          TARGET_ARCH="$TARGET_ARCH" ./build_gui.sh || echo "Build warnings OK"

          mkdir -p "$RELEASE_DIR/linux/${{ matrix.variant }}"
          find . -name "*backup-manager-gui*" -type f -executable -exec cp {} "$RELEASE_DIR/linux/${{ matrix.variant }}/" \; || true

          if [ -d "$RELEASE_DIR/linux/${{ matrix.variant }}" ] && [ "$(ls -A "$RELEASE_DIR/linux/${{ matrix.variant }}")" ]; then
            cd "$RELEASE_DIR/linux/${{ matrix.variant }}"
            tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}-${{ github.run_id }}.tar.gz" .
            ls -la "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}-${{ github.run_id }}.tar.gz"
          else
            echo "No Linux binaries found"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-${{ matrix.variant }}
          path: ${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}*.tar.gz
          retention-days: 30

# ---------------------- Windows ----------------------
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
          - arch: arm64
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64   # ARM64 packages live here [web:64][web:84]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-qt6-base
            ${{ matrix.prefix }}-qt6-tools
            ${{ matrix.prefix }}-glib2
            ${{ matrix.prefix }}-json-glib
            ${{ matrix.prefix }}-libsodium
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-vala
            zip

      - name: Build Windows
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          echo "MSYSTEM=$MSYSTEM, TARGET_ARCH=$TARGET_ARCH"
          which cmake || echo "cmake missing"
          pkg-config --exists json-glib-1.0 && echo "json-glib OK" || echo "json-glib missing"

          chmod +x build_gui.sh || true
          TARGET_ARCH="$TARGET_ARCH" ./build_gui.sh || echo "Build complete"

          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
          find . -name "*backup-manager-gui*" -type f -executable -exec cp {} "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" \; 2>/dev/null || true

          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
          if [ -n "$(ls -A . 2>/dev/null)" ]; then
            ZIP_FILE="../../../../${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip"
            zip -r "$ZIP_FILE" .
            echo "Created: $ZIP_FILE"
            ls -la "$ZIP_FILE"
          else
            echo "No files to zip"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-${{ matrix.arch }}
          path: ${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}*.zip

# ---------------------- macOS ----------------------
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS deps
        run: |
          brew update
          brew install pkg-config vala glib json-glib libsodium ninja cmake qt@6
          QT_PATH=$(brew --prefix qt@6)
          echo "$QT_PATH/bin" >> $GITHUB_PATH

      - name: Build macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          echo "TARGET_ARCH=$TARGET_ARCH"
          chmod +x build_gui.sh || true
          TARGET_ARCH="$TARGET_ARCH" ./build_gui.sh || echo "Build OK"

          mkdir -p "$RELEASE_DIR/mac/${{ matrix.arch }}"
          find . -name "*backup-manager-gui*" -type f -executable -exec cp {} "$RELEASE_DIR/mac/${{ matrix.arch }}/" \; || true

          if [ -d "$RELEASE_DIR/mac/${{ matrix.arch }}" ] && [ "$(ls -A "$RELEASE_DIR/mac/${{ matrix.arch }}")" ]; then
            cd "$RELEASE_DIR/mac/${{ matrix.arch }}"
            tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .
            ls -la "../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz"
          else
            echo "No macOS binaries found"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.arch }}
          path: ${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}*.tar.gz
          retention-days: 30

# ---------------------- Publish ----------------------
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "Artifacts:"
          find release-artifacts -type f -name "*.tar.gz" -o -name "*.zip" | sort | head -50

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
