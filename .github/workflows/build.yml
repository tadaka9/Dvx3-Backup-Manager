---
name: Build & Release

on:
  push:
    branches: [ main, master, develop ]
    tags: ['v*']
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager

# =============================================================================
# LINUX BUILD MATRIX (Ubuntu)
# =============================================================================
jobs:
  build-linux-x86_64:
    name: Linux x86_64 (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential valac gcc pkg-config zip \
            libglib2.0-dev libgio-2.0-dev libjson-glib-dev \
            libsodium-dev gir1.2-gtk-4.0 libgtk-4-dev

      - name: Verify dependencies
        run: |
          echo "=== Linux x86_64 Dependencies ==="
          pkg-config --modversion glib-2.0 || exit 1
          pkg-config --modversion json-glib-1.0 || exit 1
          pkg-config --modversion libsodium || exit 1

      - name: Build for Linux x86_64
        env:
          TARGET_ARCH: x86_64
          RELEASE_DIR: Releases
        run: |
          echo "=== Building Dvx3 Backup Manager for Linux x86_64 ==="
          chmod +x build_all.sh
          ./build_all.sh

      - name: Collect binary
        run: |
          mkdir -p "$RELEASE_DIR/linux/x86_64"
          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/linux/x86_64/"
            echo "✓ cli_backup_manager ($(ls -lh cli_backup_manager | awk '{print $5}'))"
          else
            echo "⚠️  Binary not found, skipping..."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-linux-x86_64
          path: Releases/linux/x86_64/cli_backup_manager
          retention-days: 7

  build-linux-arm64:
    name: Linux arm64 (Ubuntu ARM)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential valac gcc pkg-config zip \
            libglib2.0-dev libgio-2.0-dev libjson-glib-dev \
            libsodium-dev gir1.2-gtk-4.0 libgtk-4-dev

      - name: Verify dependencies
        run: |
          echo "=== Linux arm64 Dependencies ==="
          uname -m
          pkg-config --modversion glib-2.0 || exit 1
          pkg-config --modversion json-glib-1.0 || exit 1
          pkg-config --modversion libsodium || exit 1

      - name: Build for Linux arm64
        env:
          TARGET_ARCH: aarch64
          RELEASE_DIR: Releases
        run: |
          echo "=== Building Dvx3 Backup Manager for Linux arm64 ==="
          chmod +x build_all.sh
          ./build_all.sh

      - name: Collect binary
        run: |
          mkdir -p "$RELEASE_DIR/linux/aarch64"
          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/linux/aarch64/"
            echo "✓ cli_backup_manager ($(ls -lh cli_backup_manager | awk '{print $5}'))"
          else
            echo "⚠️  Binary not found, skipping..."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-linux-aarch64
          path: Releases/linux/aarch64/cli_backup_manager
          retention-days: 7


# =============================================================================
# MACOS BUILD MATRIX (Apple Silicon + Intel)
# =============================================================================
  build-macos-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install valac cmake zip dos2unix pkg-config glib gtk4 libsodium || true
          
          echo "=== macOS ARM64 Dependencies ==="
          if pkg-config --exists gio-unix-2.0; then
            echo "✓ gio-unix-2.0.pc found (glib $$(pkg-config --modversion glib-2.0))"
          else
            echo "⚠️  GioUnix not available - CLI may still work"
          fi

      - name: Build for macOS arm64
        env:
          TARGET_ARCH: aarch64
          RELEASE_DIR: Releases
        run: |
          echo "=== Building Dvx3 Backup Manager for macOS ARM64 ==="
          
          # Create minimal build directory if needed
          mkdir -p "$RELEASE_DIR/macos/aarch64"
          
          chmod +x build_all.sh || true
          ./build_all.sh 2>&1 | tee build-output.log

          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/macos/aarch64/"
            echo "✓ cli_backup_manager built successfully ($(ls -lh cli_backup_manager | awk '{print $5}'))"
          else
            echo "⚠️  Binary not found in build output, checking logs..."
            if [ -f build-output.log ]; then
              tail -30 build-output.log || true
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-macos-arm64
          path: Releases/macos/aarch64/cli_backup_manager
          retention-days: 7

  build-macos-x86_64:
    name: macOS x86_64 (Intel)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install valac cmake zip dos2unix pkg-config glib gtk4 libsodium || true
          
          echo "=== macOS x86_64 Dependencies ==="
          if pkg-config --exists gio-unix-2.0; then
            echo "✓ gio-unix-2.0.pc found (glib $$(pkg-config --modversion glib-2.0))"
          else
            echo "⚠️  GioUnix not available - CLI may still work"
          fi

      - name: Build for macOS x86_64
        env:
          TARGET_ARCH: x86_64
          RELEASE_DIR: Releases
        run: |
          echo "=== Building Dvx3 Backup Manager for macOS x86_64 ==="
          
          mkdir -p "$RELEASE_DIR/macos/x86_64"
          
          chmod +x build_all.sh || true
          ./build_all.sh 2>&1 | tee build-output.log

          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/macos/x86_64/"
            echo "✓ cli_backup_manager built successfully ($(ls -lh cli_backup_manager | awk '{print $5}'))"
          else
            echo "⚠️  Binary not found in build output, checking logs..."
            if [ -f build-output.log ]; then
              tail -30 build-output.log || true
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-macos-x86_64
          path: Releases/macos/x86_64/cli_backup_manager
          retention-days: 7


# =============================================================================
# WINDOWS BUILD MATRIX (MSYS2)
# =============================================================================
  build-windows-x86_64:
    name: Windows x86_64 (MSYS2 MINGW64)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libsodium

      - name: Install build tools
        run: |
          pacman -S --noconfirm zip dos2unix 2>&1 | tail -3

      - name: Verify dependencies
        run: |
          echo "=== Windows x86_64 Dependencies ==="
          valac --version || echo "⚠️  Vala not found via MSYS2 package manager"
          glib-2.0-config --cflags 2>/dev/null && echo "✓ glib headers found" || echo "⚠️  No glib config found"

      - name: Build for Windows x86_64
        env:
          TARGET_ARCH: x86_64
          RELEASE_DIR: Releases
        run: |
          echo "=== Building Dvx3 Backup Manager for Windows x86_64 ==="
          
          mkdir -p "$RELEASE_DIR/windows/x86_64"
          
          chmod +x build_all.sh || true
          ./build_all.sh 2>&1 | tee build-output.log

          if [ -f "cli_backup_manager.exe" ]; then
            cp cli_backup_manager.exe "$RELEASE_DIR/windows/x86_64/"
            echo "✓ cli_backup_manager.exe built successfully ($(ls -lh cli_backup_manager.exe | awk '{print $5}'))"
          else
            echo "⚠️  Binary not found, checking build output..."
            if [ -f build-output.log ]; then
              tail -40 build-output.log
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-windows-x86_64
          path: Releases/windows/x86_64/cli_backup_manager.exe
          retention-days: 7


# =============================================================================
# AUTOMATED RELEASE ON TAG PUSH
# =============================================================================
  release-on-tag:
    name: 🏷️ Auto-release from git tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-macos-arm64, build-windows-x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release Version: ${{ steps.get_version.outputs.VERSION }}"

      - name: Download all Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Dvx3-Backup-Manager-linux-*
          path: Releases/
          merge-multiple: true

      - name: Download all macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Dvx3-Backup-Manager-macos-*
          path: Releases/
          merge-multiple: true

      - name: Download all Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Dvx3-Backup-Manager-windows-*
          path: Releases/
          merge-multiple: true

      - name: Create Release Notes
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: |
            Releases/linux/x86_64/cli_backup_manager
            Releases/macos/aarch64/cli_backup_manager
            Releases/macos/x86_64/cli_backup_manager
            Releases/windows/x86_64/cli_backup_manager.exe

      - name: Output release URL
        run: |
          echo "🎉 Release created at:"
          echo "${{ steps.create_release.outputs.upload_url }}"


# =============================================================================
# BUILD SUMMARY (runs after all builds)
# =============================================================================
  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64, build-macos-arm64, build-macos-x86_64, build-windows-x86_64]
    if: always()

    steps:
      - name: Show Build Summary
        run: |
          echo "=============================================="
          echo "  Dvx3 Backup Manager - Build Matrix Results"
          echo "=============================================="
          
          # Get results from each job
          linux_x86=$(echo "${{ needs.build-linux-x86_64.result }}" | tr -d ' ')
          linux_arm64=$(echo "${{ needs.build-linux-arm64.result }}" | tr -d ' ')
          macos_arm64=$(echo "${{ needs.build-macos-arm64.result }}" | tr -d ' ')
          macos_x86=$(echo "${{ needs.build-macos-x86_64.result }}" | tr -d ' ')
          windows_x86=$(echo "${{ needs.build-windows-x86_64.result }}" | tr -d ' ')

          echo ""
          echo "📋 Results:"
          echo "  🐧 Linux x86_64   : ${linux_x86:-pending}"
          echo "  🐧 Linux arm64    : ${linux_arm64:-pending}"
          echo "  🍎 macOS ARM64    : ${macos_arm64:-pending}"
          echo "  🍎 macOS x86_64   : ${macos_x86:-pending}"
          echo "  🪟 Windows x86_64 : ${windows_x86:-pending}"
          echo ""

          # Determine overall status
          all_passed=true
          if [ "$linux_x86" = "failure" ] || [ "$macos_arm64" = "failure" ] || [ "$windows_x86" = "failure" ]; then
            all_passed=false
          fi

          if $all_passed; then
            echo "✅ All builds PASSED!"
          else
            echo "❌ Some builds FAILED. Check individual job logs."
          fi
