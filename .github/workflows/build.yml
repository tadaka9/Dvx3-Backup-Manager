name: Build Backup Manager

on:
  push:
    branches:
      - clean-version
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-vala
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libsodium

      - name: Verify Qt6 installation
        shell: msys2 {0}
        run: |
          echo "Checking Qt6Widgets with pkg-config"
          pkg-config --modversion Qt6Widgets
          echo "Searching for moc in MSYS2 directories"
          ls -l /mingw64/bin/moc.exe || true
          ls -l /mingw64/qt6/bin/moc.exe || true
          ls -l /mingw64/lib/qt6/bin/moc.exe || true
          echo "moc in PATH:"
          which moc || true
  
          echo "PATH environment variable:"
          echo $PATH
  
          echo "Listing moc executables recursively under /mingw64"
          find /mingw64 -name "moc*.exe" || true
  
          echo "List installed Qt6 packages"
          pacman -Qs qt6

      - name: Install ImageMagick for icon conversion
        run: sudo apt-get update && sudo apt-get install -y imagemagick
        if: runner.os == 'Linux'
    
      - name: Convert PNG to ICO for Windows icon embedding
        run: convert dvx3-backup.png -define icon:auto-resize=64,48,32,16 dvx3-backup.ico
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'

      - name: Build Backup Manager GUI
        shell: msys2 {0}
        run: |
          chmod +x build_gui.sh || true
          # Fix line endings for build_gui.sh to Unix LF before build
          sed -i 's/\r$//' build_gui.sh
          ./build_gui.sh

      - name: Prepare Releases folder
        shell: msys2 {0}
        run: |
          mkdir -p Releases
          # Rename and move built executable to Releases with desired name
          if [ -f backup-manager-gui.exe ]; then
            mv backup-manager-gui.exe "Releases/Dvx3 Backup Manager.exe"
          elif [ -f backup-manager-gui ]; then
            cp backup-manager-gui "Releases/Dvx3 Backup Manager.exe"
          fi
          # Copy required DLLs from MSYS2 directories to Releases folder for standalone run
          cp /mingw64/bin/libgio-2.0-0.dll Releases/ || true
          cp /mingw64/bin/libglib-2.0-0.dll Releases/ || true
          cp /mingw64/bin/libgcc_s_seh-1.dll Releases/ || true
          cp /mingw64/bin/libgobject-2.0-0.dll Releases/ || true
          cp /mingw64/bin/libstdc++-6.dll Releases/ || true
          cp /mingw64/bin/libwinpthread-1.dll Releases/ || true
          cp /mingw64/bin/libffi-7.dll Releases/ || true
          cp /mingw64/bin/libpcre16-0.dll Releases/ || true
          cp /mingw64/bin/libffi-8.dll Releases/ || true
          cp /mingw64/bin/libpcre-1.dll Releases/ || true
          cp /mingw64/bin/libbz2-1.dll Releases/ || true
          cp /mingw64/bin/libzstd.dll Releases/ || true
          cp /mingw64/bin/libz.dll Releases/ || true
          cp /mingw64/bin/Qt6Core.dll Releases/ || true
          cp /mingw64/bin/Qt6Gui.dll Releases/ || true
          cp /mingw64/bin/Qt6Widgets.dll Releases/ || true
          cp /mingw64/bin/Qt6Network.dll Releases/ || true
          cp /mingw64/bin/Qt6DBus.dll Releases/ || true
          cp /mingw64/bin/Qt6Svg.dll Releases/ || true
          cp /mingw64/bin/libdvx3.dll Releases/ || true
          cp /mingw64/bin/libintl-8.dll Releases/ || true
          cp /mingw64/bin/libpcre2-8-0.dll Releases/ || true
          cp /mingw64/bin/libb2-1.dll Releases/ || true
          cp /mingw64/bin/libdouble-conversion.dll Releases/ || true
          cp /mingw64/bin/libicuin78.dll Releases/ || true
          cp /mingw64/bin/zlib1.dll Releases/ || true
          cp /mingw64/bin/libicuuc78.dll Releases/ || true
          cp /mingw64/bin/libpcre2-16-0.dll Releases/ || true
          # Copy icon if exists
          if [ -f dvx3-backup.png ]; then
            cp dvx3-backup.png Releases/
          fi

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-Backup-Manager-Windows-Build
          path: Releases/
