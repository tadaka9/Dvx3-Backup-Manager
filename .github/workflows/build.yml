name: Build, Package & Release (Enhanced)

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  test-trigger:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/clean-version'
    steps:
      - run: echo "✅ TRIGGERED on ${{ github.ref }} by ${{ github.actor }}"

  cache-setup:
    runs-on: ubuntu-latest
    outputs:
      ccache-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Compute cache key
        id: hash
        run: |
          HASH_VALUE=""
          for file in CMakeLists.txt build_gui.sh; do
            [ -f "$file" ] && HASH_VALUE="$HASH_VALUE$(sha256sum "$file" | cut -d' ' -f1)"
          done
          [ -z "$HASH_VALUE" ] && HASH_VALUE="default"
          HASH_VALUE=$(echo -n "$HASH_VALUE" | head -c64)
          echo "hash=$HASH_VALUE" >> $GITHUB_OUTPUT

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: cache-setup
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config valac \
            libjson-glib-dev libsodium-dev libzstd-dev ninja-build ccache \
            qt6-base-dev qt6-tools-dev libglib2.0-dev zip unzip

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ needs.cache-setup.outputs.ccache-hash }}-${{ matrix.arch }}

      - name: Build & Package Linux
        run: |
          chmod +x build_gui.sh || true
          if [ -f build_gui.sh ]; then
            TARGET_ARCH=${{ matrix.arch }} ./build_gui.sh || echo "Build failed, packaging anyway"
          fi
          
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}"
          find . -name "*backup-manager-gui*" -type f -exec cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/" \; || true
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.arch }}/lib"
          find . -name "*dvx3*" -o -name "*libsodium*" -o -name "*libb2*" | head -5 | xargs -I {} cp {} "$RELEASE_DIR/linux/${{ matrix.arch }}/lib/" 2>/dev/null || true
          
          cd "$RELEASE_DIR/linux/${{ matrix.arch }}"
          tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.arch }}-${{ github.run_id }}.tar.gz" .
          cd -
          echo "✅ Linux ${{ matrix.arch }} artifact created"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-linux-${{ matrix.arch }}*.tar.gz

  build-macos:
    name: Build macOS (FIXED Qt)
    runs-on: macos-latest
    needs: cache-setup
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew & Qt6 (FIXED)
        run: |
          # Install Homebrew if missing
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $GITHUB_PATH
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          
          brew update --force --quiet
          
          # Install Qt6 + tools FIRST
          brew install qt@6 qt6-tools pkg-config vala glib json-glib libsodium zstd ninja cmake ccache
          
          # Find Qt6 paths (Apple Silicon first, Intel fallback)
          QT6_PATH=$(brew --prefix qt@6)
          echo "QT6_PATH: $QT6_PATH"
          echo "$QT6_PATH/bin" >> $GITHUB_PATH
          echo "$QT6_PATH/libexec" >> $GITHUB_PATH
          
          # Verify moc is found
          echo "=== Qt tools ==="
          which moc || echo "moc not found"
          moc --version || echo "moc version check failed"
          ls -la $QT6_PATH/bin/moc* || echo "No moc in bin"
          
          echo "PATH includes: $(echo $PATH | tr ':' '\n' | head -5)"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-${{ needs.cache-setup.outputs.ccache-hash }}

      - name: Build macOS
        env:
          CC: clang
          CXX: clang++
          QT6_PREFIX: ${{ steps.setup.outputs.qt6_prefix || '/opt/homebrew/opt/qt@6' }}
        run: |
          echo "QT6_PREFIX: $QT6_PREFIX"
          echo "PATH: $PATH"
          
          chmod +x build_gui.sh || true
          if [ -f build_gui.sh ]; then
            ./build_gui.sh
          else
            echo "No build_gui.sh found"
          fi

      - name: Package macOS artifacts
        run: |
          mkdir -p "$RELEASE_DIR/mac"
          
          # Find binary
          if find . -name "*backup-manager-gui*" -type f 2>/dev/null | head -1; then
            find . -name "*backup-manager-gui*" -type f -exec cp {} "$RELEASE_DIR/mac/" \;
            echo "✅ Found macOS binary"
          else
            echo "⚠ No backup-manager-gui binary found"
          fi
          
          # Copy libraries
          mkdir -p "$RELEASE_DIR/mac/lib"
          find . -name "*dvx3*" -o -name "*libsodium*" -o -name "*libb2*" 2>/dev/null | head -5 | \
            xargs -I {} cp {} "$RELEASE_DIR/mac/lib/" 2>/dev/null || true
          
          # Create archive
          cd "$RELEASE_DIR/mac"
          tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ github.run_id }}.tar.gz" .
          cd -
          echo "✅ macOS artifact: ${ARTIFACT_PREFIX}-macos-${{ github.run_id }}.tar.gz"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos
          path: |
            ${{ env.ARTIFACT_PREFIX }}-macos*.tar.gz
            ${{ env.RELEASE_DIR }}/mac/**/*

  publish-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.{tar.gz,zip}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
