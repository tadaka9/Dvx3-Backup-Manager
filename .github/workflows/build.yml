# -------- macOS --------
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: |
          brew update || true
          brew install --quiet \
            pkg-config \
            valac \
            glib \
            json-glib \
            libsodium \
            zip \
            dos2unix || true

          # Conditionally install GioUnix and GTK if available (needed for GUI)
          echo "=== Checking for GioUnix/GTK availability ==="
          if brew list --quiet gio-unix &>/dev/null; then
            echo "✓ GioUnix found, will attempt full GUI build"
            GIOSYMBOLIC=yes
          else
            echo "⚠️  GioUnix not found (common on macOS runners), will use CLI-only mode"
            GIOSYMBOLIC=no
          fi

          # Install GTK and gio-unix if available
          if [ "$GIOSYMBOLIC" = "yes" ]; then
            brew install --quiet gio-unix gtk || true
          fi

      - name: Set up Qt6 (macOS fallback)
        run: |
          QT_PATH=$(brew --prefix qt@6 2>/dev/null)
          if [ -n "$QT_PATH" ] && [ -d "$QT_PATH" ]; then
            echo "$QT_PATH/bin" >> $GITHUB_PATH
            echo "✓ Qt6 found at $QT_PATH (will use Qt-based GUI)"
          else
            echo "⚠️  Qt6 not found, GTK4-based build will be used if dependencies available"
          fi

      - name: Verify macOS dependencies
        run: |
          echo "=== macOS dependency check ==="
          pkg-config --modversion glib-2.0
          pkg-config --modversion json-glib-1.0
          pkg-config --modversion libsodium
          
          GTK_CHECK=$(pkg-config --exists gtk+-4.0 2>/dev/null && echo "yes" || echo "no")
          if [ "$GTK_CHECK" = "yes" ]; then
            echo "✓ GTK+ found - will build GUI"
          else
            echo "⚠️  GTK not found - building CLI only"
          fi

      - name: Build for macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_DIR: Releases
        run: |
          chmod +x build_all.sh || true
          ./build_all.sh

      - name: Collect macOS binaries
        run: |
          mkdir -p "$RELEASE_DIR/mac/${{ matrix.arch }}"
          
          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/mac/${{ matrix.arch }}/"
            echo "✓ Copied CLI binary to $RELEASE_DIR/mac/${{ matrix.arch }}/cli_backup_manager"
          else
            echo "⚠️  CLI binary not found at cli_backup_manager"
          fi
          
          if [ -f "dvx3-backup-manager" ]; then
            cp dvx3-backup-manager "$RELEASE_DIR/mac/${{ matrix.arch }}/"
            echo "✓ Copied GUI binary to $RELEASE_DIR/mac/${{ matrix.arch }}/dvx3-backup-manager"
          else
            echo "⚠️  GUI binary not found (CLI-only build)"
          fi

      - name: Package macOS artifacts
        run: |
          MAC_REL="${RELEASE_DIR}/mac/${{ matrix.arch }}"
          
          if [ -d "$MAC_REL" ] && [ "$(ls -A "$MAC_REL")" ]; then
            cd "$MAC_REL"
            tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}.tar.gz" .
            echo "✓ Created: $(pwd)/../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}.tar.gz"
          else
            echo "⚠️  No macOS files found to package"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: Releases/mac/${{ matrix.arch }}/
          if-no-files-found: fail