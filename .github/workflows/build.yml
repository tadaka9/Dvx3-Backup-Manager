name: Multi-Arch Build & Release

on:
  push:
    branches: [ main, master, develop, clean-version ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop, clean-version ]
  workflow_dispatch:

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager

# -------- Linux --------
jobs:
  build-linux:
    name: Linux ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            variant: amd64
            runner: ubuntu-latest
          - arch: aarch64
            variant: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential valac gcc pkg-config zip \
            libglib2.0-dev libgio-2.0-dev libjson-glib-dev \
            libsodium-dev gir1.2-gtk-4.0 libgtk-4-dev

      - name: Set architecture
        run: echo "TARGET_ARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Verify dependencies
        run: |
          echo "=== Dependency check ==="
          pkg-config --modversion glib-2.0
          pkg-config --modversion json-glib-1.0
          pkg-config --modversion libsodium
          if [ $(pkg-config --exists gtk+-4.0) -eq 0 ]; then
            echo "GTK not found, building CLI only"
          else
            echo "GTK found, will build GUI"
          fi

      - name: Build for Linux
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_DIR: Releases
        run: |
          chmod +x build_all.sh || true
          ./build_all.sh

      - name: Collect CLI binary
        run: |
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.variant }}"
          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/linux/${{ matrix.variant }}/"
            echo "✓ Copied CLI binary"
          else
            echo "⚠️  CLI binary not found"
          fi
          
          if [ -f "dvx3-backup-manager" ]; then
            cp dvx3-backup-manager "$RELEASE_DIR/linux/${{ matrix.variant }}/"
            echo "✓ Copied GUI binary"
          else
            echo "⚠️  GUI binary not found (CLI-only)"
          fi

      - name: Package Linux artifacts
        run: |
          mkdir -p "$RELEASE_DIR/linux/${{ matrix.variant }}"
          
          if [ -d "$RELEASE_DIR/linux/${{ matrix.variant }}" ] && [ "$(ls -A "$RELEASE_DIR/linux/${{ matrix.variant }}")" ]; then
            cd "$RELEASE_DIR/linux/${{ matrix.variant }}"
            tar -czf "../../../${ARTIFACT_PREFIX}-linux-${{ matrix.variant }}.tar.gz" .
          else
            echo "No Linux files found to package for ${{ matrix.variant }}"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.variant }}
          path: Releases/linux/${{ matrix.variant }}/
          if-no-files-found: fail
          retention-days: 30
          compression-level: 9

# -------- Windows --------
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
          - arch: arm64
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 ${{ matrix.msystem }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-glib2
            ${{ matrix.prefix }}-json-glib
            ${{ matrix.prefix }}-libsodium
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-vala

      - name: Install Windows dependencies
        run: |
          pacman -S --noconfirm zip dos2unix 2>&1 | tail -5
          
      - name: Build for Windows
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_DIR: Releases
        run: |
          echo "=== Windows environment ==="
          echo "MSYSTEM=$MSYSTEM"
          echo "TARGET_ARCH=$TARGET_ARCH"
          mkdir -p "$GITHUB_WORKSPACE/${RELEASE_DIR}/windows/${{ matrix.arch }}"
          
          chmod +x build_all.sh || true
          TARGET_ARCH="$TARGET_ARCH" ./build_all.sh

      - name: Collect Windows binaries
        run: |
          if [ -f "cli_backup_manager.exe" ]; then
            mkdir -p "$GITHUB_WORKSPACE/${RELEASE_DIR}/windows/${{ matrix.arch }}"
            cp cli_backup_manager.exe "$GITHUB_WORKSPACE/${RELEASE_DIR}/windows/${{ matrix.arch }}/"
            echo "✓ Copied Windows CLI: $(ls -lh "$GITHUB_WORKSPACE/${RELEASE_DIR}/windows/${{ matrix.arch }}/cli_backup_manager.exe")"
          else
            echo "⚠️  Windows CLI binary not found (MSYS2 mingw-w64 toolchain required)"
          fi

      - name: Create Windows ZIP artifact
        run: |
          WIN_REL="${RELEASE_DIR}/windows/${{ matrix.arch }}"
          if [ -n "$(ls -A "$WIN_REL" 2>/dev/null)" ]; then
            cd "$GITHUB_WORKSPACE/$WIN_REL"
            zip -r "${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}.zip" .
            echo "✓ Created: $(pwd)/${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}.zip"
          else
            echo "⚠️  No Windows files to zip"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}
          path: Releases/windows/${{ matrix.arch }}/
          if-no-files-found: fail
          retention-days: 30
          compression-level: 9

# -------- macOS --------
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: |
          brew update
          brew install --quiet \
            pkg-config \
            valac \
            glib \
            json-glib \
            libsodium \
            zip \
            dos2unix \
            gio-unix  # Required for GUI build on macOS

          QT_PATH=$(brew --prefix qt@6)
          if [ -n "$QT_PATH" ] && [ -d "$QT_PATH" ]; then
            echo "$QT_PATH/bin" >> $GITHUB_PATH
            echo "✓ Qt6 found at $QT_PATH"
          else
            echo "⚠️  Qt6 not found, will build GTK4 version"
          fi

      - name: Verify macOS dependencies
        run: |
          echo "=== macOS dependency check ==="
          pkg-config --modversion glib-2.0
          pkg-config --modversion json-glib-1.0
          pkg-config --modversion libsodium
          if [ $(pkg-config --exists gtk+-4.0) -eq 0 ]; then
            echo "GTK not found, building CLI only"
          else
            echo "GTK found, will build GUI"
          fi

      - name: Build for macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_DIR: Releases
        run: |
          chmod +x build_all.sh || true
          ./build_all.sh

      - name: Collect macOS binaries
        run: |
          mkdir -p "$RELEASE_DIR/mac/${{ matrix.arch }}"
          
          if [ -f "cli_backup_manager" ]; then
            cp cli_backup_manager "$RELEASE_DIR/mac/${{ matrix.arch }}/"
            echo "✓ Copied CLI binary to $RELEASE_DIR/mac/${{ matrix.arch }}/cli_backup_manager"
          else
            echo "⚠️  CLI binary not found at cli_backup_manager"
          fi
          
          if [ -f "dvx3-backup-manager" ]; then
            cp dvx3-backup-manager "$RELEASE_DIR/mac/${{ matrix.arch }}/"
            echo "✓ Copied GUI binary to $RELEASE_DIR/mac/${{ matrix.arch }}/dvx3-backup-manager"
          else
            echo "⚠️  GUI binary not found (CLI-only)"
          fi

      - name: Package macOS artifacts
        run: |
          MAC_REL="${RELEASE_DIR}/mac/${{ matrix.arch }}"
          
          if [ -d "$MAC_REL" ] && [ "$(ls -A "$MAC_REL")" ]; then
            cd "$MAC_REL"
            tar -czf "../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}.tar.gz" .
            echo "✓ Created: $(pwd)/../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}.tar.gz"
          else
            echo "⚠️  No macOS files found to package"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: Releases/mac/${{ matrix.arch }}/
          if-no-files-found: fail
          retention-days: 30
          compression-level: 9

# -------- Publish Release --------
publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "=== Release artifacts ==="
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort || true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<EOF>