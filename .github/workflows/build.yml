name: Build, Package & Release

on:
  push:
    branches: [ main, master, clean-version ]
  pull_request:
    branches: [ main, master, clean-version ]
  workflow_dispatch:
    inputs:
      strict_artifact_checks:
        description: 'Strict artifact checks (true|false)'
        required: false
        default: 'true'
  release:
    types: [published]

env:
  RELEASE_DIR: Releases
  ARTIFACT_PREFIX: Dvx3-Backup-Manager
  STRICT_ARTIFACT_CHECKS: ${{ github.event.inputs.strict_artifact_checks || 'true' }}  # Set input on workflow_dispatch to alter behavior

jobs:
  # ------------------------------------------------------------------
  # macOS builds (universal packaging from x86_64 + arm64)
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runs_on: macos-latest
          - arch: x86_64
            runs_on: macos-12
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew and install packages
        run: |
          set -ex
          brew update
          # Repair taps and update metadata to avoid issues with unavailable formulas
          brew tap --repair || true
          brew update --force --quiet || true
          # Try to ensure homebrew/core is tapped
          if ! brew tap | grep -q "homebrew/core"; then
            brew tap homebrew/core || true
          fi
          # Prefer qt@6 if available; otherwise fall back to qt
          if brew --prefix qt@6 >/dev/null 2>&1; then
            QT_FORMULA=qt@6
          else
            QT_FORMULA=qt
          fi
          brew install --build-bottle \
            pkg-config \
            vala \
            glib \
            json-glib \
            libsodium \
            zstd \
            $QT_FORMULA \
            ninja \
            cmake \
            ccache \
            create-dmg || true
          # Verify formulas are available: print info and fail early for invalid formulas
          for f in pkg-config vala glib json-glib libsodium zstd $QT_FORMULA ninja cmake ccache create-dmg qttools; do
            if ! brew info "$f" >/dev/null 2>&1; then
              echo "::warning::Homebrew formula '$f' not available or not found; attempting to tap homebrew/core and retry"
              brew tap homebrew/core || true
              if ! brew info "$f" >/dev/null 2>&1; then
                echo "::error::Homebrew formula '$f' could not be located; installation may fail" && true
              fi
            fi
          done
          brew install qttools || true
          brew link --overwrite $QT_FORMULA || true
          QT6_PREFIX=$(brew --prefix $QT_FORMULA)
          echo "$QT6_PREFIX/bin" >> $GITHUB_PATH || true
          echo "$QT6_PREFIX/libexec" >> $GITHUB_PATH || true

      - name: Configure macOS environment and verify moc
        run: |
          set -ex
          # Determine prefix to the installed Qt formula: qt@6 preferred, fallback to qt
          if brew --prefix qt@6 >/dev/null 2>&1; then
            QT6_PREFIX=$(brew --prefix qt@6)
          else
            QT6_PREFIX=$(brew --prefix qt)
          fi
          export PATH="$QT6_PREFIX/bin:$QT6_PREFIX/libexec:$PATH"
          which moc || true
          moc --version || true

      - name: Build GUI (macOS)
        run: |
          set -ex
          chmod +x build_gui.sh || true
          ./build_gui.sh || true

      - name: Bundle macOS app and fix libsodium linking
        run: |
          set -ex
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib"
          # Use macdeployqt (bundle Qt and plugins) if available
          if command -v macdeployqt >/dev/null 2>&1; then
            # If our build produced an .app bundle, use macdeployqt
            if [ -d build/backup-manager-gui.app ]; then
              macdeployqt build/backup-manager-gui.app || true
              cp -r build/backup-manager-gui.app "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/" || true
            fi
          fi
          # Debug: list top-level build artifacts and workspace root to help debug missing files
          echo "Workspace root (top-level) listing:" && ls -la || true
          echo "Build directory listing:" && ls -la build || true
          echo "build/Releases directory listing (if present):" && ls -la build/Releases || true
          # Copy executable artifacts into release folder
          if [ -f backup-manager-gui ]; then
            cp backup-manager-gui "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/" || true
          fi
          # If there is no .app bundle but a binary exists, create a minimal .app wrapper
          if ! ls $GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/*.app 1>/dev/null 2>&1; then
            # Look for known build output locations for mac artifacts
            set +e
            FIND_CANDIDATE=$(find build -type f \( -name 'backup-manager-gui' -o -name 'backup-manager-gui*' -o -name '*.app' \) -print -quit || true)
            if [ -n "$FIND_CANDIDATE" ]; then
              echo "Found candidate at $FIND_CANDIDATE"
            fi
            set -e
            if [ -f backup-manager-gui ] || [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/backup-manager-gui" ] || [ -n "$FIND_CANDIDATE" ]; then
              echo "Creating minimal .app bundle from binary"
              APPDIR="$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/backup-manager-gui.app"
              mkdir -p "$APPDIR/Contents/MacOS" || true
              mkdir -p "$APPDIR/Contents/Frameworks" || true
              mkdir -p "$APPDIR/Contents/Plugins" || true
              # Prefer binary in release dir if present
              if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/backup-manager-gui" ]; then
                cp "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/backup-manager-gui" "$APPDIR/Contents/MacOS/backup-manager-gui" || true
              else
                if [ -n "$FIND_CANDIDATE" ]; then
                  cp "$FIND_CANDIDATE" "$APPDIR/Contents/MacOS/backup-manager-gui" || true
                else
                  cp backup-manager-gui "$APPDIR/Contents/MacOS/backup-manager-gui" || true
                fi
              fi
              chmod +x "$APPDIR/Contents/MacOS/backup-manager-gui" || true
              # Try to include libdvx3 or libb2 or libsodium into app frameworks
              if [ -f libdvx3.dylib ]; then
                cp libdvx3.dylib "$APPDIR/Contents/Frameworks/" || true
              elif [ -f build/libdvx3.dylib ]; then
                cp build/libdvx3.dylib "$APPDIR/Contents/Frameworks/" || true
              fi
              if ls build/*/libb2*.dylib >/dev/null 2>&1; then
                for s in build/*/libb2*.dylib; do cp "$s" "$APPDIR/Contents/Frameworks/" || true; done
              fi
              if brew --prefix libsodium >/dev/null 2>&1; then
                SOD=$(brew --prefix libsodium)/lib/libsodium*.dylib || true
                [ -e "$SOD" ] && cp $SOD "$APPDIR/Contents/Frameworks/" || true
              fi
              # Adjust install names to make frameworks local to bundle
              for f in "$APPDIR/Contents/MacOS"/*; do
                if file "$f" | grep -qi "Mach-O"; then
                  if [ -f "$APPDIR/Contents/Frameworks/libdvx3.dylib" ]; then
                    install_name_tool -change "libdvx3.dylib" "@executable_path/../Frameworks/libdvx3.dylib" "$f" || true
                  fi
                fi
              done
            fi
          fi
          # Fallback: copy everything from build/Releases into Releases/mac/<arch>/ if present
          if [ -d build/Releases ]; then
            echo "Copying build/Releases contents to $GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}"
            cp -r build/Releases/* "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/" 2>/dev/null || true
          fi
          # Fix libsodium for runtime: copy library and change install names
          if brew --prefix libsodium >/dev/null 2>&1; then
            LIBSODIUM=$(brew --prefix libsodium)/lib/libsodium*.dylib || true
            if [ -e "$LIBSODIUM" ]; then
              cp $LIBSODIUM "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/" || true
              for f in "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}"/*; do
                if file "$f" | grep -qi "Mach-O"; then
                  install_name_tool -change "$LIBSODIUM" "@executable_path/../lib/$(basename $LIBSODIUM)" "$f" || true
                fi
              done
            fi
          fi
          # Copy libdvx3 and other built dylibs (libb2) into the release lib folder if present
          if [ -f libdvx3.dylib ]; then
            cp libdvx3.dylib "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/" || true
          elif [ -f build/libdvx3.dylib ]; then
            cp build/libdvx3.dylib "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/" || true
          elif ls build/*/libdvx3*.dylib >/dev/null 2>&1; then
            for s in build/*/libdvx3*.dylib; do cp "$s" "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/" || true; done
          fi
          if ls build/*/libb2*.dylib >/dev/null 2>&1; then
            for s in build/*/libb2*.dylib; do cp "$s" "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/" || true; done
          fi
          # Run install_name_tool to adjust lib references to @executable_path/../lib for libdvx3, libb2, lib(sodium)
          for f in "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}"/*; do
            if file "$f" | grep -qi "Mach-O"; then
              if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/libdvx3.dylib" ]; then
                install_name_tool -change "libdvx3.dylib" "@executable_path/../lib/libdvx3.dylib" "$f" || true
              fi
              if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib/libb2.dylib" ]; then
                install_name_tool -change "libb2.dylib" "@executable_path/../lib/libb2.dylib" "$f" || true
              fi
            fi
          done
          echo "Contents of mac release dir after copying libs:"
          ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}" || true
          ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}/lib" || true

      - name: Show mac release dir and create mac artifact
        run: |
          set -ex
          echo "Contents of $GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }} before creating tar:"
          ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}" || true
          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/${{ matrix.arch }}" || true
          tar -czf ../../${ARTIFACT_PREFIX}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz . || true
          cd -

      - name: Verify mac artifact contents
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz
          echo "Listing tar contents for $ART"
          tar -tzf "$ART" | sed -n '1,200p' > tar_contents.txt || true
          # List extracted files for debug and simple assertions
          # Check for some specific libs/plugins
          greps='\.app/|backup-manager-gui|lib/libsodium|libb2|libdvx3|Contents/Plugins|Contents/Frameworks'
          if ! grep -E "$greps" tar_contents.txt > /dev/null; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "⚠ Expected files not found in mac artifact (warn-only): $greps" || true
            else
              echo "⚠ Expected files not found in mac artifact: $greps" && exit 1
            fi
          fi

      - name: Compute mac artifact sha256
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz
          DIR=$(dirname "$ART")
          BASE=$(basename "$ART")
          pushd "$DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BASE" > "$BASE".sha256
          else
            shasum -a 256 "$BASE" > "$BASE".sha256
          fi
          popd

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-${{ matrix.arch }}-${{ github.run_id }}.tar.gz.sha256

  # ------------------------------------------------------------------
  # Windows builds (x86_64 & aarch64)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64,aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Install MSYS2 packages (arch-aware)
        shell: msys2 {0}
        run: |
          set -ex
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
              PACMAN_PREFIX="mingw-w64-x86_64"
          else
              PACMAN_PREFIX="mingw-w64-aarch64"
          fi
          # Verify pacman is present
          if ! command -v pacman >/dev/null 2>&1; then
            echo "::error::pacman not found in the MSYS2 environment; setup failed" && exit 1
          fi
          pacman -Syu --noconfirm || true
          # Attempt to install packages; on failure we continue so builds don't completely abort here
          pacman -S --noconfirm ${PACMAN_PREFIX}-toolchain ${PACMAN_PREFIX}-vala ${PACMAN_PREFIX}-glib2 ${PACMAN_PREFIX}-json-glib ${PACMAN_PREFIX}-libsodium ${PACMAN_PREFIX}-qt6-base ${PACMAN_PREFIX}-qt6-tools ${PACMAN_PREFIX}-pkgconf || true
          # Ensure zip is available for packaging; msys/zip is available under MSYS2
          pacman -S --noconfirm zip || true
          if command -v zip >/dev/null 2>&1; then
            echo "zip is present at $(command -v zip)"
          else
            echo "⚠ zip not found in MSYS2; the workflow will attempt PowerShell fallback" || true
          fi
          # Check for windeployqt and other expected tools (present if the mingw-* qt packages were installed)
          if command -v windeployqt >/dev/null 2>&1; then
            echo "windeployqt found at $(command -v windeployqt)"
          else
            echo "⚠ windeployqt not found; Qt deployment will be skipped or incomplete" || true
          fi
          # Check that critical pacman packages were installed (best-effort), warn if not
          for pkg in "${PACMAN_PREFIX}-qt6-base" "${PACMAN_PREFIX}-libsodium" "zip"; do
            if pacman -Qs "$pkg" >/dev/null 2>&1; then
              echo "pacman: $pkg installed"
            else
              echo "⚠ pacman: $pkg NOT installed; packaging may fail" || true
            fi
          done
          # List contents of /mingw*/bin to help debug missing files in pre-checks
          ls -la /mingw64/bin || true
          ls -la /mingw32/bin || true

      - name: Build GUI (Windows)
        shell: msys2 {0}
        run: |
          set -ex
          # Ensure scripts are executable in MSYS2
          chmod +x build_gui.sh || true
          ./build_gui.sh || true

      - name: Collect Windows artifacts and ensure libsodium.dll present
        shell: msys2 {0}
        run: |
          set -ex
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
          # Copy produced executables and DLLs
          if [ -f backup-manager-gui.exe ]; then
            cp backup-manager-gui.exe "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true
          elif [ -f backup-manager-gui ]; then
            cp backup-manager-gui "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true
          fi
          # Copy libsodium DLL into Releases folder (MSYS2 path)
          if [ -f /mingw64/bin/libsodium.dll ]; then
            cp /mingw64/bin/libsodium.dll "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true
          elif [ -f /usr/bin/libsodium.dll ]; then
            cp /usr/bin/libsodium.dll "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true
          fi
          # Copy libdvx3 dll into Releases folder if it's present
          if [ -f libdvx3.dll ]; then
            cp libdvx3.dll "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true
          elif [ -f build/libdvx3.dll ]; then
            cp build/libdvx3.dll "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true
          elif ls build/*/libdvx3.dll >/dev/null 2>&1; then
            for s in build/*/libdvx3.dll; do cp "$s" "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" || true; done
          fi
          # Use windeployqt if available to gather Qt dependencies
          if command -v windeployqt >/dev/null 2>&1; then
            if [ -f backup-manager-gui.exe ]; then
              windeployqt --dir "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}" backup-manager-gui.exe || true
            fi
          fi
          # Fallback: If build/Releases exists and has files, copy them to final Releases folder
          if [ -d build/Releases ]; then
            echo "Copying build/Releases contents to $GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
            cp -r build/Releases/* "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/" 2>/dev/null || true
          fi

      - name: Show windows release dir and create Windows artifact
        shell: msys2 {0}
        run: |
          set -ex
          # Ensure Releases top-level exists, even if empty
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR" || true
          echo "Contents of $GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }} before creating zip:"
          ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}" || true
          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}" || true
          # If the per-arch Releases dir is empty, handle accordingly (skip for optional archs or bail based on STRICT_ARTIFACT_CHECKS)
          # Use a robust nullglob-safe test to determine if the directory has any files
          shopt -s nullglob || true
          files=("$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found in $GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
            # If there's build/Releases, we'll use that as a fallback. Otherwise decide based on arch and strictness
            if [ -d build/Releases ] && [ -n "$(ls -A build/Releases 2>/dev/null)" ]; then
              echo "Found build/Releases; will create zip from build/Releases"
            else
              if [ "${{ matrix.arch }}" = "aarch64" ]; then
                echo "⚠ No files for windows aarch64; skipping packaging for optional arch" && exit 0
              fi
              if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
                echo "⚠ No files to package for windows-${{ matrix.arch }}; skipping (warn-only)" && exit 0
              fi
              echo "No files to package and STRICT_ARTIFACT_CHECKS is set; failing" && exit 1
            fi
          fi
          # Try zip first (MSYS2); fallback to PowerShell Compress-Archive if zip not available
          if command -v zip >/dev/null 2>&1; then
            zip -r ../../${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip . || true
          else
            echo "zip not found; attempting PowerShell Compress-Archive fallback"
            # Use PowerShell from bash to compress: convert path to Windows style for both source and destination
            WINPATH=$(cygpath -w "$PWD")
            PSZIP_UNIX="$RELEASE_DIR/${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip"
            # Convert both source and dest to absolute Windows paths using GITHUB_WORKSPACE
            WINPSZIP=$(cygpath -w "$GITHUB_WORKSPACE/$PSZIP_UNIX")
            echo "WINPATH $WINPATH"
            echo "WINPSZIP $WINPSZIP"
            powershell -Command "Compress-Archive -Path '${WINPATH}\*' -DestinationPath '${WINPSZIP}' -Force" || true
          fi
          cd -
          cd -
          # Ensure the top-level Releases dir contains the created zip
          ZIP_NAME="${ARTIFACT_PREFIX}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip"
            if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" ]; then
              echo "Created zip: $GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME"
              ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" || true
          else
            # Fallback: try to build a zip from build/Releases or Releases/windows/<arch>
            if [ -d build/Releases ]; then
              echo "Fallback: Creating zip from build/Releases"
              if command -v zip >/dev/null 2>&1; then
                shopt -s nullglob || true
                if compgen -G "build/Releases/*" > /dev/null; then
                  zip -r "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" build/Releases/* || true
                else
                  echo "No files in build/Releases to zip" || true
                fi
                else
                # Use PowerShell to zip on Windows - convert to absolute paths
                WINSRC=$(cygpath -w "$GITHUB_WORKSPACE/build/Releases/*")
                WINDEST=$(cygpath -w "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME")
                echo "WINSRC $WINSRC"
                echo "WINDEST $WINDEST"
                powershell -Command "Compress-Archive -Path '${WINSRC}' -DestinationPath '${WINDEST}' -Force" || true
              fi
            elif [ -d "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}" ]; then
              echo "Fallback: Creating zip from $GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}"
              if command -v zip >/dev/null 2>&1; then
                shopt -s nullglob || true
                if compgen -G "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}/*" > /dev/null; then
                  (cd "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}" && zip -r "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" .) || true
                else
                  echo "No files found in $GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }} to zip" || true
                fi
                else
                WINPATH=$(cygpath -w "$GITHUB_WORKSPACE/$RELEASE_DIR/windows/${{ matrix.arch }}")
                WINDEST=$(cygpath -w "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME")
                echo "WINPATH $WINPATH"
                echo "WINDEST $WINDEST"
                powershell -Command "Compress-Archive -Path '${WINPATH}\*' -DestinationPath '${WINDEST}' -Force" || true
              fi
            fi
            if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" ]; then
              echo "Created fallback zip: $GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" && ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" || true
            else
              echo "ERROR: Expected zip not found at $GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" && ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR" || true
              # If optional aarch64, create a placeholder artifact so the release step has something to upload
              if [ "${{ matrix.arch }}" = "aarch64" ]; then
                echo "Creating placeholder artifact for optional windows aarch64"
                mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR" || true
                echo "This aarch64 build did not produce artifacts; placeholder created on $(date)" > "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME.placeholder.txt" || true
                if command -v zip >/dev/null 2>&1; then
                  (cd "$GITHUB_WORKSPACE/$RELEASE_DIR" && zip -r "$ZIP_NAME" "$ZIP_NAME.placeholder.txt" ) || true
                else
                  WINDEST=$(cygpath -w "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME")
                  WINSRC=$(cygpath -w "$GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME.placeholder.txt")
                  powershell -Command "Compress-Archive -Path '${WINSRC}' -DestinationPath '${WINDEST}' -Force" || true
                fi
                echo "Created placeholder zip: $GITHUB_WORKSPACE/$RELEASE_DIR/$ZIP_NAME" || true
              else
                exit 1
              fi
            fi
          fi

      - name: Verify Windows artifact contents
        shell: msys2 {0}
        run: |
          set -ex
          ART_PATH=${{ env.RELEASE_DIR }}
          ART_PATTERN="${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip"
          ART="$GITHUB_WORKSPACE/$ART_PATH/$ART_PATTERN"
          echo "Looking for artifact at $ART"
          if [ ! -f "$ART" ]; then
            echo "Artifact not found at $ART. Searching for any matching zip..."
            ART=$(ls "$GITHUB_WORKSPACE/$ART_PATH/${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-*.zip" 2>/dev/null | head -n1 || true)
            if [ -z "$ART" ]; then
              # Try top-level workspace search
              ART=$(ls "$GITHUB_WORKSPACE/${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-*.zip" 2>/dev/null | head -n1 || true)
            fi
          fi
          echo "Using artifact: $ART"
          # Debug: print some workspace directories to assist with tracing file locations
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Releases dir listing:" && ls -la "$GITHUB_WORKSPACE/$RELEASE_DIR" || true
          echo "build/Releases listing (if present):" && ls -la build/Releases || true
          if [ -z "$ART" ] || [ ! -f "$ART" ]; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "⚠ Artifact not found ($ART). Skipping verification (warn-only)" || true
              exit 0
            else
              # If this is windows aarch64 build, skip verification as aarch64 artifacts might not be produced in CI
              if [ "${{ matrix.arch }}" = "aarch64" ]; then
                echo "⚠ Artifact not found for windows aarch64 ($ART). Skipping verification (warn-only because aarch64 artifacts may be omitted)" || true
                exit 0
              fi
              echo "⚠ Artifact not found ($ART). Failing" && exit 1
            fi
          fi
          echo "Listing zip contents for $ART"
          if command -v unzip >/dev/null 2>&1; then
            unzip -l "$ART" | sed -n '1,200p' > zip_contents.txt || true
          else
            echo "unzip not found; attempting to extract and list with PowerShell" || true
            mkdir -p ps_zip_extracted || true
            powershell -Command "Expand-Archive -Path \"$ART\" -DestinationPath \"ps_zip_extracted\" -Force; Get-ChildItem -Path ps_zip_extracted -Recurse | select -Expand FullName" > zip_contents_raw.txt || true
            sed -n '1,200p' zip_contents_raw.txt > zip_contents.txt || true
          fi
          echo "--- zip_contents.txt (first 200 lines) ---"
          sed -n '1,200p' zip_contents.txt || true
            greps='backup-manager-gui.exe|backup-manager-gui|libsodium\.dll|libdvx3\.dll|qwindows\.dll|libb2|Qt'
            if ! grep -E "$greps" zip_contents.txt > /dev/null; then
              if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
                echo "⚠ Expected files not found in windows artifact (warn-only): $greps" || true
              else
                echo "⚠ Expected files not found in windows artifact: $greps" && exit 1
              fi
            fi

      - name: Compute windows artifact sha256
        id: compute-windows-sha
        shell: msys2 {0}
        run: |
          set -ex
          ART="$GITHUB_WORKSPACE/${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip"
          if [ ! -f "$ART" ]; then
            echo "Artifact not found at $ART"
            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              echo "⚠ Optional windows aarch64 artifact not present; skipping sha256 compute" && echo "found=false" >> $GITHUB_OUTPUT && exit 0
            fi
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "⚠ Artifact not found; skipping sha256 compute (warn-only)" && echo "found=false" >> $GITHUB_OUTPUT && exit 0
            fi
            echo "::error::Artifact not found: $ART" && echo "found=false" >> $GITHUB_OUTPUT && exit 1
          fi
          DIR=$(dirname "$ART")
          BASE=$(basename "$ART")
          pushd "$DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BASE" > "$BASE".sha256
          else
            shasum -a 256 "$BASE" > "$BASE".sha256
          fi
          popd
          echo "found=true" >> $GITHUB_OUTPUT

      - name: Upload Windows artifact
        if: steps.compute-windows-sha.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-windows-${{ matrix.arch }}-${{ github.run_id }}.zip.sha256

  # ------------------------------------------------------------------
  # Linux build (x86_64)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          set -ex
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config valac libjson-glib-dev libsodium-dev zstd tar imagemagick ninja-build ccache patchelf \
            qt6-base-dev || true

      - name: Build GUI (Linux)
        run: |
          set -ex
          chmod +x build_gui.sh || true
          ./build_gui.sh
          echo "Build finished; listing root and build/ contents for debugging"
          ls -la || true
          ls -la build || true
          echo "Searching for generated binaries (backup-manager-gui) after build:" || true
          find . -maxdepth 4 -type f \( -name 'backup-manager-gui' -o -name 'backup-manager-gui*' \) -exec ls -la '{}' \; -exec file '{}' \; || true

      - name: Package Linux artifacts and fix libsodium linking
        run: |
          set -ex
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/lib" || true
          echo "Debug: root working dir contents:" && ls -la || true
          echo "Debug: build/Releases contents (if present):" && ls -la build/Releases || true
          # Print any artifacts manifests if present
          for f in build/Releases/*/artifacts.txt; do
            [ -f "$f" ] || continue
            echo "---- $f ----"
            cat "$f" || true
          done
          # Try to find a generated backup-manager-gui binary (multiple possible locations)
          FOUND_BIN=""
          for TRY in backup-manager-gui build/backup-manager-gui build/*/backup-manager-gui; do
            if [ -f "${TRY}" ]; then
              FOUND_BIN="$TRY"
              break
            fi
          done
          if [ -z "$FOUND_BIN" ]; then
            FOUND_BIN=$(find . -maxdepth 6 -type f -name 'backup-manager-gui' -print -quit || true)
          fi
          if [ -n "$FOUND_BIN" ]; then
            echo "Found binary at $FOUND_BIN" && file "$FOUND_BIN" || true
            ldd "$FOUND_BIN" || true
            cp "$FOUND_BIN" "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/" || true
          else
            echo "Warning: backup-manager-gui binary not found in workspace. Trying fallback to build/Releases..."
            if [ -d build/Releases ] && [ -n "$(ls -A build/Releases 2>/dev/null)" ]; then
              echo "Found build/Releases contents; copying to release dir"
              cp -r build/Releases/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/" 2>/dev/null || true
            else
              if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
                echo "⚠ backup-manager-gui not found; continuing (warn-only)"
              else
                echo "::error::backup-manager-gui not found; failing packaging" && exit 1
              fi
            fi
          fi
          # Copy libsodium into release lib (try ldconfig first, fallback to distro path)
          SODIUM_SO=$(ldconfig -p 2>/dev/null | grep libsodium | head -n 1 | awk '{print $NF}' || true)
          if [ -n "$SODIUM_SO" ] && [ -f "$SODIUM_SO" ]; then
            cp "$SODIUM_SO" "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/lib/" || true
          else
            cp /usr/lib/x86_64-linux-gnu/libsodium.so.* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/lib/" 2>/dev/null || true
          fi
          # Create a simple wrapper to set LD_LIBRARY_PATH for the extracted package
          cat > "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/Dvx3-Run.sh" << 'SH' || true
          #!/bin/bash
          SCRIPT=$(readlink -f "$0")
          BASEDIR=$(dirname "$SCRIPT")
          export LD_LIBRARY_PATH="$BASEDIR/lib:$LD_LIBRARY_PATH"
          exec "$BASEDIR/backup-manager-gui" "$@"
          SH
          chmod +x "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/Dvx3-Run.sh" || true
          # Use patchelf to set rpath when available
          if command -v patchelf >/dev/null 2>&1; then
            if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/backup-manager-gui" ]; then
              patchelf --set-rpath '$ORIGIN/lib' "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/backup-manager-gui" || true
            fi
          fi
          # Try to include Qt platform plugins for Linux (XCB platform)
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/plugins/platforms" || true
          if [ -d "/usr/lib/qt6/plugins/platforms" ]; then
            cp -r /usr/lib/qt6/plugins/platforms/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/plugins/platforms/" 2>/dev/null || true
          elif [ -d "/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms" ]; then
            cp -r /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/plugins/platforms/" 2>/dev/null || true
          fi
          # Copy any build/Releases contents as a fallback
          if [ -d build/Releases ]; then
            cp -r build/Releases/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/" 2>/dev/null || true
          fi
          # Debug: confirm if libdvx3.so is included; if strict, fail when absent
          if [ ! -f "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/lib/libdvx3.so" ]; then
            echo "Warning: libdvx3.so not present in packaged lib folder" || true
            if [ "${STRICT_ARTIFACT_CHECKS}" = "true" ]; then
              echo "::error::libdvx3.so missing from packaging; failing" && exit 1
            fi
          else
            echo "libdvx3.so is present in package: $(ls -la $GITHUB_WORKSPACE/$RELEASE_DIR/linux/x86_64/lib/libdvx3.so)" || true
          fi
          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/linux" || true
          tar -czf ../${ARTIFACT_PREFIX}-linux-x86_64-${{ github.run_id }}.tar.gz x86_64 || true
          cd -

      - name: Verify linux artifact contents
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}.tar.gz
          echo "Listing tar contents for $ART"
          tar -tzf "$ART" | sed -n '1,200p' > tar_contents.txt || true
          # Check for some specific libs/plugins (libb2, libdvx3, Qt XCB plugin)
          greps='backup-manager-gui|Dvx3-Run.sh|lib/libsodium|libb2|libdvx3|plugins/platforms/libqxcb|plugins/platforms/libqxcb.so'
          if ! grep -E "$greps" tar_contents.txt > /dev/null; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "⚠ Expected files not found in linux artifact (warn-only): $greps" || true
            else
              echo "⚠ Expected files not found in linux artifact: $greps" && exit 1
            fi
          fi

      - name: Compute linux artifact sha256
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}.tar.gz
          DIR=$(dirname "$ART")
          BASE=$(basename "$ART")
          pushd "$DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BASE" > "$BASE".sha256
          else
            shasum -a 256 "$BASE" > "$BASE".sha256
          fi
          popd

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}.tar.gz
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-x86_64-${{ github.run_id }}.tar.gz.sha256

  # ------------------------------------------------------------------
  # Linux build (aarch64)
  # ------------------------------------------------------------------
  build-linux-aarch64:
    name: Build Linux aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          set -ex
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config valac libjson-glib-dev libsodium-dev zstd tar imagemagick ninja-build ccache patchelf \
            qt6-base-dev || true

      - name: Build GUI (Linux aarch64)
        run: |
          set -ex
          chmod +x build_gui.sh || true
          # Use local cross-detect; build_gui.sh uses uname -m to detect arch, but we set ARCH env just to be explicit
          ARCH=aarch64 ./build_gui.sh || true
          echo "Build finished; listing root and build/ contents for debugging"
          ls -la || true
          ls -la build || true
          echo "Searching for generated binaries (backup-manager-gui) after build:" || true
          find . -maxdepth 6 -type f \( -name 'backup-manager-gui' -o -name 'backup-manager-gui*' \) -exec ls -la '{}' \; -exec file '{}' \; || true

      - name: Package Linux artifacts and fix libsodium linking (aarch64)
        run: |
          set -ex
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib" || true
          echo "Debug: root working dir contents:" && ls -la || true
          echo "Debug: build/Releases contents (if present):" && ls -la build/Releases || true
          # Print any artifacts manifests if present
          for f in build/Releases/*/artifacts.txt; do
            [ -f "$f" ] || continue
            echo "---- $f ----"
            cat "$f" || true
          done
          # Try to find a generated backup-manager-gui binary (multiple possible locations)
          FOUND_BIN=""
          for TRY in backup-manager-gui build/backup-manager-gui build/*/backup-manager-gui; do
            if [ -f "${TRY}" ]; then
              FOUND_BIN="$TRY"
              break
            fi
          done
          if [ -z "$FOUND_BIN" ]; then
            FOUND_BIN=$(find . -maxdepth 6 -type f -name 'backup-manager-gui' -print -quit || true)
          fi
          if [ -n "$FOUND_BIN" ]; then
            echo "Found binary at $FOUND_BIN" && file "$FOUND_BIN" || true
            ldd "$FOUND_BIN" || true
            cp "$FOUND_BIN" "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/" || true
          else
            echo "Warning: backup-manager-gui binary not found in workspace. Trying fallback to build/Releases..."
            if [ -d build/Releases ] && [ -n "$(ls -A build/Releases 2>/dev/null)" ]; then
              echo "Found build/Releases contents; copying to release dir"
              cp -r build/Releases/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/" 2>/dev/null || true
            else
              if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
                echo "⚠ backup-manager-gui not found; continuing (warn-only)"
              else
                echo "::error::backup-manager-gui not found; failing packaging" && exit 1
              fi
            fi
          fi
          # Copy libsodium into release lib (try ldconfig first, fallback to distro path)
          SODIUM_SO=$(ldconfig -p 2>/dev/null | grep libsodium | head -n 1 | awk '{print $NF}' || true)
          if [ -n "$SODIUM_SO" ] && [ -f "$SODIUM_SO" ]; then
            cp "$SODIUM_SO" "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/" || true
          else
            cp /usr/lib/aarch64-linux-gnu/libsodium.so.* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/" 2>/dev/null || true
          fi
          # Copy libdvx3 into the release lib directory so it can be found by LD_LIBRARY_PATH
          if [ -f "libdvx3.so" ]; then
            cp libdvx3.so "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/" || true
          elif [ -f "build/libdvx3.so" ]; then
            cp build/libdvx3.so "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/" || true
          elif ls build/*/libdvx3.so >/dev/null 2>&1; then
            for s in build/*/libdvx3.so; do cp "$s" "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/" || true; done
          fi
          # Create a simple wrapper to set LD_LIBRARY_PATH for the extracted package
          cat > "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/Dvx3-Run.sh" << 'SH' || true
          #!/bin/bash
          SCRIPT=$(readlink -f "$0")
          BASEDIR=$(dirname "$SCRIPT")
          export LD_LIBRARY_PATH="$BASEDIR/lib:$LD_LIBRARY_PATH"
          exec "$BASEDIR/backup-manager-gui" "$@"
          SH
          chmod +x "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/Dvx3-Run.sh" || true
          # Use patchelf to set rpath when available
          if command -v patchelf >/dev/null 2>&1; then
            if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/backup-manager-gui" ]; then
              patchelf --set-rpath '$ORIGIN/lib' "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/backup-manager-gui" || true
            fi
          fi
          # Try to include Qt platform plugins for Linux (XCB platform)
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/plugins/platforms" || true
          if [ -d "/usr/lib/qt6/plugins/platforms" ]; then
            cp -r /usr/lib/qt6/plugins/platforms/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/plugins/platforms/" 2>/dev/null || true
          elif [ -d "/usr/lib/aarch64-linux-gnu/qt6/plugins/platforms" ]; then
            cp -r /usr/lib/aarch64-linux-gnu/qt6/plugins/platforms/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/plugins/platforms/" 2>/dev/null || true
          fi
          # Copy any build/Releases contents as a fallback
          if [ -d build/Releases ]; then
            cp -r build/Releases/* "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/" 2>/dev/null || true
          fi
          # Debug: confirm if libdvx3.so is included; if strict, fail when absent
          if [ ! -f "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/libdvx3.so" ]; then
            echo "Warning: libdvx3.so not present in packaged lib folder" || true
            if [ "${STRICT_ARTIFACT_CHECKS}" = "true" ]; then
              echo "::error::libdvx3.so missing from packaging; failing" && exit 1
            fi
          else
            echo "libdvx3.so is present in package: $(ls -la $GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/libdvx3.so)" || true
          fi
          cd "$GITHUB_WORKSPACE/$RELEASE_DIR/linux" || true
          tar -czf ../${ARTIFACT_PREFIX}-linux-aarch64-${{ github.run_id }}.tar.gz aarch64 || true
          cd -

      - name: Verify linux artifact contents (aarch64)
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-aarch64-${{ github.run_id }}.tar.gz
          echo "Listing tar contents for $ART"
          tar -tzf "$ART" | sed -n '1,200p' > tar_contents.txt || true
          greps='backup-manager-gui|Dvx3-Run.sh|lib/libsodium|libb2|libdvx3|plugins/platforms/libqxcb|plugins/platforms/libqxcb.so'
          if ! grep -E "$greps" tar_contents.txt > /dev/null; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "⚠ Expected files not found in linux artifact (warn-only): $greps" || true
            else
              echo "⚠ Expected files not found in linux artifact: $greps" && exit 1
            fi
          fi

      - name: Compute linux artifact sha256 (aarch64)
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-aarch64-${{ github.run_id }}.tar.gz
          DIR=$(dirname "$ART")
          BASE=$(basename "$ART")
          pushd "$DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BASE" > "$BASE".sha256
          else
            shasum -a 256 "$BASE" > "$BASE".sha256
          fi
          popd

      - name: Upload Linux aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-aarch64-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-aarch64-${{ github.run_id }}.tar.gz
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-linux-aarch64-${{ github.run_id }}.tar.gz.sha256

      - name: Install QEMU user-static and attempt to run aarch64 binary (warn-only)
        run: |
          set -ex
          sudo apt-get update
          # QEMU user mode for aarch64; provide binfmt support so binaries can be executed directly if possible
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-user-static binfmt-support || true
          which qemu-aarch64 || true
          echo "Trying to locate built aarch64 binary under Releases/linux/aarch64 and build/Releases..."
          BIN="$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/backup-manager-gui"
          if [ ! -f "$BIN" ]; then
            BIN=$(find build -type f -name 'backup-manager-gui*' -print -quit || true)
          fi
          if [ -z "$BIN" ]; then
            echo "No aarch64 binary found in release or build output; skipping QEMU run (warn-only)" || true
            exit 0
          fi
          echo "Using binary: $BIN"
          # Try an ldd-like library check by invoking the aarch64 binary under qemu with env LD_LIBRARY_PATH set to packaged lib folder
          if [ -f "$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib/libdvx3.so" ]; then
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/$RELEASE_DIR/linux/aarch64/lib:$LD_LIBRARY_PATH"
          fi
          echo "Attempting to run 'backup-manager-gui --version' using qemu-aarch64 (may fail if missing system libs)"
          # Wrap in a conditional to keep this warn-only; it helps to catch obvious issues but avoid blocking the pipeline
          if qemu-aarch64 -L /usr "$BIN" --version 2>/tmp/qemu-run-err.txt > /tmp/qemu-run-out.txt; then
            echo "QEMU executed binary successfully:"
            cat /tmp/qemu-run-out.txt || true
          else
            echo "QEMU run failed (see /tmp/qemu-run-err.txt) - this is expected in some CI environments if system libs are missing. Proceeding (warn-only)." || true
            cat /tmp/qemu-run-err.txt || true
            if [ "${STRICT_ARTIFACT_CHECKS}" = "true" ]; then
              echo "Note: qemu run failed but STRICT_ARTIFACT_CHECKS set; still continuing to avoid blowing up CI. If you want to fail, change script behavior." || true
            fi
          fi

  # ------------------------------------------------------------------
  # Publish Release - gathers and uploads artifacts to GitHub Release
  # This job depends on all builds above
  # ------------------------------------------------------------------
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux, build-linux-aarch64, package-macos-universal]
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: List downloaded artifacts
        run: |
          set -ex
          ls -la downloaded-artifacts || true

      - name: Verify checksums of downloaded artifacts
        run: |
          set -ex
          cd downloaded-artifacts
          # Recursively verify all .sha256 files using sha256sum or shasum
          find . -type f -name '*.sha256' -print0 | while IFS= read -r -d '' f; do
            d=$(dirname "$f")
            bn=$(basename "$f")
            pushd "$d"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "$bn" || (echo "Checksum mismatch for $f" && exit 1)
            else
              shasum -a 256 -c "$bn" || (echo "Checksum mismatch for $f" && exit 1)
            fi
            popd
          done
          # Create a combined SHA256SUMS file at repository root
          find . -type f -name '*.sha256' -exec cat {} \; > ../downloaded-artifacts-SHA256SUMS || true

      - name: Sign SHA256SUMS with GPG (if configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -ex
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret configured; skipping signing" && exit 0
          fi
          # Create a GNUPG home to avoid interacting with system keys
          export GNUPGHOME=$(mktemp -d)
          echo "Importing GPG private key into temporary GNUPG home"
          echo "$GPG_PRIVATE_KEY" > private.key
          gpg --batch --import private.key
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "Failed to locate GPG key ID after import" && exit 1
          fi
          echo "Signing downloaded-artifacts-SHA256SUMS with GPG key $KEYID"
          # Use loopback pinentry to pass passphrase non-interactively
          if [ -n "$GPG_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --default-key "$KEYID" --armor --detach-sign downloaded-artifacts-SHA256SUMS -o downloaded-artifacts-SHA256SUMS.sig || true
          else
            # If no passphrase, try signing without pinentry
            gpg --batch --yes --default-key "$KEYID" --armor --detach-sign downloaded-artifacts-SHA256SUMS -o downloaded-artifacts-SHA256SUMS.sig || true
          fi
          ls -la downloaded-artifacts-SHA256SUMS* || true
          # Cleanup sensitive data
          shred -u private.key || rm -f private.key || true
          rm -rf "$GNUPGHOME" || true

      - name: Create or update GitHub Release and upload assets
        id: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            downloaded-artifacts/**
            downloaded-artifacts-SHA256SUMS
            downloaded-artifacts-SHA256SUMS.sig
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Smoke test: download artifacts and run a minimal check
  # ------------------------------------------------------------------
  smoke-test:
    name: Smoke Test Artifacts
    needs: publish-release
    strategy:
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-latest
            artifact_suffix: linux-x86_64
          - platform: mac
            runs_on: macos-latest
            artifact_suffix: macos-universal
          - platform: windows
            runs_on: windows-latest
            artifact_suffix: windows-x86_64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact for smoke-test
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.artifact_suffix }}-${{ github.run_id }}
          path: ./artifact

      - name: Extract and test Linux artifact
        if: matrix.platform == 'linux'
        run: |
          set -ex
          mkdir -p extracted
          cd extracted
          ART=$(ls ../artifact 2>/dev/null | head -n1 || true)
          if [ -z "$ART" ]; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "No artifact downloaded; skipping (warn-only)" && exit 0
            else
              echo "No artifact downloaded; failing" && exit 1
            fi
          fi
          tar -xzf ../artifact/$ART || true
          cd x86_64 || true
          # Prefer the wrapper
          if [ -x ./Dvx3-Run.sh ]; then
            ./Dvx3-Run.sh --version || (echo "Dvx3-Run.sh failed or does not support --version" && exit 1)
          elif [ -x ./backup-manager-gui ]; then
            ./backup-manager-gui --version || (echo "backup-manager-gui failed to run" && exit 1)
          else
            echo "No executable found to test in Linux artifact" && exit 1
          fi

      - name: Extract and test macOS artifact
        if: matrix.platform == 'mac'
        run: |
          set -ex
          mkdir -p extracted
          cd extracted
          ART=$(ls ../artifact 2>/dev/null | head -n1 || true)
          if [ -z "$ART" ]; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "No artifact downloaded; skipping (warn-only)" && exit 0
            else
              echo "No artifact downloaded; failing" && exit 1
            fi
          fi
          tar -xzf ../artifact/$ART || true
          # If there's an .app, run its executable
          if ls *.app 1>/dev/null 2>&1; then
            APP=$(ls -d *.app | head -n1)
            BIN=$(ls "$APP"/Contents/MacOS | head -n1)
            chmod +x "$APP"/Contents/MacOS/$BIN || true
            "$APP"/Contents/MacOS/$BIN --version || true
          elif [ -x ./Dvx3-Run.sh ]; then
            ./Dvx3-Run.sh --version || true
          elif [ -x ./backup-manager-gui ]; then
            ./backup-manager-gui --version || true
          else
            echo "No executable found in mac artifact to smoke-test" && exit 1
          fi

      - name: Extract and test Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Path extracted | Out-Null
          Set-Location extracted
          $artifact = (Get-ChildItem -Path ../artifact | Select-Object -First 1).Name
          if (-not $artifact) { Write-Error 'No artifact downloaded; exiting'; exit 1 }
          if ($artifact -like '*.zip') { Expand-Archive -Path ../artifact/$artifact -DestinationPath . -Force }
          $exe = Get-ChildItem -Path . -Recurse -Filter 'backup-manager-gui.exe' | Select-Object -First 1
          if ($exe) { & $exe.FullName --version; exit $LASTEXITCODE }
          else { Write-Error 'No executable found in Windows artifact to smoke-test'; exit 1 }

  # ------------------------------------------------------------------
  # Wine-based Windows smoke test on Linux
  # ------------------------------------------------------------------
  smoke-test-wine:
    name: Smoke Test Windows artifact with Wine (Linux)
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wine and unzip
        run: |
          set -ex
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update || true
          sudo apt-get install -y wine64 wine32 unzip || true

      - name: Download Windows artifact for wine test
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-x86_64-${{ github.run_id }}
          path: ./artifact

      - name: Extract zip
        run: |
          set -ex
          mkdir -p extracted
          if ls ./artifact/*.zip 1>/dev/null 2>&1; then
            unzip -o ./artifact/*.zip -d extracted || true
          else
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "No Windows artifact found for wine test; skipping (warn-only)" && exit 0
            else
              echo "No Windows artifact found for wine test; failing" && exit 1
            fi
          fi

      - name: Run Windows exe under wine
        run: |
          set -ex
          cd extracted || true
          EXE=$(find . -maxdepth 2 -type f -iname "backup-manager-gui.exe" | head -n1 || true)
          if [ -z "$EXE" ]; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "No Windows executable found; skipping (warn-only)" && exit 0
            else
              echo "No Windows executable found" && exit 1
            fi
          fi
          # Try to run a minimal version check under wine (may require required DLLs bundled)
          wine "$EXE" --version || wine "$EXE" --help || (echo "Windows application failed under wine" && exit 1)
        # Do not set shell explicitly; let runner choose the default (bash for Linux/macOS, pwsh for Windows)

  # ------------------------------------------------------------------
  # Package macOS universal (lipo) - combines arm64 and x86_64 builds
  # ------------------------------------------------------------------
  package-macos-universal:
    name: Package macOS Universal
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-arm64-${{ github.run_id }}
          path: ./mac-arm64

      - name: Download mac artifact x86_64
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-x86_64-${{ github.run_id }}
          path: ./mac-x86_64

      - name: Extract mac artifacts
        run: |
          mkdir -p mac-arm64-extracted mac-x86_64-extracted
          tar -xzf mac-arm64/${{ env.ARTIFACT_PREFIX }}-macos-arm64-${{ github.run_id }}.tar.gz -C mac-arm64-extracted || true
          tar -xzf mac-x86_64/${{ env.ARTIFACT_PREFIX }}-macos-x86_64-${{ github.run_id }}.tar.gz -C mac-x86_64-extracted || true

      - name: Create universal app or binary using lipo
        run: |
          set -ex
          mkdir -p "$GITHUB_WORKSPACE/$RELEASE_DIR/mac/universal"
          # Prefer .app bundles if present
          if [ -d mac-arm64-extracted/*.app ] || [ -d mac-arm64-extracted/*/*.app ] || [ -d mac-x86_64-extracted/*.app ]; then
            # Find the app bundle in each folder
            APP_ARM=$(find mac-arm64-extracted -maxdepth 2 -type d -name '*.app' | head -n1)
            APP_X86=$(find mac-x86_64-extracted -maxdepth 2 -type d -name '*.app' | head -n1)
            if [ -n "$APP_ARM" ] && [ -n "$APP_X86" ]; then
              APP_NAME=$(basename "$APP_ARM")
              echo "Found app bundles: $APP_ARM and $APP_X86"
              cp -r "$APP_ARM" "$RELEASE_DIR/mac/universal/$APP_NAME" || true
              # Combine Mach-O executables in Contents/MacOS
              BIN_ARM="$APP_ARM/Contents/MacOS/$(ls $APP_ARM/Contents/MacOS | head -n1)"
              BIN_X86="$APP_X86/Contents/MacOS/$(ls $APP_X86/Contents/MacOS | head -n1)"
              OUT_BIN="$RELEASE_DIR/mac/universal/$APP_NAME/Contents/MacOS/$(basename $BIN_ARM)"
              lipo -create -output "$OUT_BIN" "$BIN_ARM" "$BIN_X86" || true
            fi
          else
            # Fallback: unify single binary
            BIN_ARM=$(find mac-arm64-extracted -maxdepth 2 -type f -name backup-manager-gui | head -n1)
            BIN_X86=$(find mac-x86_64-extracted -maxdepth 2 -type f -name backup-manager-gui | head -n1)
            if [ -n "$BIN_ARM" ] && [ -n "$BIN_X86" ]; then
              OUT_BIN="$RELEASE_DIR/mac/universal/backup-manager-gui"
              mkdir -p $(dirname "$OUT_BIN")
              lipo -create -output "$OUT_BIN" "$BIN_ARM" "$BIN_X86" || true
              # Copy libs (arm and x86) into lib and choose to keep arm libs for now but note; packaging with lipo for dylibs is also possible
            else
              echo "No binary found to create a universal binary" && exit 1
            fi
          fi

      - name: macdeployqt and create DMG
        run: |
          set -ex
          if [ -d "$RELEASE_DIR/mac/universal" ]; then
            # Run macdeployqt on any found app
            if [ -d "$RELEASE_DIR/mac/universal" ] && ls $RELEASE_DIR/mac/universal/*.app 1>/dev/null 2>&1; then
              for p in $RELEASE_DIR/mac/universal/*.app; do
                if command -v macdeployqt >/dev/null 2>&1; then
                  macdeployqt "$p" || true
                fi
              done
              # Create DMG using create-dmg if present
              if command -v create-dmg >/dev/null 2>&1; then
                create-dmg --overwrite --out "$RELEASE_DIR/mac/universal" $RELEASE_DIR/mac/universal/*.app || true
              fi
            fi
          fi

      - name: Create mac universal artifact
        run: |
          set -ex
          cd $RELEASE_DIR/mac/universal || true
          # Fallback: copy anything from build/Releases into the universal package directory
          if [ -d build/Releases ]; then
            echo "Copying build/Releases contents to $RELEASE_DIR/mac/universal"
            cp -r build/Releases/* $RELEASE_DIR/mac/universal/ 2>/dev/null || true
          fi
          tar -czf ../../${ARTIFACT_PREFIX}-macos-universal-${{ github.run_id }}.tar.gz . || true
          cd -

      - name: Verify mac universal artifact contents
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-universal-${{ github.run_id }}.tar.gz
          echo "Listing tar contents for $ART"
          tar -tzf "$ART" | sed -n '1,200p' > tar_contents.txt || true
          greps='\\.app/|backup-manager-gui|lib/|libsodium|libb2|libdvx3|Contents/Plugins|Contents/Frameworks|plugins/platforms'
          if ! grep -E "$greps" tar_contents.txt > /dev/null; then
            if [ "${STRICT_ARTIFACT_CHECKS}" = "false" ]; then
              echo "⚠ Expected files not found in mac universal artifact (warn-only): $greps" || true
            else
              echo "⚠ Expected files not found in mac universal artifact: $greps" && exit 1
            fi
          fi

      - name: Compute mac universal artifact sha256
        run: |
          set -ex
          ART=${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-universal-${{ github.run_id }}.tar.gz
          DIR=$(dirname "$ART")
          BASE=$(basename "$ART")
          pushd "$DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BASE" > "$BASE".sha256
          else
            shasum -a 256 "$BASE" > "$BASE".sha256
          fi
          popd

      - name: Upload mac universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-universal-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-universal-${{ github.run_id }}.tar.gz
            ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_PREFIX }}-macos-universal-${{ github.run_id }}.tar.gz.sha256
