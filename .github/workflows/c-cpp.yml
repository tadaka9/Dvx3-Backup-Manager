name: C/C++ CI

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VERSION: "1.0.0"

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac gcc g++ make cmake pkg-config \
            libglib2.0-dev libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-base-dev-tools \
            tar zstd file wget

      - name: Build application (use local build scripts if present)
        run: |
          chmod +x build_gui.sh build-appimage.sh build-raspberry.sh || true
          if [ -x ./build_gui.sh ]; then
            bash ./build_gui.sh
          else
            echo "No build_gui.sh found - please provide build steps or add build_gui.sh"
            exit 1
          fi

      - name: Download AppImageTool (if needed)
        if: always()
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool-x86_64.AppImage || true
          chmod +x appimagetool-x86_64.AppImage || true

      - name: Create AppImage (if build script didn't already)
        if: always()
        run: |
          if [ -x ./build-appimage.sh ]; then
            chmod +x ./build-appimage.sh
            bash ./build-appimage.sh
          else
            echo "No build-appimage.sh present, skipping AppImage step"
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWave-Linux-x86_64-AppImage
          path: |
            '*.AppImage'
            'dist/**/*.AppImage'
          retention-days: 90

  build-macos-universal:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update || true
          brew install vala glib json-glib libsodium qt@6 cmake pkg-config create-dmg || true
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          export PKG_CONFIG_PATH="$(brew --prefix qt@6)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

      - name: Build application (use local build scripts if present)
        run: |
          chmod +x build_gui.sh build-appimage.sh build-raspberry.sh || true
          if [ -x ./build_gui.sh ]; then
            bash ./build_gui.sh
          else
            echo "No build_gui.sh found - attempting a minimal macOS build (may fail)"
            # Minimal attempt (user should supply build scripts)
            if [ -f libdvx3.vala ]; then
              valac --pkg glib-2.0 --pkg gio-unix-2.0 --pkg json-glib-1.0 --pkg posix \
                --vapidir=vala-extra-vapis --pkg libsodium \
                libdvx3.vala -C -d gen-c
            else
              echo "No known entry point found; please provide build_gui.sh or adjust workflow."
            fi
          fi

      - name: Package .app and create DMG (if applicable)
        run: |
          # If a .app bundle exists, try to ensure Qt libraries are bundled and create a DMG.
          APP_BUNDLE=$(ls -d *.app 2>/dev/null | head -n1 || true)
          if [ -n "$APP_BUNDLE" ]; then
            MACDEPLOYQT="$(brew --prefix qt@6)/bin/macdeployqt"
            if [ -x "$MACDEPLOYQT" ]; then
              "$MACDEPLOYQT" "$APP_BUNDLE" || true
            fi
            DMG_NAME="CryptoWave-${VERSION}-macOS-Universal.dmg"
            if command -v create-dmg >/dev/null 2>&1; then
              create-dmg --volname "CryptoWave" --window-pos 200 120 --window-size 600 400 \
                --icon-size 100 --app-drop-link 425 120 "$DMG_NAME" "$APP_BUNDLE" || true
            else
              hdiutil create -volname "CryptoWave" -srcfolder "$APP_BUNDLE" -ov -format UDZO "$DMG_NAME" || true
            fi
          else
            echo "No .app found; skipping macOS packaging"
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWave-macOS-Universal
          path: |
            '*.dmg'
            'dist/**/*.dmg'
          retention-days: 90

  build-windows-x64:
    name: Windows x64 (Cross-compile placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 \
            wine64 valac pkg-config || true

      - name: Download/prepare Windows dependencies (placeholder)
        run: |
          mkdir -p /tmp/win-deps
          echo "TODO: Download/build glib, json-glib, libsodium, Qt6 for Windows or use native Windows CI (MSYS2)." > /tmp/win-deps/README.txt

      - name: Windows build info
        run: |
          mkdir -p windows-build
          cat > windows-build/README.txt <<'EOF'
          Windows Build Instructions
          ===========================
          This CI uses an Ubuntu runner and cannot produce a full native Windows installer.
          For Windows builds, use a native Windows runner or MSYS2 with Qt6/GLib/libsodium packages.
          EOF
          echo "Windows placeholder created"

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWave-Windows-x64-BuildInfo
          path: windows-build/
          retention-days: 30

  build-arm32-debian13:
    name: ARM32 Debian 13 (arm/v7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in ARM container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie bash -c '
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools tar zstd file || true
              chmod +x build_gui.sh build-raspberry.sh || true
              if [ -x ./build_gui.sh ]; then
                bash ./build_gui.sh
              fi
              if [ -x ./build-raspberry.sh ]; then
                bash ./build-raspberry.sh
              fi
              ls -lh *.tar.gz || echo "No tarball found"
            '

      - name: Upload ARMv7 package
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWave-RaspberryPi-ARMv7
          path: |
            '*.tar.gz'
            'dist/**/*.tar.gz'
          retention-days: 90

  build-arm64-debian13:
    name: ARM64 Debian 13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie bash -c '
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools tar zstd file || true
              chmod +x build_gui.sh build-raspberry.sh || true
              if [ -x ./build_gui.sh ]; then
                bash ./build_gui.sh
              fi
              if [ -x ./build-raspberry.sh ]; then
                bash ./build-raspberry.sh
              fi
              ls -lh *.tar.gz || echo "No tarball found"
            '

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWave-RaspberryPi-ARM64
          path: |
            '*.tar.gz'
            'dist/**/*.tar.gz'
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-macos-universal, build-arm32-debian13, build-arm64-debian13]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure
        run: ls -R artifacts/ || true

      - name: Generate checksums
        run: |
          cd artifacts || exit 0
          # Only include known artifact types
          find . -type f \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.exe" \) -print0 | \
            xargs -0 -I {} sh -c 'sha256sum "$1" >> CHECKSUMS.txt' -- {}
          echo "Generated checksums:" && cat CHECKSUMS.txt || true

      - name: Create Release and upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/CHECKSUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
