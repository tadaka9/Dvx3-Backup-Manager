name: C/C++ CI

on:
  push:
    branches: [main, master, develop, clean-version]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, develop, clean-version]
  workflow_dispatch:

env:
  VERSION: "0.0.3a101125"

jobs:
  build-linux:
    name: Linux ${{ matrix.os }} x86_64
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-${{ runner.os }}-${{ hashFiles('**/packages.lock') }}
          restore-keys: apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac gcc g++ make cmake pkg-config \
            libglib2.0-dev libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            tar zstd file wget

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Check GNU tar version
        run: |
          tar --version
          if ! tar --version | grep -q "GNU tar"; then
            echo "Error: GNU tar is required"
            exit 1
          fi

      - name: Build application
        run: |
          chmod +x build.sh build_gui.sh build-appimage.sh build-raspberry.sh || true
          bash ./build.sh
          bash ./build_gui.sh

      - name: Download AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: bash ./build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-Linux-${{ matrix.os }}-x86_64-AppImage
          path: '*.AppImage'
          retention-days: 90

  build-macos-universal:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: homebrew-${{ runner.os }}-

      - name: Install dependencies
        run: |
          brew install vala glib json-glib libsodium qt@6 cmake pkg-config create-dmg
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build x86_64
        run: |
          mkdir -p x86_64
          arch -x86_64 bash -c "
            bash ./build.sh
            bash ./build_gui.sh
            cp -r 'Dvx3 Backup Manager.app' x86_64/
          "

      - name: Build arm64 (native)
        run: |
          mkdir -p arm64
          bash ./build.sh
          bash ./build_gui.sh
          cp -r 'Dvx3 Backup Manager.app' arm64/

      - name: Create Universal Binary
        run: |
          cp -r arm64/"Dvx3 Backup Manager.app" .
          
          # Merge main executable
          lipo -create -output "Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui" \
            x86_64/"Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui" \
            arm64/"Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui"
          
          # Merge library
          lipo -create -output "Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib" \
            x86_64/"Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib" \
            arm64/"Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib"
          
          # Deploy Qt frameworks for universal binary
          $(brew --prefix qt@6)/bin/macdeployqt "Dvx3 Backup Manager.app" -verbose=2

          # Verify
          lipo -info "Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui"
          lipo -info "Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Dvx3 Backup Manager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Dvx3-BackupManager-macOS-Universal.dmg" \
            "Dvx3 Backup Manager.app" || true

          if [ ! -f "Dvx3-BackupManager-macOS-Universal.dmg" ]; then
            hdiutil create -volname "Dvx3 Backup Manager" \
              -srcfolder "Dvx3 Backup Manager.app" \
              -ov -format UDZO "Dvx3-BackupManager-macOS-Universal.dmg"
          fi

      - name: Upload Universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-macOS-Universal
          path: '*.dmg'
          retention-days: 90

  build-windows:
    name: Windows x64 (UCRT64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            zip curl

      - name: Verify VAPI
        shell: msys2 {0}
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build library and CLI
        shell: msys2 {0}
        run: bash ./build.sh

      - name: Build Qt GUI
        shell: msys2 {0}
        run: bash ./build_gui.sh

      - name: Package with windeployqt
        shell: msys2 {0}
        run: |
          mkdir -p windows-package
          cp dvx3.exe backup-manager-gui.exe libDvx3.dll dvx3.vapi dvx3.h windows-package/ || true
          
          # Use windeployqt for complete Qt deployment
          /ucrt64/bin/qt6/bin/windeployqt.exe \
            --release \
            --dir-path windows-package \
            windows-package/backup-manager-gui.exe
          
          # Copy additional runtime DLLs
          cp /ucrt64/bin/*.dll windows-package/ || true
          
          zip -r Dvx3-BackupManager-Windows-x64.zip windows-package/*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-Windows-x64
          path: Dvx3-BackupManager-Windows-x64.zip
          retention-days: 90

  build-raspberry-arm:
    name: Raspberry Pi (ARM32/64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/arm/v7, linux/arm64]
        suffix: [ARMv7, ARM64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ matrix.platform }}-${{ hashFiles('**/Dockerfile') }}

      - name: Build in ARM container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            --mount type=cache,target=/var/cache/apt \
            debian:bookworm bash -c '
            set -e
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
              valac gcc g++ make cmake pkg-config git \
              libglib2.0-dev libjson-glib-dev libsodium-dev \
              qt6-base-dev qt6-base-dev-tools qt6-tools-dev tar zstd file
            
            # Ensure VAPI is available
            ls -la vala-extra-vapis/libsodium.vapi || echo "VAPI missing, skipping check"
            
            chmod +x build.sh build_gui.sh build-raspberry.sh || true
            bash ./build.sh && bash ./build_gui.sh && bash ./build-raspberry.sh
            
            ls -lh *.tar.gz || echo "No tarball generated"
          '

      - name: Upload ARM package
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-RaspberryPi-${{ matrix.suffix }}
          path: '*.tar.gz'
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos-universal, build-windows, build-raspberry-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) \
            -exec sha256sum {} \; > CHECKSUMS.txt
          echo "Generated checksums:" && cat CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/CHECKSUMS.txt
          draft: false
          prerelease: contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
