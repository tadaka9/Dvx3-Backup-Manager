## GitHub Actions CI/CD

Create `.github/workflows/build.yml`:
```yaml
name: Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: debian-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valac libglib2.0-dev libjson-glib-dev \
            libsodium-dev qt6-base-dev
      - name: Build
        run: ./build_gui.sh
      - name: Create AppImage
        run: ./build-appimage.sh
      - uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: '*.AppImage'

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: brew install vala glib json-glib libsodium qt@6
      - name: Build
        run: ./build-macos.sh
      - uses: actions/upload-artifact@v3
        with:
          name: macos-dmg
          path: '*.dmg'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-vala
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-qt6
      - name: Build
        shell: msys2 {0}
        run: ./build_gui.sh
      - uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: '*.exe'

  build-raspberry:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [armhf, arm64]
    steps:
      - uses: actions/checkout@v3
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
      - name: Build for ${{ matrix.arch }}
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v $(pwd):/build debian:bullseye \
            /bin/bash -c "cd /build && ./build-raspberry.sh"
      - uses: actions/upload-artifact@v3
        with:
          name: raspberry-${{ matrix.arch }}
          path: '*.tar.gz'
```

