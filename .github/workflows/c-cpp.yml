name: C/C++ CI

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VERSION: "0.0.3a101125"

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac gcc g++ make cmake pkg-config \
            libglib2.0-dev libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            tar zstd file wget

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build application
        run: |
          chmod +x build_gui.sh build-appimage.sh build-raspberry.sh || true
          bash ./build_gui.sh

      - name: Download AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: bash ./build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-Linux-x86_64-AppImage
          path: '*.AppImage'
          retention-days: 90

  build-macos-universal:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      

      - name: Install dependencies
        run: |
          brew install vala glib json-glib libsodium qt@6 cmake pkg-config create-dmg
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build for Intel (x86_64)
        run: |
          valac --pkg glib-2.0 --pkg gio-2.0 --pkg gio-unix-2.0 --pkg json-glib-1.0 --pkg posix \
            --vapidir=vala-extra-vapis --pkg libsodium \
            libdvx3.vala -C -d gen-c-x86_64

          gcc -c -fPIC gen-c-x86_64/libdvx3.c -o libdvx3-x86_64.o \
            $(pkg-config --cflags glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -arch x86_64

          gcc -dynamiclib -o libdvx3-x86_64.dylib libdvx3-x86_64.o \
            $(pkg-config --libs glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -arch x86_64

      - name: Build for Apple Silicon (arm64)
        run: |
          valac --pkg glib-2.0 --pkg gio-2.0 --pkg gio-unix-2.0 --pkg json-glib-1.0 --pkg posix \
            --vapidir=vala-extra-vapis --pkg libsodium \
            libdvx3.vala -C -d gen-c-arm64

          gcc -c -fPIC gen-c-arm64/libdvx3.c -o libdvx3-arm64.o \
            $(pkg-config --cflags glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -arch arm64

          gcc -dynamiclib -o libdvx3-arm64.dylib libdvx3-arm64.o \
            $(pkg-config --libs glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -arch arm64

      - name: Create Universal Binary
        run: lipo -create libdvx3-x86_64.dylib libdvx3-arm64.dylib -output libdvx3.dylib

      - name: Build Qt GUI
        run: |
          $(brew --prefix qt@6)/bin/moc backup-manager-gui.hpp -o backup-manager-gui.moc.cpp
          # Compile resources (icon)
          if [ -f resources.qrc ]; then
            $(brew --prefix qt@6)/bin/rcc resources.qrc -o resources.rcc.cpp
          fi

          g++ -fPIC backup-manager-gui.cpp backup-manager-gui.moc.cpp resources.rcc.cpp \
            -o backup-manager-gui \
            -std=c++17 \
            $(pkg-config --cflags --libs Qt6Widgets glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -L. -ldvx3 -Wl,-rpath,@executable_path

      - name: Create App Bundle
        run: |
          mkdir -p "DVX3 Backup Manager.app/Contents/MacOS" "DVX3 Backup Manager.app/Contents/Resources" "DVX3 Backup Manager.app/Contents/Frameworks"

          cp backup-manager-gui "DVX3 Backup Manager.app/Contents/MacOS/"
          cp libdvx3.dylib "DVX3 Backup Manager.app/Contents/Frameworks/"

          cat > "DVX3 Backup Manager.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>backup-manager-gui</string>
              <key>CFBundleIdentifier</key>
              <string>com.dvx3.backupmanager</string>
              <key>CFBundleName</key>
              <string>DVX3 Backup Manager</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          $(brew --prefix qt@6)/bin/macdeployqt "DVX3 Backup Manager.app" -verbose=2

      - name: Create DMG
        run: |
          create-dmg \
            --volname "DVX3 Backup Manager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "DVX3-BackupManager-${VERSION}-macOS-Universal.dmg" \
            "DVX3 Backup Manager.app" || true

          if [ ! -f "DVX3-BackupManager-${VERSION}-macOS-Universal.dmg" ]; then
            hdiutil create -volname "DVX3 Backup Manager" \
              -srcfolder "DVX3 Backup Manager.app" \
              -ov -format UDZO "DVX3-BackupManager-${VERSION}-macOS-Universal.dmg"
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-macOS-Universal
          path: '*.dmg'
          retention-days: 90

  build-windows-msys2:
    name: Windows x64 (MSYS2)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-vala
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            curl
            zip

      - name: Verify VAPI
        shell: msys2 {0}
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build library and CLI
        shell: msys2 {0}
        run: bash ./build.sh

      - name: Build Qt GUI (Windows)
        shell: msys2 {0}
        run: |
          set -e
          moc backup-manager-gui.hpp -o backup-manager-gui.moc.cpp
          if [ -f resources.qrc ]; then
            rcc resources.qrc -o resources.rcc.cpp
          fi
          g++ backup-manager-gui.cpp backup-manager-gui.moc.cpp resources.rcc.cpp \
            -o backup-manager-gui.exe \
            -std=c++17 \
            $(pkg-config --cflags --libs Qt6Widgets glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -L. -ldvx3
          ls -lh *.exe *.dll || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-Windows-x64
          path: |
            dvx3.exe
            backup-manager-gui.exe
            libdvx3.dll
            dvx3.vapi
            dvx3.h
          retention-days: 90

  build-arm32-debian13:
    name: ARM32 Debian 13 (arm/v7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in ARM container
        run: |
          # Ensure libsodium.vapi is present on host (mounted into container)
          set -e
          ls -la vala-extra-vapis/libsodium.vapi || true
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie bash -c '
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config git \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools qt6-tools-dev tar zstd file && \
              echo "Verifying VAPI in container..." && \
              ls -la vala-extra-vapis/libsodium.vapi && \
              chmod +x build_gui.sh build-raspberry.sh || true && \
              bash ./build_gui.sh && bash ./build-raspberry.sh && ls -lh *.tar.gz || echo "No tarball found"
            '

      - name: Upload ARMv7 package
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-RaspberryPi-ARMv7
          path: '*.tar.gz'
          retention-days: 90

  build-arm64-debian13:
    name: ARM64 Debian 13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          # Ensure libsodium.vapi is present on host (mounted into container)
          set -e
          ls -la vala-extra-vapis/libsodium.vapi || true
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie bash -c '
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config git \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools qt6-tools-dev tar zstd file && \
              echo "Verifying VAPI in container..." && \
              ls -la vala-extra-vapis/libsodium.vapi && \
              chmod +x build_gui.sh build-raspberry.sh || true && \
              bash ./build_gui.sh && bash ./build-raspberry.sh && ls -lh *.tar.gz || echo "No tarball found"
            '

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-RaspberryPi-ARM64
          path: '*.tar.gz'
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-macos-universal, build-arm32-debian13, build-arm64-debian13, build-windows-msys2]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.exe" \) -print0 | \
            xargs -0 -I {} sh -c 'sha256sum "$1" >> CHECKSUMS.txt' -- {}
          echo "Generated checksums:" && cat CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/CHECKSUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
