name: Cross-Platform Build & Release

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ===========================================================================
  # JOB 1: Desktop Builds (Linux x64, macOS, Windows)
  # ===========================================================================
  desktop-build:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # --- LINUX ---
      - name: Install Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valac libglib2.0-dev libjson-glib-dev libsodium-dev zstd \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev libfuse2
          sudo mkdir -p /usr/lib/qt6/bin
          for tool in qmake moc rcc uic lrelease; do
            if [ -x "/usr/bin/${tool}6" ]; then sudo ln -sf "/usr/bin/${tool}6" "/usr/lib/qt6/bin/${tool}"; fi
          done

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          
          echo "=== Building Core & GUI ==="
          bash ./build.sh
          bash ./build_gui.sh
          
          echo "=== Packaging AppImage ==="
          # FIX: Check for both naming conventions
          if [ -f "build_appimage.sh" ]; then
            chmod +x build_appimage.sh && ./build_appimage.sh
          elif [ -f "build-appimage.sh" ]; then
            chmod +x build-appimage.sh && ./build-appimage.sh
          else
            echo "::error::AppImage script not found! Listing files:"
            ls -la
            exit 1
          fi

      # --- MACOS ---
      - name: Install macOS Deps
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install qt@6 vala glib json-glib libsodium cmake pkg-config create-dmg
          echo "QT_PREFIX=$(brew --prefix qt@6)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          bash ./build.sh
          bash ./build_gui.sh
          if [ -f "build_macos.sh" ]; then 
            chmod +x build_macos.sh && ./build_macos.sh
          elif [ -f "build-macos.sh" ]; then
            chmod +x build-macos.sh && ./build-macos.sh
          fi

      # --- WINDOWS ---
      - name: Setup Windows (MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-json-glib mingw-w64-x86_64-libsodium mingw-w64-x86_64-vala
            mingw-w64-x86_64-libzip

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/share/qt6/bin:/mingw64/bin:$PATH"
          if [ -f "/mingw64/share/qt6/bin/moc.exe" ] && [ ! -f "/mingw64/bin/moc" ]; then
            cp "/mingw64/share/qt6/bin/moc.exe" "/mingw64/bin/moc"
          fi
          bash ./build.sh
          bash ./build_gui.sh

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            ./*.AppImage
            ./*.dmg
            ./*.exe
            ./*.dll
            ./build/*.exe
            ./build/*.dll
          if-no-files-found: warn

  # ===========================================================================
  # JOB 2: Raspberry Pi Builds
  # ===========================================================================
  rpi-build:
    name: Build RPi (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
            image: arm32v7/debian:bookworm
          - arch: aarch64
            platform: linux/arm64
            image: arm64v8/debian:bookworm

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build in Docker
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ${{ matrix.image }} \
            /bin/bash -c "
              apt-get update && \
              apt-get install -y build-essential valac libglib2.0-dev libjson-glib-dev \
              libsodium-dev zstd qt6-base-dev qt6-base-dev-tools qt6-tools-dev && \
              ./build.sh && \
              ./build_gui.sh && \
              tar -czvf Dvx3-BackupManager-RPi-${{ matrix.arch }}.tar.gz \
                  backup-manager-gui libdvx3.so dvx3-backup.png
            "
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-artifacts-${{ matrix.arch }}
          path: ./*.tar.gz

  # ===========================================================================
  # JOB 3: Docker Image Build
  # ===========================================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase Repo Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.ref_name }}

  # ===========================================================================
  # JOB 4: Create Release
  # ===========================================================================
  release:
    name: Create Release
    needs: [desktop-build, rpi-build, docker-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/**/*.AppImage
            ./artifacts/**/*.dmg
            ./artifacts/**/*.exe
            ./artifacts/**/*.dll
            ./artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}