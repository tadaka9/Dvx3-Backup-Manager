name: C/C++ CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERSION: "1.0.0"

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac gcc g++ make cmake pkg-config \
            libglib2.0-dev libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-base-dev-tools \
            tar zstd file wget
          
      - name: Build application
        run: |
          chmod +x build_gui.sh build-appimage.sh build-raspberry.sh || true
          bash ./build_gui.sh
          
      - name: Download AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
      - name: Create AppImage
        run: |
          bash ./build-appimage.sh
          
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-Linux-x86_64-AppImage
          path: '*.AppImage'
          retention-days: 90

  build-macos-universal:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install vala glib json-glib libsodium qt@6 cmake pkg-config create-dmg
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          
      - name: Build for Intel (x86_64)
        run: |
          valac --pkg glib-2.0 --pkg gio-unix-2.0 --pkg json-glib-1.0 --pkg posix \
            --vapidir=vala-extra-vapis --pkg libsodium \
            libdvx3.vala -C -d gen-c-x86_64
          
          gcc -c -fPIC gen-c-x86_64/libdvx3.c -o libdvx3-x86_64.o \
            $(pkg-config --cflags glib-2.0 gio-unix-2.0 json-glib-1.0 libsodium) \
            -arch x86_64
          
          gcc -shared -o libdvx3-x86_64.dylib libdvx3-x86_64.o \
            $(pkg-config --libs glib-2.0 gio-unix-2.0 json-glib-1.0 libsodium) \
            -arch x86_64
            
      - name: Build for Apple Silicon (arm64)
        run: |
          valac --pkg glib-2.0 --pkg gio-unix-2.0 --pkg json-glib-1.0 --pkg posix \
            --vapidir=vala-extra-vapis --pkg libsodium \
            libdvx3.vala -C -d gen-c-arm64
          
          gcc -c -fPIC gen-c-arm64/libdvx3.c -o libdvx3-arm64.o \
            $(pkg-config --cflags glib-2.0 gio-unix-2.0 json-glib-1.0 libsodium) \
            -arch arm64
          
          gcc -shared -o libdvx3-arm64.dylib libdvx3-arm64.o \
            $(pkg-config --libs glib-2.0 gio-unix-2.0 json-glib-1.0 libsodium) \
            -arch arm64
            
      - name: Create Universal Binary
        run: |
          lipo -create libdvx3-x86_64.dylib libdvx3-arm64.dylib -output libdvx3.dylib
          
      - name: Build Qt GUI
        run: |
          $(brew --prefix qt@6)/bin/moc backup-manager-gui.hpp -o backup-manager-gui.moc.cpp
          
          g++ -fPIC backup-manager-gui.cpp backup-manager-gui.moc.cpp \
            -o backup-manager-gui \
            -std=c++17 \
            $(pkg-config --cflags --libs Qt6Widgets glib-2.0 gio-unix-2.0 json-glib-1.0 libsodium) \
            -L. -ldvx3 -Wl,-rpath,@executable_path
          
      - name: Create App Bundle
        run: |
          mkdir -p "DVX3 Backup Manager.app/Contents/MacOS"
          mkdir -p "DVX3 Backup Manager.app/Contents/Resources"
          mkdir -p "DVX3 Backup Manager.app/Contents/Frameworks"
          
          cp backup-manager-gui "DVX3 Backup Manager.app/Contents/MacOS/"
          cp libdvx3.dylib "DVX3 Backup Manager.app/Contents/Frameworks/"
          
          cat > "DVX3 Backup Manager.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>backup-manager-gui</string>
              <key>CFBundleIdentifier</key>
              <string>com.dvx3.backupmanager</string>
              <key>CFBundleName</key>
              <string>DVX3 Backup Manager</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          $(brew --prefix qt@6)/bin/macdeployqt "DVX3 Backup Manager.app" -verbose=2
          
      - name: Create DMG
        run: |
          create-dmg \
            --volname "DVX3 Backup Manager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "DVX3-BackupManager-${VERSION}-macOS-Universal.dmg" \
            "DVX3 Backup Manager.app" || true
          
          # Fallback if create-dmg fails
          if [ ! -f "DVX3-BackupManager-${VERSION}-macOS-Universal.dmg" ]; then
            hdiutil create -volname "DVX3 Backup Manager" \
              -srcfolder "DVX3 Backup Manager.app" \
              -ov -format UDZO "DVX3-BackupManager-${VERSION}-macOS-Universal.dmg"
          fi
          
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-macOS-Universal
          path: '*.dmg'
          retention-days: 90

  build-windows-x64:
    name: Windows x64 (Cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 \
            wine64 valac pkg-config
            
      - name: Download Windows dependencies
        run: |
          # Note: In production, you'd need pre-built Windows libraries
          # This is a placeholder showing the structure
          mkdir -p /tmp/win-deps
          echo "TODO: Download/build glib, json-glib, libsodium, Qt6 for Windows"
          
      - name: Build (placeholder)
        run: |
          mkdir -p windows-build
          cat > windows-build/README.txt << 'EOF'
          Windows Build Instructions
          ===========================
          
          This platform requires native Windows build or MSYS2.
          See BUILD_MULTIPLATFORM.md for setup instructions.
          
          Required: MSYS2 with Qt6, GLib, libsodium packages.
          EOF
          echo "Windows placeholder created"
          
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-Windows-x64-BuildInfo
          path: windows-build/
          retention-days: 30

  build-arm32-debian13:
    name: ARM32 Debian 13 (arm/v7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in ARM container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c '
              set -e
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools tar zstd file && \
              chmod +x build_gui.sh build-raspberry.sh || true && \
              bash ./build_gui.sh && \
              bash ./build-raspberry.sh && \
              ls -lh *.tar.gz || echo "No tarball found"
            '
            
      - name: Upload ARMv7 package
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-RaspberryPi-ARMv7
          path: '*.tar.gz'
          retention-days: 90

  build-arm64-debian13:
    name: ARM64 Debian 13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash -c '
              set -e
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools tar zstd file && \
              chmod +x build_gui.sh build-raspberry.sh || true && \
              bash ./build_gui.sh && \
              bash ./build-raspberry.sh && \
              ls -lh *.tar.gz || echo "No tarball found"
            '
            
      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: DVX3-BackupManager-RaspberryPi-ARM64
          path: '*.tar.gz'
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-macos-universal, build-arm32-debian13, build-arm64-debian13]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          
      - name: Display structure
        run: |
          ls -R artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.exe" \) -print0 | \
            xargs -0 -I {} sh -c 'sha256sum "$1" >> CHECKSUMS.txt' -- {}
          echo "Generated checksums:" && cat CHECKSUMS.txt
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/CHECKSUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
