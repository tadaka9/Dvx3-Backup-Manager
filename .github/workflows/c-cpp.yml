name: Cross-Platform Build & Release

on:
  push:
    branches: [main, master, develop]
    tags: [ 'v*' ]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  lint-yaml:
    name: YAML Lint (lynt/Super-Linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super-Linter YAML
        uses: github/super-linter@v5
        env:
          VALIDATE_YAML: true
          VALIDATE_GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-python:
    name: Python Lint (PEP8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  desktop-build:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      # --- LINUX ---
      - name: Install Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valac libglib2.0-dev libjson-glib-dev libsodium-dev zstd qt6-base-dev qt6-base-dev-tools qt6-tools-dev libfuse2
          sudo mkdir -p /usr/lib/qt6/bin
          for tool in qmake moc rcc uic lrelease; do
            if [ -x "/usr/bin/${tool}6" ]; then sudo ln -sf "/usr/bin/${tool}6" "/usr/lib/qt6/bin/${tool}"; fi
          done
      
      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          bash ./build.sh
          bash ./build_gui.sh
          cat << 'EOF' > build_appimage.sh
          #!/bin/bash
          set -e
          APPDIR="Dvx3BackupManager.AppDir"
          rm -rf "$APPDIR" *.AppImage
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps" "$APPDIR/usr/plugins"
          cp "backup-manager-gui" "$APPDIR/usr/bin/"
          cp "libdvx3.so" "$APPDIR/usr/lib/"
          ICU_DST="$APPDIR/usr/lib"
          for src in "/usr/lib/x86_64-linux-gnu" "/usr/lib"; do
            [ -d "$src" ] && cp "$src"/libicu*.so* "$ICU_DST/" 2>/dev/null || true
          done
          QT_PLUGINS=$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || echo "/usr/lib/qt6/plugins")
          for sub in platforms styles xcbglintegrations imageformats iconengines; do
            [ -d "$QT_PLUGINS/$sub" ] && cp -r "$QT_PLUGINS/$sub" "$APPDIR/usr/plugins/"
          done
          ldd "$APPDIR/usr/bin/backup-manager-gui" | grep "=> /" | awk '{print $3}' | while read -r lib; do
            libname=$(basename "$lib")
            if [[ ! "$libname" =~ ^(libc\.so|libstdc\+\+|libgcc_s|libpthread|libdl|libm|librt|libz|ld-linux) ]]; then
              [ ! -f "$APPDIR/usr/lib/$libname" ] && cp "$lib" "$APPDIR/usr/lib/"
            fi
          done
          cat > "$APPDIR/usr/share/applications/dvx3-backup.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Dvx3 Backup Manager
          Exec=backup-manager-gui
          Icon=dvx3-backup
          Categories=Utility;
          DESKTOP
          cp "$APPDIR/usr/share/applications/dvx3-backup.desktop" "$APPDIR/"
          if [ -f "dvx3-backup.png" ]; then
            cp "dvx3-backup.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/"
            cp "dvx3-backup.png" "$APPDIR/"
          else
            touch "$APPDIR/usr/share/icons/hicolor/256x256/apps/dvx3-backup.png"
            touch "$APPDIR/dvx3-backup.png"
          fi
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins"
          exec "${HERE}/usr/bin/backup-manager-gui" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"
          wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "Dvx3-BackupManager-x86_64.AppImage"
          EOF
          chmod +x build_appimage.sh
          ./build_appimage.sh
      
      # --- MACOS ---
      - name: Install macOS Deps
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install qt@6 vala glib json-glib libsodium cmake pkg-config create-dmg
      
      - name: Build macOS Application
        if: matrix.os == 'macos-latest'
        run: |
          # Set up Qt6 paths
          QT6_PREFIX=$(brew --prefix qt@6)
          export PATH="$QT6_PREFIX/bin:$PATH"
          export PKG_CONFIG_PATH="$QT6_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export QT_MOC_NATIVE="$QT6_PREFIX/libexec/moc"
          
          echo "Qt6 installation path: $QT6_PREFIX"
          echo "Checking for Qt6 tools..."
          which moc || echo "moc not in PATH"
          ls -la "$QT6_PREFIX/bin/" || echo "Qt6 bin directory not found"
          ls -la "$QT6_PREFIX/libexec/" || echo "Qt6 libexec directory not found"
          
          # Verify moc exists
          if [ -f "$QT6_PREFIX/libexec/moc" ]; then
            echo "✓ Found moc at: $QT6_PREFIX/libexec/moc"
          elif [ -f "$QT6_PREFIX/bin/moc" ]; then
            export QT_MOC_NATIVE="$QT6_PREFIX/bin/moc"
            echo "✓ Found moc at: $QT6_PREFIX/bin/moc"
          else
            echo "ERROR: moc not found in expected locations"
            exit 1
          fi
          
          # Build the application
          echo "Building library and CLI..."
          bash ./build.sh
          
          echo "Building GUI..."
          bash ./build_gui.sh
          
          # Verify build outputs
          if [ ! -f "backup-manager-gui" ]; then
            echo "ERROR: backup-manager-gui was not created"
            ls -la
            exit 1
          fi
          
          echo "✓ Build successful"
      
      - name: Create macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          # Create app bundle structure
          APP_NAME="Dvx3 Backup Manager"
          APP_BUNDLE="$APP_NAME.app"
          
          echo "Creating macOS app bundle..."
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          
          # Copy executable and library
          cp backup-manager-gui "$APP_BUNDLE/Contents/MacOS/"
          cp libdvx3.dylib "$APP_BUNDLE/Contents/Frameworks/" || echo "Warning: libdvx3.dylib not found"
          
          # Copy icon if available
          if [ -f "dvx3-backup.png" ]; then
            cp dvx3-backup.png "$APP_BUNDLE/Contents/Resources/icon.png"
          fi
          
          # Create Info.plist
          cat > "$APP_BUNDLE/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>backup-manager-gui</string>
              <key>CFBundleIdentifier</key>
              <string>com.dvx3.backup-manager</string>
              <key>CFBundleName</key>
              <string>Dvx3 Backup Manager</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Create DMG
          echo "Creating DMG..."
          DMG_NAME="Dvx3-BackupManager-macOS.dmg"
          
          # Simple DMG creation
          hdiutil create -volname "Dvx3 Backup Manager" -srcfolder "$APP_BUNDLE" -ov -format UDZO "$DMG_NAME"
          
          if [ -f "$DMG_NAME" ]; then
            echo "✓ DMG created successfully: $DMG_NAME"
            ls -lh "$DMG_NAME"
          else
            echo "ERROR: DMG creation failed"
            exit 1
          fi
      
      # --- WINDOWS ---
      - name: Setup Windows (MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-json-glib mingw-w64-x86_64-libsodium mingw-w64-x86_64-vala
            mingw-w64-x86_64-libzip
      
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/share/qt6/bin:/mingw64/bin:$PATH"
          if [ -f "/mingw64/share/qt6/bin/moc.exe" ] && [ ! -f "/mingw64/bin/moc" ]; then
            cp "/mingw64/share/qt6/bin/moc.exe" "/mingw64/bin/moc"
          fi
          bash ./build.sh
          bash ./build_gui.sh
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            ./*.AppImage
            ./*.dmg
            ./*.exe
            ./*.dll
            ./build/*.exe
            ./build/*.dll
          if-no-files-found: warn

  rpi-build:
    name: Build RPi (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
            image: arm32v7/debian:bookworm
          - arch: aarch64
            platform: linux/arm64
            image: arm64v8/debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build in Docker
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ${{ matrix.image }} \
            /bin/bash -c "
              apt-get update && \
              apt-get install -y build-essential valac libglib2.0-dev libjson-glib-dev \
              libsodium-dev zstd qt6-base-dev qt6-base-dev-tools qt6-tools-dev && \
              ./build.sh && \
              ./build_gui.sh && \
              tar -czvf Dvx3-BackupManager-RPi-${{ matrix.arch }}.tar.gz \
                  backup-manager-gui libdvx3.so dvx3-backup.png
            "
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-artifacts-${{ matrix.arch }}
          path: ./*.tar.gz

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase Repo Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.ref_name }}

  release:
    name: Create Release
    needs: [desktop-build, rpi-build, docker-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/**/*.AppImage
            ./artifacts/**/*.dmg
            ./artifacts/**/*.exe
            ./artifacts/**/*.dll
            ./artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}