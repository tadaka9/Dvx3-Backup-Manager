name: C/C++ CI

on:
  push:
    branches: [main, master, develop, clean-version]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, develop]  # Added 'develop' to match push branches
  workflow_dispatch:

env:
  VERSION: "0.0.3a101125"

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac gcc g++ make cmake pkg-config \
            libglib2.0-dev libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            tar zstd file wget

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Check GNU tar version and assert
        run: |
          tar --version
          if ! tar --version | grep -q "GNU tar"; then
            echo "Error: GNU tar is required for dynamic progress."
            exit 1
          fi
      - name: Install FUSE2 for AppImage
        run: sudo apt-get install -y libfuse2

      - name: Build application
        run: |
          chmod +x build_gui.sh build-appimage.sh build-raspberry.sh || true
          # Add Qt6 tools to PATH for Linux
          export PATH="/usr/lib/qt6/bin:$PATH"
          bash ./build_gui.sh

      - name: Download AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Create AppImage
        run: |
          bash ./build-appimage.sh
          # Create a minimal .desktop file for linuxdeployqt (YAML-safe)
          if [ -f backup-manager-gui ]; then
            # Explicitly copy ICU libraries into AppDir/usr/lib
            mkdir -p usr/lib
            cp /usr/lib/x86_64-linux-gnu/libicu*.so.* usr/lib/ || true
            # Create symlinks for ICU libraries (e.g., libicui18n.so -> libicui18n.so.74)
            for lib in usr/lib/libicu*.so.*; do
              base=$(basename "$lib")
              soname=$(echo "$base" | sed 's/\(libicu[a-z]*\)\.so\..*/\1.so/')
              ln -sf "$base" "usr/lib/$soname"
            done
            echo '[Desktop Entry]' > backup-manager-gui.desktop
            echo 'Name=Backup Manager GUI' >> backup-manager-gui.desktop
            echo 'Exec=backup-manager-gui' >> backup-manager-gui.desktop
            echo 'Icon=backup-manager' >> backup-manager-gui.desktop
            echo 'Type=Application' >> backup-manager-gui.desktop
            echo 'Categories=Utility;' >> backup-manager-gui.desktop
            # Set Qt6 library and plugin paths for linuxdeployqt
            export LD_LIBRARY_PATH=/usr/lib/qt6/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
            export QT_PLUGIN_PATH=/usr/lib/qt6/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}
            # Bundle Qt, ICU, and plugins using linuxdeployqt
            ./linuxdeployqt-continuous-x86_64.AppImage backup-manager-gui.desktop -appimage -bundle-non-qt-libs -extra-plugins=iconengines,platforms -verbose=2 | tee linuxdeployqt.log || true
            echo "\nlinuxdeployqt log:" && cat linuxdeployqt.log
            echo "\nAppDir usr/lib contents after linuxdeployqt:" && ls -lhR ./usr/lib || true
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-Linux-x86_64-AppImage
          path: '*.AppImage'
          retention-days: 90

  build-macos-universal:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-12, macos-latest]  # macos-12 for Intel, macos-latest for Apple Silicon
        include:
          - os: macos-12
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install vala glib json-glib libsodium qt@6 qtbase qttools cmake pkg-config create-dmg
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build library and CLI
        run: |
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          bash ./build.sh

      - name: Build Qt GUI
        run: |
          export PATH="/opt/homebrew/bin:$(brew --prefix qt@6)/bin:$PATH"
          echo "PATH is: $PATH"
          echo "Qt6 bin dir: $(brew --prefix qt@6)/bin"
          ls -l $(brew --prefix qt@6)/bin || true
          # Symlink moc6 to moc if only moc6 is present
          if command -v moc6 >/dev/null 2>&1 && ! command -v moc >/dev/null 2>&1; then
            ln -sf "$(command -v moc6)" "$(brew --prefix qt@6)/bin/moc"
          fi
          if ! command -v moc >/dev/null 2>&1; then
            echo "Error: moc not found in PATH after exporting Qt6 bin and /opt/homebrew/bin."
            exit 1
          else
            echo "moc found: $(command -v moc)"
          fi
          bash ./build_gui.sh
          cat > "Dvx3 Backup Manager.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>backup-manager-gui</string>
              <key>CFBundleIdentifier</key>
              <string>com.Dvx3.backupmanager</string>
              <key>CFBundleName</key>
              <string>Dvx3 Backup Manager</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          macdeployqt "Dvx3 Backup Manager.app" -verbose=2

      - name: Upload App Bundle for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-macOS-${{ matrix.arch }}-AppBundle
          path: 'Dvx3 Backup Manager.app'
          retention-days: 90

  build-macos-universal-dmg:
    name: macOS Universal DMG
    needs: build-macos-universal
    runs-on: macos-latest
    steps:
      - name: Download x86_64 App Bundle
        uses: actions/download-artifact@v4
        with:
          name: Dvx3-BackupManager-macOS-x86_64-AppBundle
          path: x86_64/

      - name: Download arm64 App Bundle
        uses: actions/download-artifact@v4
        with:
          name: Dvx3-BackupManager-macOS-arm64-AppBundle
          path: arm64/

      - name: Create Universal Binary
        run: |
          set -e
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          # Combine binaries into universal
          lipo -create -output "Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui" \
            x86_64/"Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui" \
            arm64/"Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui"
          lipo -create -output "Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib" \
            x86_64/"Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib" \
            arm64/"Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib"

          # Copy the Info.plist and other files from one (assuming identical)
          cp -r x86_64/"Dvx3 Backup Manager.app" .

          # Run macdeployqt on the universal app
          macdeployqt "Dvx3 Backup Manager.app" -verbose=2

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Dvx3 Backup Manager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Dvx3-BackupManager-macOS-Universal.dmg" \
            "Dvx3 Backup Manager.app" || true

          if [ ! -f "Dvx3-BackupManager-macOS-Universal.dmg" ]; then
            hdiutil create -volname "Dvx3 Backup Manager" \
              -srcfolder "Dvx3 Backup Manager.app" \
              -ov -format UDZO "Dvx3-BackupManager-macOS-Universal.dmg"
          fi

      - name: Upload Universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-macOS-Universal
          path: '*.dmg'
          retention-days: 90

  build-windows-msys2:
    name: Windows x64 (MSYS2)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          run: |
            bash ./build-appimage.sh
            # Create a minimal .desktop file for linuxdeployqt (YAML-safe)
            if [ -f backup-manager-gui ]; then
              # Explicitly copy ICU libraries into AppDir/usr/lib
              mkdir -p usr/lib
              cp /usr/lib/x86_64-linux-gnu/libicu*.so.* usr/lib/ || true
              # Create robust symlinks for ICU libraries (e.g., libicui18n.so -> libicui18n.so.74)
              for lib in usr/lib/libicu*.so.*; do
                base=$(basename "$lib")
                # Extract the soname (e.g., libicui18n.so)
                soname=$(echo "$base" | sed 's/\(libicu[a-z]*\)\.so\..*/\1.so/')
                # Only create symlink if it doesn't already exist or points incorrectly
                if [ ! -e "usr/lib/$soname" ] || [ "$(readlink -f usr/lib/$soname)" != "$(readlink -f usr/lib/$base)" ]; then
                  ln -sf "$base" "usr/lib/$soname"
                fi
              done
              echo '[Desktop Entry]' > backup-manager-gui.desktop
              echo 'Name=Backup Manager GUI' >> backup-manager-gui.desktop
              echo 'Exec=backup-manager-gui' >> backup-manager-gui.desktop
              echo 'Icon=backup-manager' >> backup-manager-gui.desktop
              echo 'Type=Application' >> backup-manager-gui.desktop
              echo 'Categories=Utility;' >> backup-manager-gui.desktop
              # Set Qt6 library and plugin paths for linuxdeployqt
              export LD_LIBRARY_PATH=/usr/lib/qt6/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
              export QT_PLUGIN_PATH=/usr/lib/qt6/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}
              # Bundle Qt, ICU, and plugins using linuxdeployqt
              ./linuxdeployqt-continuous-x86_64.AppImage backup-manager-gui.desktop -appimage -bundle-non-qt-libs -extra-plugins=iconengines,platforms -verbose=2 | tee linuxdeployqt.log || true
              echo "\nlinuxdeployqt log:" && cat linuxdeployqt.log
              echo "\nAppDir usr/lib contents after linuxdeployqt:" && ls -lhR ./usr/lib || true
            fi

      - name: Install Qt6 for MSYS2
        shell: msys2 {0}
        run: |
          set -e
          pacman -Syu --noconfirm
          pacman -S --noconfirm mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-tools

      - name: Build Windows Qt GUI
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/mingw64/bin:$PATH"
          # Find Qt tools in MSYS2/MinGW
          if command -v moc-qt6 >/dev/null 2>&1; then
            MOC=moc-qt6
            RCC=rcc-qt6
          elif command -v moc6 >/dev/null 2>&1; then
            MOC=moc6
            RCC=rcc6
          elif command -v moc >/dev/null 2>&1; then
            MOC=moc
            RCC=rcc
          else
            echo "Error: moc not found in PATH"
            echo "Qt6 tools location:"
            find /mingw64 -name "moc*" -o -name "rcc*" 2>/dev/null || true
            exit 1
          fi

          $MOC backup-manager-gui.hpp -o backup-manager-gui.moc.cpp
          if [ -f resources.qrc ]; then
            $RCC resources.qrc -o resources.rcc.cpp
          fi
          g++ backup-manager-gui.cpp backup-manager-gui.moc.cpp resources.rcc.cpp \
            -o backup-manager-gui.exe \
            -std=c++17 \
            $(pkg-config --cflags --libs Qt6Widgets glib-2.0 gio-2.0 json-glib-1.0 libsodium) \
            -L. -lDvx3
          ls -lh *.exe *.dll || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-Windows-x64
          path: |
            Dvx3.exe
            backup-manager-gui.exe
            libDvx3.dll
            Dvx3.vapi
            Dvx3.h
          retention-days: 90

  build-arm32-debian13:
    name: ARM32 Debian 13 (arm/v7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in ARM container
        run: |
          # Ensure libsodium.vapi is present on host (mounted into container)
          set -e
          ls -la vala-extra-vapis/libsodium.vapi || true
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie bash -c '
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config git \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools qt6-tools-dev tar zstd file && \
              echo "Verifying VAPI in container..." && \
              ls -la vala-extra-vapis/libsodium.vapi && \
              chmod +x build_gui.sh build-raspberry.sh || true && \
              bash ./build_gui.sh && bash ./build-raspberry.sh && ls -lh *.tar.gz || echo "No tarball found"
            '

      - name: Upload ARMv7 package
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-RaspberryPi-ARMv7
          path: '*.tar.gz'
          retention-days: 90

  build-arm64-debian13:
    name: ARM64 Debian 13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          # Ensure libsodium.vapi is present on host (mounted into container)
          set -e
          ls -la vala-extra-vapis/libsodium.vapi || true
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie bash -c '
              set -e
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                valac gcc g++ make cmake pkg-config git \
                libglib2.0-dev libjson-glib-dev libsodium-dev \
                qt6-base-dev qt6-base-dev-tools qt6-tools-dev tar zstd file && \
              echo "Verifying VAPI in container..." && \
              ls -la vala-extra-vapis/libsodium.vapi && \
              chmod +x build_gui.sh build-raspberry.sh || true && \
              bash ./build_gui.sh && bash ./build-raspberry.sh && ls -lh *.tar.gz || echo "No tarball found"
            '

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-RaspberryPi-ARM64
          path: '*.tar.gz'
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-macos-universal-dmg, build-arm32-debian13, build-arm64-debian13, build-windows-msys2]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \$ -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.dll" -o -name "*.vapi" -o -name "*.h" \$ -print0 | \
            xargs -0 -I {} sh -c 'sha256sum "$1" >> CHECKSUMS.txt' -- {}
          echo "Generated checksums:" && cat CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.dll
            artifacts/**/*.vapi
            artifacts/**/*.h
            artifacts/CHECKSUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}