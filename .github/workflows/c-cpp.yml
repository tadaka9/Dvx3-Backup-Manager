name: C/C++ CI

on:
  push:
    branches: [main, master, develop, clean-version]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, develop]  # Added 'develop' to match push branches
  workflow_dispatch:

env:
  VERSION: "0.0.3a101125"

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac gcc g++ make cmake pkg-config \
            libglib2.0-dev libjson-glib-dev libsodium-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            libicu-dev \
            tar zstd file wget

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Check GNU tar version and assert
        run: |
          tar --version
          if ! tar --version | grep -q "GNU tar"; then
            echo "Error: GNU tar is required for dynamic progress."
            exit 1
          fi

      - name: Install FUSE2 for AppImage
        run: sudo apt-get install -y libfuse2

      - name: Build application
        run: |
          chmod +x build_gui.sh build-appimage.sh build-raspberry.sh || true
          # Add Qt6 tools to PATH for Linux
          export PATH="/usr/lib/qt6/bin:$PATH"
          bash ./build_gui.sh

      - name: Check binary dependencies (debug ICU)
        run: |
          set -e
          if [ -f backup-manager-gui ]; then
            echo "Checking dependencies with ldd:"
            ldd backup-manager-gui | grep -i icu || echo "Warning: ICU not detected in ldd output. It may be linked indirectly."
            echo "ICU libs in system:"
            ls -l /usr/lib/x86_64-linux-gnu/libicu*.so* /usr/lib/libicu*.so* 2>/dev/null || echo "No ICU libs found in expected locations."
          fi

      - name: Download AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Create AppImage
        run: |
          set -e
          bash ./build-appimage.sh
          # Create a minimal .desktop file for linuxdeployqt (YAML-safe)
          if [ -f backup-manager-gui ]; then
            # Debug: List ICU files before copying
            echo "Listing ICU files in /usr/lib/x86_64-linux-gnu:"
            ls -l /usr/lib/x86_64-linux-gnu/libicu*.so* || true
            echo "Listing ICU files in /usr/lib:"
            ls -l /usr/lib/libicu*.so* || true
            ICU_COUNT1=$(ls /usr/lib/x86_64-linux-gnu/libicu*.so* 2>/dev/null | wc -l)
            ICU_COUNT2=$(ls /usr/lib/libicu*.so* 2>/dev/null | wc -l)
            if [ "$ICU_COUNT1" -eq 0 ] && [ "$ICU_COUNT2" -eq 0 ]; then
              echo "ERROR: No ICU libraries found in /usr/lib/x86_64-linux-gnu or /usr/lib. AppImage will not work!"
              exit 1
            fi
            # Explicitly copy all ICU libraries into AppDir/usr/lib from both locations
            mkdir -p usr/lib
            if [ "$ICU_COUNT1" -gt 0 ]; then
              cp /usr/lib/x86_64-linux-gnu/libicu*.so* usr/lib/
            fi
            if [ "$ICU_COUNT2" -gt 0 ]; then
              cp /usr/lib/libicu*.so* usr/lib/
            fi
            # Create soname symlinks for ICU libraries (e.g., libicui18n.so -> libicui18n.so.74)
            for lib in usr/lib/libicu*.so.*; do
              base=$(basename "$lib")
              soname=$(echo "$base" | sed 's/\(libicu[a-z]*\)\.so\..*/\1.so/')
              ln -sf "$base" "usr/lib/$soname"
            done
            echo '[Desktop Entry]' > backup-manager-gui.desktop
            echo 'Name=Backup Manager GUI' >> backup-manager-gui.desktop
            echo 'Exec=backup-manager-gui' >> backup-manager-gui.desktop
            echo 'Icon=backup-manager' >> backup-manager-gui.desktop
            echo 'Type=Application' >> backup-manager-gui.desktop
            echo 'Categories=Utility;' >> backup-manager-gui.desktop
            # Set Qt6 library and plugin paths for linuxdeployqt
            export LD_LIBRARY_PATH=/usr/lib/qt6/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
            export QT_PLUGIN_PATH=/usr/lib/qt6/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}
            # Bundle Qt, ICU, and plugins using linuxdeployqt (explicitly include ICU libs)
            EXTRA_LIBS=""
            if ls usr/lib/libicu*.so* 1>/dev/null 2>&1; then
              EXTRA_LIBS="-extra-libs=$(ls usr/lib/libicu*.so* | tr '\n' ',')"
            fi
            ./linuxdeployqt-continuous-x86_64.AppImage backup-manager-gui.desktop -appimage -bundle-non-qt-libs -extra-plugins=iconengines,platforms $EXTRA_LIBS -verbose=2 | tee linuxdeployqt.log || true
            echo "\nlinuxdeployqt log:" && cat linuxdeployqt.log
            echo "\nAppDir usr/lib contents after linuxdeployqt:" && ls -lhR ./usr/lib || true
            # Verify ICU is bundled
            if ! ls ./usr/lib/libicu*.so* 1>/dev/null 2>&1; then
              echo "ERROR: ICU libraries not found in AppDir after linuxdeployqt. Check linuxdeployqt.log for issues."
              exit 1
            fi
          fi

      - name: Debug AppImage ICU libraries
        run: |
          set -e
          # Find the built AppImage
          APPIMAGE=$(ls *.AppImage | head -n1)
          echo "Testing ICU in $APPIMAGE"
          chmod +x "$APPIMAGE"
          # Extract AppImage contents for inspection
          "./$APPIMAGE" --appimage-extract || true
          echo "\nContents of extracted usr/lib:"
          ls -lR squashfs-root/usr/lib || true
          echo "\nTrying to run with LD_LIBRARY_PATH..."
          (cd squashfs-root && LD_LIBRARY_PATH=usr/lib ./AppRun || echo "AppRun failed; check for missing libs.")

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-Linux-x86_64-AppImage
          path: '*.AppImage'
          retention-days: 90

  build-macos-universal:
    name: macOS Universal (Intel + Apple Silicon)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-12, macos-latest]  # macos-12 for Intel, macos-latest for Apple Silicon
        include:
          - os: macos-12
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install vala glib json-glib libsodium qt@6 qtbase qttools cmake pkg-config create-dmg
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Verify VAPI
        run: |
          ls -la vala-extra-vapis/libsodium.vapi
          echo "libsodium.vapi found and ready"

      - name: Build library and CLI
        run: |
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          bash ./build.sh

      - name: Build Qt GUI
        run: |
          set -e
          # Ensure Qt6 bin is at front of PATH for moc discovery
          QT_PREFIX=$(brew --prefix qt@6)
          export PATH="$QT_PREFIX/bin:/opt/homebrew/opt/qt/bin:$PATH"
          echo "PATH is: $PATH"
          echo "Qt6 bin dir: $QT_PREFIX/bin"
          echo "Listing all files in $QT_PREFIX/bin:"
          ls -l $QT_PREFIX/bin || true
          echo "Listing all files in /opt/homebrew/opt/qt/bin:"
          ls -l /opt/homebrew/opt/qt/bin || true
          echo "Homebrew info for qt@6:"
          brew info qt@6 || true
          # Symlink moc6 to moc in both locations if only moc6 is present
          if command -v moc6 >/dev/null 2>&1 && ! command -v moc >/dev/null 2>&1; then
            ln -sf "$(command -v moc6)" "$QT_PREFIX/bin/moc"
            ln -sf "$(command -v moc6)" "/opt/homebrew/opt/qt/bin/moc"
          fi
          if ! command -v moc >/dev/null 2>&1; then
            echo "Error: moc not found in PATH after exporting Qt6 bin and /opt/homebrew/opt/qt/bin."
            echo "Available Qt tools:"
            find $QT_PREFIX /opt/homebrew/opt/qt -name "moc*" 2>/dev/null || true
            exit 1
          else
            echo "moc found: $(command -v moc)"
          fi
          # Run build_gui.sh, fallback to moc6 if moc fails
          if ! bash ./build_gui.sh; then
            echo "Retrying build_gui.sh with moc6..."
            export MOC=moc6
            bash ./build_gui.sh
          fi
          cat > "Dvx3 Backup Manager.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>backup-manager-gui</string>
            <key>CFBundleIdentifier</key>
            <string>com.Dvx3.backupmanager</string>
            <key>CFBundleName</key>
            <string>Dvx3 Backup Manager</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          macdeployqt "Dvx3 Backup Manager.app" -verbose=2

      - name: Upload App Bundle for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: Dvx3-BackupManager-macOS-${{ matrix.arch }}-AppBundle
          path: 'Dvx3 Backup Manager.app'
          retention-days: 90

  build-macos-universal-dmg:
    name: macOS Universal DMG
    needs: build-macos-universal
    runs-on: macos-latest
