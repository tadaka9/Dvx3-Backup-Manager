# Copy selected profiles to the platform user config directory: dvx3/codecs.ini.
# Examples requiring external vendor tools are NOT verified support claims.
# Each semicolon-separated value is one argument. No shell evaluation occurs.
# Use immutable/versioned profile names for archives kept long-term.

[dense-v1]
pipeline=xz;zstd;

# Razor (Christian Martelock's rz.exe): verify your exact release before use.
# Extraction runs in a private working directory containing only payload.bin.
# The archived filename must remain payload.tar.
[razor]
compress=rz;a;{output};{input};
decompress=rz;x;-y;{input};payload.tar;

# A native adapter encapsulates the exact reversible tool invocation.
# Contract: ADAPTER compress|decompress INPUT OUTPUT. Exit nonzero on failure.
# These names are examples, not bundled executables.
[xtool-v1]
adapter=dvx3-xtool-adapter
[srep-v1]
adapter=dvx3-srep-adapter
[lolz-v1]
adapter=dvx3-lolz-adapter
[repack-v1]
pipeline=xtool-v1;srep-v1;lolz-v1;
