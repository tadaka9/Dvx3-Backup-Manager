# GitLab CI/CD Pipeline for Dvx3 Backup Manager
# Auto-generated — mirrors GitHub Actions workflow with full platform support

stages:
  - validate
  - build-linux
  - build-macos
  - build-windows
  - release

variables:
  RELEASE_DIR: "./Releases"
  ARTIFACT_PREFIX: "Dvx3-Backup-Manager"

# =============================================================================
# STAGE: validate
# =============================================================================
validate-yaml-symlinks:
  stage: validate
  script:
    - echo "Checking YAML syntax..."
    - python3 -c "import yaml; data = yaml.safe_load(open('$CI_PROJECT_DIR/.gitlab-ci.yml')); print('Valid YAML')" || exit 1

# =============================================================================
# STAGE: build-linux (Ubuntu runners)
# =============================================================================
build-linux-x86_64:
  stage: build-linux
  image: valac/vala:0.56.2-full
  script:
    - echo "=========================================="
    - echo "  Building for Linux x86_64 (amd64)"
    - sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential valac gcc pkg-config zip libglib2.0-dev libgio-2.0-dev libjson-glib-dev libsodium-dev gir1.2-gtk-4.0 libgtk-4-dev
    - pkg-config --modversion glib-2.0 && pkg-config --modversion json-glib-1.0 && pkg-config --modversion libsodium
    - chmod +x build_all.sh && ./build_all.sh 2>&1 | tee $CI_PROJECT_DIR/build-linux-x86_64.log
    - mkdir -p "$RELEASE_DIR/linux/x86_64" && cp cli_backup_manager "$RELEASE_DIR/linux/x86_64/"

  artifacts:
    paths:
      - Releases/linux/x86_64/cli_backup_manager
      - build-linux-x86_64.log
    when: always
    expire_in: 1 week

build-linux-arm64:
  stage: build-linux
  image: valac/vala:0.56.2-full
  script:
    - echo "=========================================="
    - echo "  Building for Linux arm64 (aarch64)"
    - sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential valac gcc pkg-config zip libglib2.0-dev libgio-2.0-dev libjson-glib-dev libsodium-dev gir1.2-gtk-4.0 libgtk-4-dev
    - pkg-config --modversion glib-2.0 && pkg-config --modversion json-glib-1.0 && pkg-config --modversion libsodium
    - chmod +x build_all.sh && ./build_all.sh 2>&1 | tee $CI_PROJECT_DIR/build-linux-arm64.log
    - mkdir -p "$RELEASE_DIR/linux/aarch64" && cp cli_backup_manager "$RELEASE_DIR/linux/aarch64/"

  artifacts:
    paths:
      - Releases/linux/aarch64/cli_backup_manager
      - build-linux-arm64.log
    when: always
    expire_in: 1 week

# =============================================================================
# STAGE: build-macos (macOS runners)
# =============================================================================
build-macos-x86_64:
  stage: build-macos
  image: valac/vala:0.56.2-full
  script:
    - echo "=========================================="
    - echo "  Building for macOS x86_64 (Intel)"
    - if [ ! -f /usr/local/bin/brew ] && [ ! -f "$(brew --prefix)" ]; then /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"; fi
    - brew install valac cmake zip dos2unix pkg-config glib gtk4 libsodium || true
    - echo "=== Dependency Verification ===" && (pkg-config --exists gio-unix-2.0 && echo "✓ gio-unix-2.0.pc found") || echo "⚠️  GioUnix not available"
    - mkdir -p "$RELEASE_DIR/macos/x86_64"
    - chmod +x build_all.sh && ./build_all.sh 2>&1 | tee $CI_PROJECT_DIR/build-macos-x86_64.log || true
    - if [ -f "cli_backup_manager" ]; then cp cli_backup_manager "$RELEASE_DIR/macos/x86_64/"; else echo "⚠️ Binary not found"; fi

  artifacts:
    paths:
      - Releases/macos/x86_64/cli_backup_manager
      - build-macos-x86_64.log
      - build-all.sh
    when: always
    expire_in: 1 week

build-macos-arm64:
  stage: build-macos
  image: valac/vala:0.56.2-full
  script:
    - echo "=========================================="
    - echo "  Building for macOS ARM64 (Apple Silicon)"
    - if [ ! -f /usr/local/bin/brew ] && [ ! -f "$(brew --prefix)" ]; then /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"; fi
    - brew install valac cmake zip dos2unix pkg-config glib gtk4 libsodium || true
    - echo "=== Dependency Verification ===" && (pkg-config --exists gio-unix-2.0 && echo "✓ gio-unix-2.0.pc found") || echo "⚠️  GioUnix not available"
    - mkdir -p "$RELEASE_DIR/macos/aarch64"
    - chmod +x build_all.sh && ./build_all.sh 2>&1 | tee $CI_PROJECT_DIR/build-macos-arm64.log || true
    - if [ -f "cli_backup_manager" ]; then cp cli_backup_manager "$RELEASE_DIR/macos/aarch64/"; else echo "⚠️ Binary not found"; fi

  artifacts:
    paths:
      - Releases/macos/aarch64/cli_backup_manager
      - build-macos-arm64.log
      - build-all.sh
    when: always
    expire_in: 1 week

# =============================================================================
# STAGE: build-windows (Windows runners with MSYS2)
# =============================================================================
build-windows-x86_64:
  stage: build-windows
  image: valac/vala:0.56.2-full
  before_script:
    - |
      apt-get update -qq && apt-get install -y mingw-w64 vala-gcc-mingw-w64 zip dos2unix 2>/dev/null || true
      echo "MSYS2_PATH=$PATH"
  script:
    - echo "=========================================="
    - echo "  Building for Windows x86_64 (MINGW64)"
    - export PATH="/usr/lib/w64-mingw64/bin:$PATH" || true
    - which msys2-mingw-w64-x86_64-vala || which valac
    - chmod +x build_all.sh && ./build_all.sh 2>&1 | tee $CI_PROJECT_DIR/build-windows-msys2.log || true
    - mkdir -p "$RELEASE_DIR/windows/x86_64"
    - if [ -f "cli_backup_manager.exe" ]; then cp cli_backup_manager.exe "$RELEASE_DIR/windows/x86_64/"; elif [ -f "cli_backup_manager" ]; then cp cli_backup_manager "$RELEASE_DIR/windows/x86_64/"; else echo "⚠️ No binary found"; fi

  artifacts:
    paths:
      - Releases/windows/x86_64/
      - build-windows-msys2.log
      - build-all.sh
    when: always
    expire_in: 1 week

# =============================================================================
# STAGE: release (auto-triggered on tag push)
# =============================================================================
release-on-tag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: always
  script:
    - echo "=========================================="
    - echo "  Creating GitHub/GitLab Release"
    - echo "  Tag: $CI_COMMIT_TAG"
    - |
      RELEASE_URL="https://gitlab.com/$CI_PROJECT_NAMESPACE/-/releases/v${CI_COMMIT_TAG}"
      echo "📦 Release URL: $RELEASE_URL"
      echo ""
      echo "### 🚀 Features"
      echo "- SHA-256 integrity verification for encrypted archives"
      echo "- Multi-algorithm compression (zstd, lz4, snappy, xz, bzip2, gzip)"
      echo "- XChaCha20-Poly1305 / AES-GCM-256 encryption"
      echo "- GTK4 dashboard GUI with real-time progress"
      echo ""
      echo "### 📋 Platform Support"
      echo "- Linux x86_64 ✅"
      echo "- macOS ARM64 (Apple Silicon) ✅"
      echo "- macOS x86_64 ⚠️ Requires Homebrew glib for gio-unix-2.0.pc"
      echo "- Windows x86_64 ✅ (MSYS2)"
    - mkdir -p releases/
    - find $CI_PROJECT_DIR/.gitlab-ci-local-artifacts -type f -name "cli_backup_manager*" | while read f; do cp "$f" "releases/" 2>/dev/null || true; done

# =============================================================================
# STAGE: build-summary (runs after all builds)
# =============================================================================
build-summary:
  stage: build-windows
  script:
    - echo ""
    - echo "=========================================="
    - echo "  Dvx3 Backup Manager — Build Summary"
    - echo "=========================================="
    - find .gitlab-ci-local-artifacts -type f -name "*.log" | while read f; do echo ""; echo "--- $(basename $f) ---"; head -15 "$f" || true; done

  when: always
