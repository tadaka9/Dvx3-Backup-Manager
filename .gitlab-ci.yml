# macOS Universal DMG (combines Intel + ARM64)
.package-macos-dmg:
  stage: package
  needs:
    - build-macos-intel
    - build-macos-arm64
  tags:
    - macos
  before_script:
    - brew install create-dmg || brew upgrade create-dmg || true
  script:
    - mkdir -p universal
    - tar -xzf Dvx3-BackupManager-macOS-Intel-x86_64.tar.gz -C universal/
    - tar -xzf Dvx3-BackupManager-macOS-AppleSilicon-ARM64.tar.gz -C universal/
    # Create universal binary
    - lipo -create -output "universal/Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui" 
        "universal/Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui"
        "universal/Dvx3 Backup Manager.app/Contents/MacOS/backup-manager-gui"
    - |
      create-dmg \
        --volname "Dvx3 Backup Manager" \
        --window-pos 200 120 \
        --window-size 600 400 \
        --icon-size 100 \
        --app-drop-link 425 120 \
        "Dvx3-BackupManager-macOS-Universal.dmg" \
        "universal/Dvx3 Backup Manager.app" || \
      hdiutil create -volname "Dvx3 Backup Manager" \
        -srcfolder "universal/Dvx3 Backup Manager.app" \
        -ov -format UDZO "Dvx3-BackupManager-macOS-Universal.dmg"
  artifacts:
    paths:
      - "*.dmg"
    expire_in: 1 week

# Build and push Docker image to GitLab Container Registry
build-docker-image:
  stage: package
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  tags:
    - docker
    - x86_64
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG=$CI_COMMIT_TAG
      else
        TAG="latest"
      fi
    - docker build -t "${CI_REGISTRY_IMAGE}:${TAG}" .
    - docker push "${CI_REGISTRY_IMAGE}:${TAG}"
    - docker tag "${CI_REGISTRY_IMAGE}:${TAG}" "${CI_REGISTRY_IMAGE}:latest"
    - docker push "${CI_REGISTRY_IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_TAG

# Windows 11 x64 with MSYS2
.build-windows-x64:
  stage: build
  tags:
    - windows
    - shell
  before_script:
    - $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$env:PATH"
    - C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
    - C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-toolchain mingw-w64-x86_64-vala mingw-w64-x86_64-glib2 mingw-w64-x86_64-json-glib mingw-w64-x86_64-libsodium mingw-w64-x86_64-pkgconf mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-tools curl zip"
  script:
    - C:\msys64\usr\bin\bash.exe -lc "cd '$PWD' && ls -la vala-extra-vapis/libsodium.vapi"
    - C:\msys64\usr\bin\bash.exe -lc "cd '$PWD' && tar --version"
    - C:\msys64\usr\bin\bash.exe -lc "cd '$PWD' && chmod +x build.sh build_gui.sh || true"
    - C:\msys64\usr\bin\bash.exe -lc "cd '$PWD' && bash ./build.sh"
    - C:\msys64\usr\bin\bash.exe -lc "cd '$PWD' && bash ./build_gui.sh"
    # Package with required DLLs
    - mkdir dvx3-backup-manager-windows
    - cp backup-manager-gui.exe dvx3-backup-manager-windows/
    - cp Dvx3.exe dvx3-backup-manager-windows/ || cp dvx3.exe dvx3-backup-manager-windows/Dvx3.exe || true
    - cp libDvx3.dll dvx3-backup-manager-windows/ || true
    - cp C:\msys64\mingw64\bin\libglib-2.0-0.dll dvx3-backup-manager-windows/ || true
    - cp C:\msys64\mingw64\bin\libgobject-2.0-0.dll dvx3-backup-manager-windows/ || true
    - cp C:\msys64\mingw64\bin\libjson-glib-1.0-0.dll dvx3-backup-manager-windows/ || true
    - cp C:\msys64\mingw64\bin\libsodium-*.dll dvx3-backup-manager-windows/ || true
    - cp C:\msys64\mingw64\bin\Qt6*.dll dvx3-backup-manager-windows/ || true
    - Compress-Archive -Path dvx3-backup-manager-windows -DestinationPath Dvx3-BackupManager-Windows-x64.zip
  artifacts:
    paths:
      - "*.zip"
      - "*.exe"
      - "*.dll"
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build-debian-x86_64
    - build-arch-x86_64
    - build-debian-arm64
    - build-arch-arm64
    - build-raspberry-armhf
    - build-raspberry-arm64
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \
        --description "Release created using GitLab CI" \
        --assets-link "{\"name\":\"Debian Package (armhf)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dvx3-backup-manager_${VERSION}_armhf.deb?job=build-raspberry-armhf\"}" \
        --assets-link "{\"name\":\"Debian Package (arm64)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dvx3-backup-manager_${VERSION}_arm64.deb?job=build-raspberry-arm64\"}"
  artifacts:
    paths:
      - "*.deb"
      - "*.tar.gz"
      - "*.dmg"
      - "*.zip"
    expire_in: never
