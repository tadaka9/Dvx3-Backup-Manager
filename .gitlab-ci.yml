# Raspberry Pi ARMv7 (armhf) .deb package - CROSS-COMPILATION
build-raspberry-armhf:
  stage: build
  image: debian:trixie
  tags:
    - docker
    - x86_64 # Or use 'arm64' if you prefer
  before_script:
    # Add armhf architecture and update
    - dpkg --add-architecture armhf
    - apt-get update
    # Install cross-compilation toolchain and armhf build dependencies
    - apt-get install -y --no-install-recommends
      crossbuild-essential-armhf
      valac
      pkg-config
      qt6-base-dev-tools
      libglib2.0-dev:armhf
      libjson-glib-dev:armhf
      libsodium-dev:armhf
      qt6-base-dev:armhf
      qt6-tools-dev:armhf
      tar zstd file dpkg-dev fakeroot
  script:
    - echo "Cross-compiling for armhf..."
    - ls -la vala-extra-vapis/libsodium.vapi
    - tar --version
    # Set environment variables for cross-compilation
    - export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig
    - export CC=arm-linux-gnueabihf-gcc
    - export CXX=arm-linux-gnueabihf-g++
    - export QT_MOC_NATIVE=/usr/lib/x86_64-linux-gnu/qt6/libexec/moc
    - chmod +x build_gui.sh build-raspberry.sh build.sh || true
    - bash ./build.sh
    - bash ./build_gui.sh
    - bash ./build-raspberry.sh
    # Create .deb package structure
    - mkdir -p dvx3-backup-manager_${VERSION}_armhf/DEBIAN
    - mkdir -p dvx3-backup-manager_${VERSION}_armhf/usr/bin
    - mkdir -p dvx3-backup-manager_${VERSION}_armhf/usr/lib
    - mkdir -p dvx3-backup-manager_${VERSION}_armhf/usr/share/applications
    - mkdir -p dvx3-backup-manager_${VERSION}_armhf/usr/share/pixmaps
    - cp backup-manager-gui dvx3-backup-manager_${VERSION}_armhf/usr/bin/
    - cp dvx3 dvx3-backup-manager_${VERSION}_armhf/usr/bin/
    - cp libdvx3.so dvx3-backup-manager_${VERSION}_armhf/usr/lib/
    - cp dvx3-backup.png dvx3-backup-manager_${VERSION}_armhf/usr/share/pixmaps/ || true
    - |
      cat > dvx3-backup-manager_${VERSION}_armhf/DEBIAN/control <<EOF
      Package: dvx3-backup-manager
      Version: ${VERSION}
      Section: utils
      Priority: optional
      Architecture: armhf
      Depends: libglib2.0-0, libjson-glib-1.0-0, libsodium23, libqt6widgets6, libqt6core6, tar, zstd
      Maintainer: CryptoWave Team <trapdoorfunction@gmail.com>
      Description: Encrypted backup manager with Qt6 GUI
       Dvx3 Backup Manager provides secure encrypted backups using
       Argon2id key derivation and XSalsa20-Poly1305 encryption.
      EOF
    - dpkg-deb --build dvx3-backup-manager_${VERSION}_armhf
  artifacts:
    paths:
      - "*.deb"
      - "*.tar.gz"
    expire_in: 1 week

