# macOS Intel x86_64
.build-macos-intel:
  stage: build
  tags:
    - macos
    - x86_64
  before_script:
    - brew update || true
    - brew install vala glib json-glib libsodium qt@6 cmake pkg-config create-dmg || brew upgrade vala glib json-glib libsodium qt@6 cmake pkg-config create-dmg || true
    - export PATH="$(brew --prefix qt@6)/bin:$PATH"
  script:
    - ls -la vala-extra-vapis/libsodium.vapi
    - tar --version
    - chmod +x build.sh build_gui.sh || true
    - bash ./build.sh
    - bash ./build_gui.sh
    # Create App Bundle
    - mkdir -p "Dvx3 Backup Manager.app/Contents/MacOS"
    - mkdir -p "Dvx3 Backup Manager.app/Contents/Resources"
    - mkdir -p "Dvx3 Backup Manager.app/Contents/Frameworks"
    - cp backup-manager-gui "Dvx3 Backup Manager.app/Contents/MacOS/"
    - cp libDvx3.dylib "Dvx3 Backup Manager.app/Contents/Frameworks/" || cp libdvx3.so "Dvx3 Backup Manager.app/Contents/Frameworks/libDvx3.dylib" || true
    - cp dvx3-backup.png "Dvx3 Backup Manager.app/Contents/Resources/" || true
    - |
      cat > "Dvx3 Backup Manager.app/Contents/Info.plist" <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>CFBundleExecutable</key>
          <string>backup-manager-gui</string>
          <key>CFBundleIdentifier</key>
          <string>com.cryptowave.dvx3backupmanager</string>
          <key>CFBundleName</key>
          <string>Dvx3 Backup Manager</string>
          <key>CFBundleVersion</key>
          <string>${VERSION}</string>
          <key>CFBundleShortVersionString</key>
          <string>${VERSION}</string>
          <key>NSHighResolutionCapable</key>
          <true/>
      </dict>
      </plist>
      EOF
    - $(brew --prefix qt@6)/bin/macdeployqt "Dvx3 Backup Manager.app" -verbose=2
    - tar -czf Dvx3-BackupManager-macOS-Intel-x86_64.tar.gz "Dvx3 Backup Manager.app"
  artifacts:
    paths:
      - "*.tar.gz"
      - "Dvx3 Backup Manager.app"
    expire_in: 1 week

