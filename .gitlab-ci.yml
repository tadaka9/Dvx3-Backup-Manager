stages:
  - test
  - build
  - package
  - release

variables:
  VERSION: "0.0.3a101125"
  GIT_SUBMODULE_STRATEGY: recursive

# Test on local k8s runner
# Triggering a new pipeline run
k8s-test:
  stage: test
  image: debian:trixie
  tags:
    - local
    - k8s
  script:
    - echo "Running on Kubernetes"
    - uname -a
    - apt-get update && apt-get install -y --no-install-recommends build-essential
    - gcc --version

# Linux x86_64 - Debian
build-debian-x86_64:
  stage: build
  image: debian:trixie
  tags:
    - docker
    - x86_64
  before_script:
    - apt-get update
    - apt-get install -y valac gcc g++ make cmake pkg-config
      libglib2.0-dev libjson-glib-dev libsodium-dev
      qt6-base-dev qt6-base-dev-tools qt6-tools-dev
      tar zstd file
  script:
    - ls -la vala-extra-vapis/libsodium.vapi
    - tar --version
    - chmod +x build_gui.sh || true
    - bash ./build_gui.sh
  artifacts:
    paths:
      - backup-manager-gui
      - libdvx3.so
      - dvx3
      - dvx3.h
      - dvx3.vapi
    expire_in: 1 week

# Linux x86_64 - Arch
build-arch-x86_64:
  stage: build
  image: archlinux:latest
  tags:
    - docker
    - x86_64
  before_script:
    - pacman -Syu --noconfirm
    - pacman -S --noconfirm vala gcc make cmake pkg-config
      glib2 json-glib libsodium qt6-base qt6-tools tar zstd
  script:
    - ls -la vala-extra-vapis/libsodium.vapi
    - tar --version
    - chmod +x build_gui.sh || true
    - bash ./build_gui.sh
  artifacts:
    paths:
      - backup-manager-gui
      - libdvx3.so
      - dvx3
    expire_in: 1 week

